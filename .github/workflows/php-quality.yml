name: PHP Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: composer
        
    - name: Install dependencies
      run: |
        composer install --no-dev --prefer-dist
        
    - name: Find all PHP files for linting
      id: find_php
      run: |
        find . \
          \( -path "./web/modules/custom/*" -o -path "./web/themes/custom/*" -o -path "./scripts/*" \) \
          -name "*.php" -type f > php_files.txt
        echo "PHP files found: $(wc -l < php_files.txt)"
        
    - name: PHP Lint Check
      run: |
        if [ -f php_files.txt ]; then
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo "Checking $file"
              php -l "$file" || exit 1
            fi
          done < php_files.txt
        else
          echo "No PHP files found for linting"
          exit 1
        fi
        
  phpstan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: composer
        
    - name: Install dependencies
      run: |
        composer install --prefer-dist
        
    - name: Run PHPStan
      run: |
        vendor/bin/phpstan analyse \
          web/modules/custom \
          web/themes/custom \
          scripts \
          --level=5 \
          --no-progress \
          --error-format=checkstyle \
          || true  # Continue even if there are issues
