name: PHP Quality Assurance

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  php-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        tools: composer

    - name: Install dependencies
      run: |
        composer install --no-dev --prefer-dist --no-interaction

    - name: Find all PHP files for linting
      id: find_php
      run: |
        find . \
          \( -path "./web/modules/custom/*" -o -path "./web/themes/custom/*" -o -path "./scripts/*" \) \
          -name "*.php" -type f > php_files.txt
        echo "PHP files found: $(wc -l < php_files.txt)"

    - name: PHP Lint Check
      run: |
        if [ -f php_files.txt ]; then
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo "Checking $file"
              php -l "$file" || exit 1
            fi
          done < php_files.txt
        else
          echo "No PHP files found for linting"
          exit 1
        fi

  test-discovery:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        tools: composer

    - name: Install dependencies
      run: |
        composer install --prefer-dist --no-interaction

    - name: Verify PHPUnit discovery
      run: |
        # Fails if a *Test.php is outside every suite, if a mandatory suite is
        # empty, or if the committed phpunit.xml drifted from the tree.
        php scripts/phpunit-suites.php --check

  phpunit-unit:
    runs-on: ubuntu-latest
    needs: test-discovery

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        tools: composer
        coverage: none

    - name: Install dependencies
      run: |
        composer install --prefer-dist --no-interaction

    - name: Install Ghostscript (PdfThumbnailGeneratorTest depende de gs)
      run: sudo apt-get update && sudo apt-get install -y ghostscript

    - name: Run Unit suite
      run: |
        mkdir -p artifacts
        vendor/bin/phpunit --testsuite unit --no-progress \
          --log-junit artifacts/unit-junit.xml \
          --display-warnings --display-deprecations

    - name: Upload Unit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: phpunit-unit
        path: artifacts/unit-junit.xml
        retention-days: 14

  phpunit-kernel:
    runs-on: ubuntu-latest
    # Limite explícito: sem ele, uma suíte travada fica in_progress por horas e não gera log.
    timeout-minutes: 45
    # Dívida conhecida (docs/operations/testing/UI-SUITE-AUDITORIA.md, seção 8): 276 erros e 15 falhas
    # por serviços de módulos não habilitados no teste, schema de commerce_product e tabelas de grupo.
    # Job informativo até a correção: a falha continua visível no log e no resumo do job,
    # mas não bloqueia os demais gates. Não reduzir asserções para ficar verde.
    continue-on-error: true
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: aculta_simpletest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        tools: composer
        extensions: pdo_mysql
        coverage: none

    - name: Install dependencies
      run: |
        composer install --prefer-dist --no-interaction

    - name: Run Kernel suite
      env:
        SIMPLETEST_DB: mysql://root:root@127.0.0.1:3306/aculta_simpletest
      run: |
        mkdir -p artifacts
        vendor/bin/phpunit --testsuite kernel --no-progress \
          --log-junit artifacts/kernel-junit.xml

    - name: Upload Kernel report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: phpunit-kernel
        path: artifacts/kernel-junit.xml
        retention-days: 14

  phpstan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        tools: composer

    - name: Install dependencies
      run: |
        composer install --prefer-dist

    - name: Run PHPStan
      run: |
        # phpstan.neon inclui phpstan-baseline.neon. Novos erros e entradas de
        # baseline resolvidas (reportUnmatchedIgnoredErrors) falham o job.
        vendor/bin/phpstan analyse --no-progress --memory-limit=2G
