name: PHP Quality Assurance

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  php-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: composer

    - name: Install dependencies
      run: |
        composer install --no-dev --prefer-dist --no-interaction

    - name: Find all PHP files for linting
      id: find_php
      run: |
        find . \
          \( -path "./web/modules/custom/*" -o -path "./web/themes/custom/*" -o -path "./scripts/*" \) \
          -name "*.php" -type f > php_files.txt
        echo "PHP files found: $(wc -l < php_files.txt)"

    - name: PHP Lint Check
      run: |
        if [ -f php_files.txt ]; then
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo "Checking $file"
              php -l "$file" || exit 1
            fi
          done < php_files.txt
        else
          echo "No PHP files found for linting"
          exit 1
        fi

  test-discovery:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: composer

    - name: Install dependencies
      run: |
        composer install --prefer-dist --no-interaction

    - name: Verify PHPUnit discovery
      run: |
        # Fails if a *Test.php is outside every suite, if a mandatory suite is
        # empty, or if the committed phpunit.xml drifted from the tree.
        php scripts/phpunit-suites.php --check

  phpunit-unit:
    runs-on: ubuntu-latest
    needs: test-discovery

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: composer
        coverage: none

    - name: Install dependencies
      run: |
        composer install --prefer-dist --no-interaction

    - name: Run Unit suite
      run: |
        mkdir -p artifacts
        vendor/bin/phpunit --testsuite unit --no-progress \
          --log-junit artifacts/unit-junit.xml \
          --display-warnings --display-deprecations

    - name: Upload Unit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: phpunit-unit
        path: artifacts/unit-junit.xml
        retention-days: 14

  phpstan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: composer

    - name: Install dependencies
      run: |
        composer install --prefer-dist

    - name: Run PHPStan ratchet
      run: |
        # Fails only when the error count grows beyond phpstan-baseline-count.txt.
        # The pre-existing debt is burned down incrementally, never masked.
        php scripts/phpstan-ratchet.php
