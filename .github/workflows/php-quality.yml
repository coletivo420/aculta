name: PHP Quality Assurance

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Push and PR are separate groups; the push guard skips SHAs already checked by a PR.
  group: php-quality-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  workflow-guard:
    name: Evita checks duplicados entre push e PR
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
    - name: Decide whether this event needs the PHP suite
      id: guard
      env:
        GH_TOKEN: ${{ github.token }}
        API_URL: ${{ github.api_url }}
        REPOSITORY: ${{ github.repository }}
        COMMIT_SHA: ${{ github.sha }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        if [ "$EVENT_NAME" != "push" ]; then
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        prs="$(curl --fail --silent --show-error \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "$API_URL/repos/$REPOSITORY/commits/$COMMIT_SHA/pulls?per_page=100")"
        open_prs="$(jq --arg sha "$COMMIT_SHA" \
          '[.[] | select(.state == "open" and .head.sha == $sha and (.base.ref == "main" or .base.ref == "dev"))] | length' \
          <<< "$prs")"
        if [ "$open_prs" -gt 0 ]; then
          echo "Este SHA já é validado pelo workflow do PR; pulando a suíte PHP duplicada."
          echo "should_run=false" >> "$GITHUB_OUTPUT"
        else
          echo "should_run=true" >> "$GITHUB_OUTPUT"
        fi

  php-lint:
    needs: workflow-guard
    if: needs.workflow-guard.outputs.should_run == 'true'
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
      with:
        php-version: '8.4'
        tools: composer

    - name: Install dependencies
      run: |
        composer install --no-dev --prefer-dist --no-interaction

    - name: Find all PHP files for linting
      id: find_php
      run: |
        find . \
          \( -path "./web/modules/custom/*" -o -path "./web/themes/custom/*" -o -path "./scripts/*" \) \
          -name "*.php" -type f > php_files.txt
        echo "PHP files found: $(wc -l < php_files.txt)"

    - name: PHP Lint Check
      run: |
        if [ -f php_files.txt ]; then
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo "Checking $file"
              php -l "$file" || exit 1
            fi
          done < php_files.txt
        else
          echo "No PHP files found for linting"
          exit 1
        fi

  test-discovery:
    needs: workflow-guard
    if: needs.workflow-guard.outputs.should_run == 'true'
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
      with:
        php-version: '8.4'
        tools: composer

    - name: Install dependencies
      run: |
        composer install --prefer-dist --no-interaction

    - name: Verify PHPUnit discovery
      run: |
        # Fails if a *Test.php is outside every suite, if a mandatory suite is
        # empty, or if the committed phpunit.xml drifted from the tree.
        php scripts/phpunit-suites.php --check

  phpunit-unit:
    needs: [ workflow-guard, test-discovery ]
    if: needs.workflow-guard.outputs.should_run == 'true'
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
      with:
        php-version: '8.4'
        tools: composer
        coverage: none

    - name: Install dependencies
      run: |
        composer install --prefer-dist --no-interaction

    - name: Install Ghostscript (PdfThumbnailGeneratorTest depende de gs)
      run: sudo apt-get update && sudo apt-get install -y ghostscript

    - name: Run Unit suite
      run: |
        mkdir -p artifacts
        vendor/bin/phpunit --testsuite unit --no-progress \
          --log-junit artifacts/unit-junit.xml \
          --display-warnings --display-deprecations

    - name: Upload Unit report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: phpunit-unit
        path: artifacts/unit-junit.xml
        retention-days: 14

  phpunit-kernel:
    needs: workflow-guard
    if: needs.workflow-guard.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    # Limite explícito: sem ele, uma suíte travada fica in_progress por horas e não gera log.
    timeout-minutes: 45
    # Dívida conhecida (docs/operations/testing/UI-SUITE-AUDITORIA.md, seção 8): 276 erros e 15 falhas
    # por serviços de módulos não habilitados no teste, schema de commerce_product e tabelas de grupo.
    # Job informativo até a correção: a falha continua visível no log e no resumo do job,
    # mas não bloqueia os demais gates. Não reduzir asserções para ficar verde.
    continue-on-error: true
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: aculta_simpletest
        ports:
          - "127.0.0.1:3306:3306"
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
      with:
        php-version: '8.4'
        tools: composer
        extensions: pdo_mysql
        coverage: none

    - name: Install dependencies
      run: |
        composer install --prefer-dist --no-interaction

    - name: Run Kernel suite
      env:
        SIMPLETEST_DB: mysql://root:root@127.0.0.1:3306/aculta_simpletest
      run: |
        mkdir -p artifacts
        vendor/bin/phpunit --testsuite kernel --no-progress \
          --log-junit artifacts/kernel-junit.xml

    - name: Upload Kernel report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: phpunit-kernel
        path: artifacts/kernel-junit.xml
        retention-days: 14

  phpstan:
    needs: workflow-guard
    if: needs.workflow-guard.outputs.should_run == 'true'
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
      with:
        php-version: '8.4'
        tools: composer

    - name: Install dependencies
      run: |
        composer install --prefer-dist

    - name: Run PHPStan
      run: |
        # phpstan.neon inclui phpstan-baseline.neon. Novos erros e entradas de
        # baseline resolvidas (reportUnmatchedIgnoredErrors) falham o job.
        vendor/bin/phpstan analyse --no-progress --memory-limit=2G
