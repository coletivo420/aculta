name: Quality Static (shell, security, browser discovery)

# Complementa php-quality.yml. Não substitui nenhum job existente.
# Regras: sem segredos em PR; sem Runtime compartilhado; sem || true para esconder falha.

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Push and PR are separate groups; the push guard skips SHAs already scanned by a PR.
  group: quality-static-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  workflow-guard:
    name: Evita checks duplicados entre push e PR
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
    - name: Decide whether this event needs static checks
      id: guard
      env:
        GH_TOKEN: ${{ github.token }}
        API_URL: ${{ github.api_url }}
        REPOSITORY: ${{ github.repository }}
        COMMIT_SHA: ${{ github.sha }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        if [ "$EVENT_NAME" != "push" ]; then
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        prs="$(curl --fail --silent --show-error \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "$API_URL/repos/$REPOSITORY/commits/$COMMIT_SHA/pulls?per_page=100")"
        open_prs="$(jq --arg sha "$COMMIT_SHA" \
          '[.[] | select(.state == "open" and .head.sha == $sha and (.base.ref == "main" or .base.ref == "dev"))] | length' \
          <<< "$prs")"
        if [ "$open_prs" -gt 0 ]; then
          echo "Este SHA já é validado pelo workflow do PR; pulando os checks estáticos duplicados."
          echo "should_run=false" >> "$GITHUB_OUTPUT"
        else
          echo "should_run=true" >> "$GITHUB_OUTPUT"
        fi

  shell-quality:
    name: Shell quality (ShellCheck, shfmt, bash -n)
    needs: workflow-guard
    if: needs.workflow-guard.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Install shfmt and bats
      run: |
        sudo apt-get update
        sudo apt-get install -y shfmt bats

    - name: Syntax check of Runtime Sync entrypoint
      run: bash -n scripts/runtime-sync.sh

    - name: ShellCheck on changed shell files
      run: |
        base="${{ github.event.pull_request.base.sha || github.event.before }}"
        if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
          base="$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)"
        fi
        git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.sh' > changed-sh.txt
        if [ ! -s changed-sh.txt ]; then
          echo "Nenhum script .sh alterado: N/A"
          exit 0
        fi
        xargs -a changed-sh.txt shellcheck -S warning

    - name: shfmt diff on changed shell files
      run: |
        if [ ! -s changed-sh.txt ]; then
          echo "Nenhum script .sh alterado: N/A"
          exit 0
        fi
        xargs -a changed-sh.txt shfmt -d -i 2 -ci

  workflow-lint:
    name: actionlint (versão fixada)
    needs: workflow-guard
    if: needs.workflow-guard.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Install actionlint (versão fixada)
      run: python -m pip install --disable-pip-version-check actionlint-py==1.7.12.25

    - name: Lint workflows
      run: actionlint .github/workflows/*.yml

  bats-runtime-sync:
    name: Bats (isolamento do Runtime Sync, sem Runtime)
    needs: workflow-guard
    if: needs.workflow-guard.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install bats
      run: |
        sudo apt-get update
        sudo apt-get install -y bats

    - name: Run Bats suite
      run: bats tests/shell/

  frontend-quality:
    name: Frontend quality (Stylelint, ESLint do tema)
    needs: workflow-guard
    if: needs.workflow-guard.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install declared dependencies (sem scripts)
      run: npm ci --ignore-scripts --no-audit --no-fund

    - name: Stylelint
      run: npm run lint:css

    - name: ESLint (tema)
      run: npm run lint:js

  security-static:
    name: Security static (Semgrep local rules, fixtures, composer audit)
    needs: workflow-guard
    if: needs.workflow-guard.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Install Semgrep (versão fixada)
      run: python -m pip install --disable-pip-version-check semgrep==1.183.0

    - name: Rule fixtures (gate bloqueante)
      run: |
        python3 -I .agents/skills/aculta-seguranca-estatica/tests/check-rule-fixtures.py \
          "$(command -v semgrep)" \
          .agents/skills/aculta-seguranca-estatica/rules/aculta-php.yml \
          .agents/skills/aculta-seguranca-estatica/tests/rules/aculta-php.php

    - name: Semgrep local rules, apenas achado novo (baseline)
      env:
        SEMGREP_RULES: .agents/skills/aculta-seguranca-estatica/rules/aculta-php.yml
      run: |
        # A triagem integral de Semgrep mais recente está registrada em 9d06d2167.
        # Comparar a PR de dev com main reabre centenas de achados históricos já triados.
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          base="9d06d21673d44e09944c14ef31c218aba6db4b0f"
        else
          base="${{ github.event.before }}"
        fi
        if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
          echo "Sem commit base confiável para baseline: execução completa sem baseline."
          semgrep scan --metrics=off --config "$SEMGREP_RULES" --error \
            --exclude vendor --exclude web/core --exclude web/modules/contrib \
            --exclude web/libraries --exclude node_modules \
            --sarif -o semgrep.sarif web/modules/custom web/themes/custom scripts
        else
          semgrep scan --metrics=off --config "$SEMGREP_RULES" --error \
            --baseline-commit "$base" \
            --exclude vendor --exclude web/core --exclude web/modules/contrib \
            --exclude web/libraries --exclude node_modules \
            --sarif -o semgrep.sarif web/modules/custom web/themes/custom scripts
        fi

    - name: Upload SARIF
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: semgrep-sarif
        path: semgrep.sarif
        retention-days: 14
        if-no-files-found: ignore

    - name: Setup PHP for composer audit
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
      with:
        php-version: '8.3'
        tools: composer

    - name: Composer audit (informativo, sem vendor)
      # Informativo: há advisories conhecidos registrados em
      # docs/operations/testing/SEGURANCA-ESTATICA-2026-11-11.md. Bloqueio exige
      # decisão do responsável sobre correção do lock.
      continue-on-error: true
      run: composer audit --locked --no-interaction --format=plain | tee composer-audit.txt

    - name: Upload composer audit report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: composer-audit
        path: composer-audit.txt
        retention-days: 14
        if-no-files-found: ignore

  browser-discovery:
    name: Browser suites discovery (sem execução contra ambiente)
    needs: workflow-guard
    # Execução de acessibilidade e regressão visual exige ACULTA_SITE_ORIGIN de
    # ambiente descartável ou autorizado. Sem isso, o job só valida a descoberta.
    if: needs.workflow-guard.outputs.should_run == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: tests/browser/package-lock.json

    - name: Install browser test dependencies
      working-directory: tests/browser
      run: npm ci --no-audit --no-fund

    - name: Discovery of Playwright suites
      working-directory: tests/browser
      run: npm run test:list
