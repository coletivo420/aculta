uuid: 4f565868-1e8d-4d95-b61f-8e0254c8e5b9
langcode: pt-br
status: true
dependencies: {  }
id: import_1e153c3150f9c6365180e8fb
label: 'UI Patterns: substituir drupal_static() depreciado pelo cache de memória do Drupal'
package: drupal/ui_patterns
version: dev-2.0.x
issue_url: ''
patch: |
  diff --git a/src/PropTypePluginManager.php b/src/PropTypePluginManager.php
  index d7869f0e..f9750902 100644
  --- a/src/PropTypePluginManager.php
  +++ b/src/PropTypePluginManager.php
  @@ -108,9 +108,10 @@ class PropTypePluginManager extends DefaultPluginManager implements FallbackPlug
      */
     public function getAllPropTypeByTypedData(string $data_type): array {
       $cache_id = 'ui_patterns_typed_data_prop_types_' . $data_type;
  -    $prop_types = &\drupal_static($cache_id);
  -    if (\is_array($prop_types)) {
  -      return $prop_types;
  +    $cache = \Drupal::cache('memory');
  +    $cached = $cache->get($cache_id);
  +    if ($cached !== FALSE) {
  +      return $cached->data;
       }
       $prop_types = [];
       $compatibility_map = $this->getTypedDataCompatibilityMap();
  @@ -128,6 +129,7 @@ class PropTypePluginManager extends DefaultPluginManager implements FallbackPlug
           }
         }
       }
  +    $cache->set($cache_id, $prop_types);
       return $prop_types;
     }
   
  @@ -140,9 +142,10 @@ class PropTypePluginManager extends DefaultPluginManager implements FallbackPlug
      * @SuppressWarnings("PHPMD.UnusedFormalParameter")
      */
     private function getTypedDataCompatibilityMap(): array {
  -    $compatibility_map = &\drupal_static(__METHOD__);
  -    if (\is_array($compatibility_map)) {
  -      return $compatibility_map;
  +    $cache = \Drupal::cache('memory');
  +    $cached = $cache->get(__METHOD__);
  +    if ($cached !== FALSE) {
  +      return $cached->data;
       }
       $compatibility_map = [];
       $typed_data_definitions = $this->typedDataManager->getDefinitions();
  @@ -166,6 +169,7 @@ class PropTypePluginManager extends DefaultPluginManager implements FallbackPlug
           }
         }
       }
  +    $cache->set(__METHOD__, $compatibility_map);
       return $compatibility_map;
     }
   
  diff --git a/src/Template/ModuleNodeVisitorAfterSdc.php b/src/Template/ModuleNodeVisitorAfterSdc.php
  index eaddf1d8..201887d7 100755
  --- a/src/Template/ModuleNodeVisitorAfterSdc.php
  +++ b/src/Template/ModuleNodeVisitorAfterSdc.php
  @@ -39,14 +39,17 @@ class ModuleNodeVisitorAfterSdc extends ModuleNodeVisitorBase {
      * {@inheritdoc}
      */
     public function getPriority(): int {
  -    $priority = &\drupal_static(__METHOD__);
  -    if (!isset($priority)) {
  -      $original_node_visitor = new CoreComponentNodeVisitor($this->componentManager);
  -      // Ensure that this node visitor's priority is higher than core's visitor,
  -      // because this class has to run after core's class.
  -      $priority = $original_node_visitor->getPriority() + 1;
  +    $cache = \Drupal::cache('memory');
  +    $cached = $cache->get(__METHOD__);
  +    if ($cached !== FALSE) {
  +      return (int) $cached->data;
       }
  -    return \is_numeric($priority) ? (int) $priority : 0;
  +    $original_node_visitor = new CoreComponentNodeVisitor($this->componentManager);
  +    // Ensure that this node visitor's priority is higher than core's visitor,
  +    // because this class has to run after core's class.
  +    $priority = $original_node_visitor->getPriority() + 1;
  +    $cache->set(__METHOD__, $priority);
  +    return $priority;
     }
   
     /**
  diff --git a/src/Template/ModuleNodeVisitorBeforeSdc.php b/src/Template/ModuleNodeVisitorBeforeSdc.php
  index 82228771..f8229e1e 100755
  --- a/src/Template/ModuleNodeVisitorBeforeSdc.php
  +++ b/src/Template/ModuleNodeVisitorBeforeSdc.php
  @@ -39,14 +39,17 @@ class ModuleNodeVisitorBeforeSdc extends ModuleNodeVisitorBase {
      * {@inheritdoc}
      */
     public function getPriority(): int {
  -    $priority = &\drupal_static(__METHOD__);
  -    if (!isset($priority)) {
  -      $original_node_visitor = new CoreComponentNodeVisitor($this->componentManager);
  -      // Ensure that this node visitor's priority is lower than core's visitor,
  -      // because this class has to run before core's class.
  -      $priority = $original_node_visitor->getPriority() - 1;
  +    $cache = \Drupal::cache('memory');
  +    $cached = $cache->get(__METHOD__);
  +    if ($cached !== FALSE) {
  +      return (int) $cached->data;
       }
  -    return \is_numeric($priority) ? (int) $priority : 0;
  +    $original_node_visitor = new CoreComponentNodeVisitor($this->componentManager);
  +    // Ensure that this node visitor's priority is lower than core's visitor,
  +    // because this class has to run before core's class.
  +    $priority = $original_node_visitor->getPriority() - 1;
  +    $cache->set(__METHOD__, $priority);
  +    return $priority;
     }
   
     /**
source_url: patches/aculta_patcher/ui_patterns_drupal_static_deprecation.patch
