langcode: pt-br
status: true
dependencies: {  }
id: import_fe2093378c76ae375bc89fca
label: 'Fail closed when Turnstile credentials are missing; do not fall back to Math CAPTCHA'
package: drupal/turnstile
version: 1.2.0
issue_url: ''
patch: |
  diff --git a/turnstile.module b/turnstile.module
  --- a/turnstile.module
  +++ b/turnstile.module
  @@ -23,7 +23,7 @@
         if ($captcha_type == 'Turnstile') {
           $config = \Drupal::config('turnstile.settings');
           $renderer = \Drupal::service('renderer');
  -        $turnstile_keys = turnstile_keys();
  +        $turnstile_keys = turnstile_keys() ?: ['site_key' => '', 'secret_key' => ''];
           $turnstile_site_key = $turnstile_keys['site_key'];
           $turnstile_secret_key = $turnstile_keys['secret_key'];
   
  @@ -53,10 +53,22 @@
             $captcha = $turnstile->getWidget('turnstile_captcha_validation');
           }
           else {
  -          // Fallback to Math captcha as Turnstile is not configured. Invoke
  -          // the hook through the module handler so this keeps working if the
  -          // CAPTCHA module converts its procedural hooks to hook classes.
  -          $captcha = \Drupal::moduleHandler()->invoke('captcha', 'captcha', ['generate', 'Math']);
  +          // Fail closed without silently substituting a different challenge.
  +          $captcha = [
  +            'form' => [
  +              'turnstile_unavailable' => [
  +                '#type' => 'item',
  +                '#markup' => t('A verificação de segurança está temporariamente indisponível. Tente novamente mais tarde.'),
  +              ],
  +              'captcha_response' => [
  +                '#type' => 'hidden',
  +                '#value' => '',
  +              ],
  +            ],
  +            'solution' => TRUE,
  +            'captcha_validate' => 'turnstile_captcha_validation',
  +            'cacheable' => TRUE,
  +          ];
           }
   
           // If module configuration changes the form cache need to be refreshed.
source_url: patches/turnstile-no-math-fallback.patch
source_hash: 462367924c81034c807f6e38042606fa1f660de79d2510198542d966b36f6045
