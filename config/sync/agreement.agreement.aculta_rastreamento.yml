agreement: '<p>Este consentimento é opcional e separado dos Termos de Uso e da Política de Privacidade. Com ele, o site registra, para os e-mails da sua conta, a quantidade de aberturas e de cliques em links. O registro guarda apenas contadores e datas, sem endereço IP nem dados do navegador. Você pode revogar a qualquer momento nesta página, e a revogação vale para os próximos e-mails.</p>'
