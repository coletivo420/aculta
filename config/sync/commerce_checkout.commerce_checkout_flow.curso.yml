uuid: 041260a5-3a6a-4d21-8f68-86a51d5bf9e6
langcode: pt-br
status: true
dependencies:
  module:
    - aculta_lms
    - aculta_portal
    - commerce_payment
label: 'Curso (LMS)'
id: curso
plugin: multistep_default
configuration:
  display_checkout_progress: true
  display_checkout_progress_breadcrumb_links: false
  display_sidebar_checkout_complete: true
  guest_order_assign: false
  guest_new_account: true
  guest_new_account_notify: false
  panes:
    login:
      step: login
      weight: 0
      allow_guest_checkout: true
      allow_registration: true
    contact_information:
      step: order_information
      weight: 1
      double_entry: true
    aculta_personal_name:
      step: order_information
      weight: 2
    payment_information:
      step: order_information
      weight: 3
    aculta_fiscal_identity:
      step: review
      weight: 2
    review:
      step: review
      weight: 3
    payment_process:
      step: payment
      weight: 0
      capture: true
    completion_message:
      step: complete
      weight: 4
      message:
        value: "O número do seu pedido é [commerce_order:order_number].\r\nVocê pode acompanhar seu pedido em Minha conta > Meus pedidos. Cursos são liberados após a confirmação do pagamento."
        format: plain_text
      display_pane_summaries: true
    order_summary:
      step: _sidebar
      weight: 5
      view: commerce_checkout_order_summary
    # O LMS não tem envio e o Mercado Pago não exige endereço. Sem esta
    # desabilitação explícita, o pane de endereço usaria o default_step
    # (order_information) e apareceria no checkout do curso.
    aculta_billing_address:
      step: _disabled
      weight: 99
    aculta_shipping_information:
      step: _disabled
      weight: 99
