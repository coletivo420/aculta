confirmation_request:
  subject: 'Solicitação de confirmação de endereço de e-mail de [site:name]'
  body: |-
    Recebemos uma solicitação para confirmar [email-confirmer:confirmation-mail] no site [site:name], em [site:url]. Para confirmar, responda a esta solicitação pelo link abaixo.

    [email-confirmer:confirmation-url]
confirmation_response:
  questions:
    pending: 'Prossiga para confirmar o seu endereço de e-mail.'
    expired: 'Este processo de confirmação de e-mail expirou.'
    cancelled: 'Este processo de confirmação de e-mail foi cancelado.'
    confirmed: 'Seu endereço de e-mail foi confirmado.'
