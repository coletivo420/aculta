uuid: ed75157c-b0f0-4f4d-aaba-5cd80cd016f4
langcode: pt-br
status: true
dependencies:
  config:
    - field.field.node.aculta_forum_topic.body
    - field.field.node.aculta_forum_topic.field_aculta_categories
    - field.field.node.aculta_forum_topic.field_domain_source
    - node.type.aculta_forum_topic
    - search_api.server.aculta_database
  module:
    - aculta_forum
