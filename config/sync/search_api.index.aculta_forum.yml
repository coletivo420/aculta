id: aculta_forum
name: 'Discussões públicas do Growroom420'
description: 'Índice de tópicos públicos e posts revisionáveis do Fórum ACULTA; não inclui comentários contextuais, LMS, Revista ou Wiki.'
read_only: false
field_settings:
  body:
    label: 'Corpo do tópico'
    datasource_id: 'entity:node'
    property_path: 'body:value'
    type: text
    boost: 1.0
    dependencies:
      config:
        - field.storage.node.body
  forum_category:
    label: 'Categoria do Fórum'
    datasource_id: 'entity:node'
    property_path: 'field_aculta_categories:target_id'
    type: integer
    dependencies:
      config:
        - field.storage.node.field_aculta_categories
  forum_domain:
    label: 'Purpose do tópico'
    datasource_id: 'entity:node'
    property_path: 'field_domain_source:target_id'
    type: string
    dependencies:
      config:
        - field.storage.node.field_domain_source
  forum_search_category:
    label: 'Categoria do Fórum (tópico ou post)'
    property_path: forum_search_category
    type: integer
    hidden: true
    dependencies:
      module:
        - aculta_forum
  forum_search_domain:
    label: 'Domain do Fórum (tópico ou post)'
    property_path: forum_search_domain
    type: string
    hidden: true
    dependencies:
      module:
        - aculta_forum
  forum_search_post_published:
    label: 'Post publicado'
    property_path: forum_search_post_published
    type: boolean
    hidden: true
    dependencies:
      module:
        - aculta_forum
  forum_search_topic_grants:
    label: 'Grants de visualização do tópico hospedeiro'
    property_path: forum_search_topic_grants
    type: string
    hidden: true
    dependencies:
      module:
        - aculta_forum
  forum_search_topic_id:
    label: 'Identificador do tópico do Fórum'
    property_path: forum_search_topic_id
    type: integer
    hidden: true
    dependencies:
      module:
        - aculta_forum
  forum_search_topic_published:
    label: 'Tópico hospedeiro publicado'
    property_path: forum_search_topic_published
    type: boolean
    hidden: true
    dependencies:
      module:
        - aculta_forum
  forum_search_type:
    label: 'Tipo de resultado do Fórum'
    property_path: forum_search_type
    type: string
    hidden: true
    dependencies:
      module:
        - aculta_forum
  nid:
    label: 'Identificador do tópico'
    datasource_id: 'entity:node'
    property_path: nid
    type: integer
    dependencies:
      module:
        - node
  node_grants:
    label: 'Informações de acesso ao Node'
    property_path: search_api_node_grants
    type: string
    indexed_locked: true
    type_locked: true
    hidden: true
  status:
    label: Publicado
    datasource_id: 'entity:node'
    property_path: status
    type: boolean
    indexed_locked: true
    type_locked: true
    dependencies:
      module:
        - node
  title:
    label: Título
    datasource_id: 'entity:node'
    property_path: title
    type: text
    boost: 5.0
    dependencies:
      module:
        - node
  post_body:
    label: 'Corpo do post'
    datasource_id: 'entity:aculta_forum_post'
    property_path: 'body:value'
    type: text
    boost: 1.0
    dependencies:
      module:
        - aculta_forum
  post_subject:
    label: 'Assunto do post'
    datasource_id: 'entity:aculta_forum_post'
    property_path: subject
    type: text
    boost: 5.0
    dependencies:
      module:
        - aculta_forum
  type:
    label: 'Tipo de conteúdo'
    datasource_id: 'entity:node'
    property_path: type
    type: string
    dependencies:
      module:
        - node
datasource_settings:
  'entity:node':
    bundles:
      default: false
      selected:
        - aculta_forum_topic
    languages:
      default: true
      selected: {  }
  'entity:aculta_forum_post':
    bundles:
      default: false
      selected:
        - aculta_forum_post
    languages:
      default: true
      selected: {  }
processor_settings:
  add_url: {  }
  content_access:
    weights:
      preprocess_index: -30
      preprocess_query: -30
  entity_status:
    weights:
      preprocess_index: -20
  entity_type: {  }
  forum_post_search_access:
    weights:
      preprocess_index: -35
      preprocess_query: -40
  html_filter:
    weights:
      preprocess_index: -10
    all_fields: false
    fields:
      - body
      - post_body
    title: true
    alt: true
    tags:
      em: 1.5
      h1: 5.0
      h2: 3.0
      h3: 2.0
      strong: 2.0
  ignorecase:
    weights:
      preprocess_index: -20
      preprocess_query: -20
    all_fields: false
    fields:
      - body
      - post_body
      - title
      - post_subject
  language_with_fallback: {  }
  tokenizer:
    weights:
      preprocess_index: -5
      preprocess_query: -5
    all_fields: false
    fields:
      - body
      - post_body
      - title
      - post_subject
    spaces: ''
    ignored: ._-
    overlap_cjk: 1
    minimum_word_size: '3'
  transliteration:
    weights:
      preprocess_index: -2
      preprocess_query: -2
    all_fields: false
    fields:
      - body
      - post_body
      - title
      - post_subject
tracker_settings:
  default:
    indexing_order: fifo
    plugin_id: default
    settings: {  }
options:
  cron_limit: 50
  delete_on_fail: true
  index_directly: true
  track_changes_in_references: true
server: aculta_database
