version: 0.1.0-dev.9
state: Dev
next_phase: 'Concluir Firefox no fluxo de pedido sem enviar pagamento; depois homologar cotação/seleção do checkout, integração de webhook e limites operacionais das etiquetas e rastreamento ([roadmap](web/modules/custom/aculta_portal/modules/aculta_commerce/modules/aculta_commerce_melhorenvio/docs/ROADMAP.md))'
progress_note: '0.1.0-dev.9 salva último CEP válido na sessão anônima ou em user.data autenticado; usa CEP do perfil como padrão e inicia a cotação ao abrir. O bloco varia por user/session e usa max-age 0 para impedir cache de CEP privado. Sem migração; finalidade incluída nas minutas ainda não publicadas. Firefox ESR passou: spinner visível durante resposta AJAX suspensa, cotação sandbox após liberar, CEP anônimo restaurado e recalculado após reload, CEP inválido e viewport 390 px sem overflow. Unit Melhor Envio 129/356 PASS; Kernel wiring 15/69 PASS (130 depreciações Core/contrib); PHPCS/PHP lint/JS check PASS nos arquivos alterados. Nenhuma conta autenticada foi modificada; a sessão anônima descartável recebeu CEP e cotação sintéticos. Checkout completo/seleção e contratação/etiquetas seguem pendentes. Produção aguarda publicação da Política e dos Termos.'
