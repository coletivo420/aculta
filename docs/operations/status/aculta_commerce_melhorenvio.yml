next_phase: 'Concluir Firefox no fluxo de pedido sem enviar pagamento; depois homologar cotação/seleção do checkout, integração de webhook e limites operacionais das etiquetas e rastreamento ([roadmap](web/modules/custom/aculta_portal/modules/aculta_commerce/modules/aculta_commerce_melhorenvio/docs/ROADMAP.md))'
progress_note: '0.1.0-dev.10 mantém último CEP válido na sessão anônima ou em user.data autenticado; usa CEP do perfil como padrão e inicia cotação ao abrir. O endpoint repassa a entrada original ao armazenamento compartilhado para impedir que caracteres removidos convertam texto adulterado em CEP válido; regressões Unit cobrem CEP mascarado e texto adulterado. Unit Melhor Envio 135/377 PASS; Kernel wiring 15/69 PASS (130 depreciações Core/contrib); PHP lint e PHPCS Drupal/DrupalPractice sem erros ou avisos nos arquivos da microfase. Evidência visual anterior do Firefox ESR permanece registrada em dev.9 e não foi repetida nesta microfase. Checkout/seleção e contratação/etiquetas seguem pendentes. Produção aguarda publicação da Política e dos Termos.'
