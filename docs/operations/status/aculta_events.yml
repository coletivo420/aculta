# Status de componente para a tabela do README raiz (gerada). Edite só este arquivo.
version: 0.2.0-dev.1
state: Dev
progress_note: >-
  Fases de Locais e Organizações no ecossistema ACULTA Events implementadas e validadas: dashboard em `/culturas` com busca, filtros por status, paginação e escopo ampliado para membros aprovados de organizações e coorganizações via `OrganizationMembershipManager`, modal de Local em 2 etapas com CEP centralizado (BR), gestão administrativa operacional no MAIN em `/painel-administrativo/eventos/organizacoes` com paginação `pager(20)` e filtros (nome, reivindicação incluindo pendente, revisão de acessos e denúncias UGC), recuperação emergencial de titularidade, modal AJAX Drupal Dialog (`EventOrganizationModalWidget` e `EventOrganizationModalForm`) com busca, prevenção de duplicidades, cadastro sem CEP/rua, respeito a `ocultar_localidade`, fluxo seguro de solicitação de titularidade para não-admins (criação não reivindicada com pedido pendente na moderação, sem titularidade imediata ou atribuição prévia de papel owner), resolução automática de pedidos concorrentes e restauração de status pós-rejeição em `OwnershipClaimService`, filtro contextual na moderação de reivindicações (`OwnershipClaimAdminController`), devolução de foco ao gatilho (`data-portal-trigger`), injeção de dependência em `EventOrganizationMembersForm`, projeção segura no Content Index (`OrganizationContentIndexProvider`) sem vazamento de criador técnico ou endereços postais, e validação estrita no servidor em `EventForm`. Testes Kernel aprovados: EventOrganizationAdminAndModalKernelTest (8/247 PASS), EventOrganizationLifecycleKernelTest (8/229 PASS), OrganizationClaimKernelTest (6/126 PASS), EventContentIndexProviderKernelTest (6/153 PASS), EventDomainBoundaryKernelTest (9/335 PASS). Homologação Runtime permanece pendente.
next_phase: "Homologar no Runtime com Firefox ESR visível e perfil temporário: acesso por purpose, dashboard Culturas, criação de Evento/Datas, popup de Local, perfil de Organização, papéis, teclado, responsividade mobile e estado do formulário pai."
