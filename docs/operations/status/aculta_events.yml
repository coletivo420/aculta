progress_note: >-
  Semgrep 2026-11-12: widgets de Local/Organização e o renderer/route context do fluxo HTMX usam serviços injetados; pré-save de Evento/Local também. Testes Kernel atualizados para os novos construtores. Unit Events 35/70, PHPStan completo, PHPCS, fixtures 20/20, descoberta PHPUnit e gate Portal 1.234 PASS; varredura global 40 achados, nenhum serviço estático em Eventos. Kernel slug/local DEFERRED: harness atual não instala o serviço aculta_user.organization_access_service exigido pelo módulo.
  2026-11-10 ADR-054/055: o cartão da lista pública passou a usar o SDC `card-cultural` pelo template override do tema; Kernel focal 7/7 (130 assertions) valida dados ACL-filtrados e estado cancelado. Render no tema ativo/browser aguardam cutover autorizado.
  A View `eventos_publicos` renderiza `card-cultural` na raiz do purpose Eventos usando IDs e props preparados por `EventCatalogue`, preservando ACL, ocorrências futuras, recorrência, filtros e ordenação. Kernel Events: 155 testes/3.616 assertions PASS (33 depreciações Core/contrib); Firefox ESR: listagem e detalhe em claro/escuro, 320/1440 px, foco visível e zero overflow. Sem baseline visual anterior da listagem. Config da View exportada e sincronizada; as diferenças restantes são preexistentes.
  Runtime `b70e56dbec`: provider `CulturasExperienceProvider` compila no módulo owner Eventos junto ao Studio; sem alterações de grants, dados ou workflow. Browser autenticado/ACL visual permanece pendente.
  Dev.9 integra propostas para Organizações não reivindicadas ao ciclo `aculta_contributions`: adapter com allowlist, fingerprint integral, lock compartilhado, aplicação seletiva e fila administrativa dual-read. Content Admin descobre a fila sob acesso nativo. Decisões enfileiram eventos mínimos e o owner revalida revisão/autor/acesso antes de publicar envelope Messenger; inbox/digest/email pendentes. Events Kernel focal 2/80 PASS; evento/worker Unit 4/7; Content Admin Kernel 4/56 + Unit 1/4. Claims/membros, criação com claim e edição de Organizações reivindicadas preservam os owners atuais. Em 2026-11-01, o Runtime sem `aculta_contributions` causava HTTP 500 em `/we-sativa` e `/we-sativa/verbetes/novo`; após snapshot íntegro SHA-256 `559f28db9332b98b265b26196ae020660e5fe21b39c944791c5badd050847294`, o módulo foi habilitado e os dois paths autenticados responderam HTTP 200. Sem updates ou import de configuração; snapshot em `/home/piradopirata/worktrees/backup-runtime-contributions-500-20261101/`.
  Dev.8 contém um protótipo inicial de sugestões para Organizações sem titular: fila administrativa, decisão auditável, campos allowlisted e revalidação sob lock/transação. Kernel focal 3/81 e Kernels de administração/modal/fronteira 18/606 PASS; PHPCS e validadores de rotas/status PASS. O responsável esclareceu que sugestões em Eventos terão outro caminho; protótipo e update 10016 não estão homologados e não devem ser ativados no Runtime até substituir o fluxo. Runtime permanece inalterado.
  Dev.7 desacopla `EventLocationForm` do container global com injeção de `EventPermissionPolicy` e elimina os apontamentos do PHPCS Drupal/DrupalPractice em todo o módulo: 0 erros, 0 avisos. `git diff --check` PASS. Kernel integral: 131 testes / 2.765 assertions PASS, com 51 depreciações Core/contrib; Unit: 10 testes / 23 assertions PASS. Runtime permanece inalterado.
  Dev.6 adiciona `RsvpPolicyResolver`, que falha fechado para RSVP desligado, política incompleta, contexto Evento/Data/Lote incompatível e ofertas inativas ou pagas; o resolver apenas valida parâmetros e não cria inscrições, coleta dados ou reserva capacidade. `EventOfferKernelTest`: 4 testes / 91 assertions PASS, 12 depreciações Core/contrib. Suíte Kernel Events: 130 testes / 2.741 assertions e Unit: 10 testes / 23 assertions PASS antes da otimização final da consulta de recorrência; o teste Kernel focal foi repetido após ela. PHPCS, validadores de rotas/status e `git diff --check` PASS. Runtime permanece inalterado.
  Dev.5 adiciona campos internos da política D-60 em Evento/Data (update 10015): RSVP desligado, escopo de capacidade, limites, duplicidade, reserva, espera, cancelamento e abrangência de série. Campos não são exibidos ao organizador; capacidade é nominal e não se fazem inscrições nem coleta. `EventRsvpSettingsKernelTest`: 2 testes / 37 assertions PASS, 12 depreciações Core/contrib. Kernel completo Events: 129 testes / 2.709 assertions PASS, 51 depreciações Core/contrib. Runtime permanece inalterado.
  Dev.4 adiciona `aculta_event_offer`, modelo de ofertas/lotes pertencente a Eventos com Evento/Data, modalidade, preço nominal, capacidade, limite e janela de disponibilidade; ofertas são inativas por padrão, administráveis apenas com permissão global e sem rotas públicas. Update 10014 instala a entidade idempotentemente. `EventOfferKernelTest`: 3 testes / 57 assertions PASS; 12 depreciações Core/contrib. PHP lint e PHPCS focais PASS. RSVP, capacidade transacional, item Commerce, pagamento, emissão e check-in não estão implementados; revisão LGPD e parecer fiscal/jurídico mantêm coleta pública e vendas fechadas. Runtime não foi alterado.
  Fases de Locais e Organizações no ecossistema ACULTA Events implementadas e validadas: dados estruturados Schema.org JSON-LD (I-12) enriquecidos em páginas canônicas de Evento (modalidade presencial/online/híbrida, VirtualLocation, ofertas gratuitas/link externo e organizador por perfil/organização), Local (Place, PostalAddress BR respeitando precisão pública e GeoCoordinates) e Organização (Organization, endereço e sameAs), dashboard em `/culturas` com busca, filtros por status, paginação e escopo ampliado para membros aprovados de organizações e coorganizações via `OrganizationMembershipManager`, modal de Local em 2 etapas com CEP centralizado (BR), gestão administrativa operacional no MAIN em `/painel-administrativo/eventos/organizacoes` com paginação `pager(20)` e filtros (nome, reivindicação incluindo pendente, revisão de acessos e denúncias UGC), recuperação emergencial de titularidade, modal AJAX Drupal Dialog (`EventOrganizationModalWidget` e `EventOrganizationModalForm`) com busca, prevenção de duplicidades, cadastro sem CEP/rua, respeito a `ocultar_localidade`, fluxo seguro de solicitação de titularidade para não-admins (criação não reivindicada com pedido pendente na moderação, sem titularidade imediata ou atribuição prévia de papel owner), resolução automática de pedidos concorrentes e restauração de status pós-rejeição em `OwnershipClaimService`, filtro contextual na moderação de reivindicações (`OwnershipClaimAdminController`), devolução de foco ao gatilho (`data-portal-trigger`), injeção de dependência em `EventOrganizationMembersForm`, projeção segura no Content Index (`OrganizationContentIndexProvider`) sem vazamento de criador técnico ou endereços postais, e validação estrita no servidor em `EventForm`. Agenda de Local integrada a Calendar com janela de 30 dias, recorrência, cancelamentos/reagendamentos e ACL por usuário. Suíte Events: Kernel 123 testes / 2.597 assertions e Unit 10 testes / 23 assertions PASS em 2026-11-01, com 51 depreciações Core/contrib; inclui ICS contextual por Local, isolamento entre contas, filtragem por Local e ocultação de Local privado no dashboard. A página de Local verifica recorrências, cancelamentos, reagendamentos e exclusão de Eventos de outro Local. Em 2026-11-02, `EventCalendarItemProviderKernelTest` passou 6/116 com duas contas comuns e anônimo para agenda contextual; homologação Runtime e matriz HTTP ampla de propósito permanecem pendentes.
