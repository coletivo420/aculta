# Status de componente para a tabela do README raiz (gerada). Edite só este arquivo.
state: Dev
next_phase: 'IDX 0.1-F/G/R — avançar integrações progressivas e validar grants operacionais sem ativar módulos owner no Runtime. Wiki tem relações `related_entry`, `wiki_category` e `wiki_image`; Kernel com bootstrap real Wiki + Portal + Index consulta as três via ContentIndexRelationQuery e revalida Entity Access (7/234 MariaDB, sem fixture; ciclo incremental, troca de relação, relações, revisão e falha sem Domain testados). A geração de teste é parcial, sem rebuild/auditoria integral do inventário. Portal é owner do bundle `remote_video` e seu provider mínimo foi registrado. Por decisão do responsável, relações de vídeo aguardam fechamento dos formatos editoriais e contratos de acesso; migração editorial e homologação Runtime permanecem pendentes. Smoke temporário de comandos no Runtime com catálogo vazio passou e foi revertido; operação com catálogo real segue pendente. Benchmarks sintéticos 10k/100k/1M e suíte Kernel MariaDB passaram, sem SLO ou métricas representativas. Carga representativa e execução sobre catálogo com conteúdo no Runtime seguem pendentes ([roadmap](docs/portal/ACULTA-CONTENT-INDEX.md))'
version_note: "`0.1.0-dev.172` (Wiki + Image + Portal + Index bootstrap real, sem fixture: suíte 7/234 PASS; 201 depreciações upstream; backfill, fingerprint, update/hash, troca de relação, delete e três relações consultadas com Entity Access. Sem rebuild integral, auditoria completa ou alteração Runtime. Portal instala e registra `media:remote_video`; service-map e Kernel owner conferem bundle/campo/provider; Runtime `toca`/`aculta_runtime`: ativação temporária resolveu `audit status`, `queue status` e help do rebuild; zero dados antes/depois; módulo Disabled e zero tabelas após desinstalar. Sem rebuild de conteúdo. Concorrência MariaDB em processos PHP independentes: 3/56 PASS; quatro produtores preservam sequência, disputa de claim retorna um vencedor, conclusão obsoleta não finaliza trabalho novo. Kernel rebuild 21/295 PASS. Repetição do benchmark MariaDB 100k: rebuild 182,150 s (549 projeções/s), auditoria 68,991 s, pico 137,5 MiB, zero divergências; descoberta `base_table` 201/201 páginas, ID query p50/p95 1,101/1,684 ms. Harness elimina apenas o job da entidade-semente via Queue API. Amostra sintética, sem SLO. Kernel completa MariaDB 103/1.526 PASS (39 depreciações Core/contrib, 54 PHPUnit); Unit 51/262 PASS. Página mista Wiki/Fórum valida resolução por purpose, acesso individual, ordem e restauração do Domain. Access filter agrupa checagens por purpose. Fórum/Wiki Kernel 4/199 e 2/32 PASS; Wiki agora cobre `related_entry`, `wiki_category` e `wiki_image` por consulta Index e Entity Access. Benchmark Fórum em três execuções: 100 candidatos, membro 703/1.010→386/567 ms p50/p95; visitante 358/502→182/293 ms. Query paginada MariaDB 4/52; cron/traduções 2/28. Drupal 11+ gate 1.159 checks, PHPCS Drupal/lint PASS. Hooks CRUD/cron em classes `#[Hook]` com DI. Benchmarks sintéticos 10k/100k/1M concluídos; em 1M rebuild 2.137,817 s, auditoria 724,020 s, pico 214,5 MiB e zero divergências. Keyset de consulta usa IDs imutáveis e cursors opacos persistidos vinculados a conta/filtros/geração; resultados e relações revalidam Entity Access, sem totais/facetas. Integrações Magazine, Wiki, Fórum, Activity, Gallery, Media, LMS e bridge Statistics têm harnesses/providers, mas homologação grants operacionais, carga representativa e execução sobre catálogo com conteúdo no Runtime continuam pendentes. Por decisão do responsável, relações de vídeo aguardam fechamento dos formatos e contratos de acesso; migração editorial continua pendente."
