progress_note: "Dev.215 incorpora integralmente aculta_lms_resources ao aculta_lms: materiais de apoio (vídeos, galerias, leituras e documentos PDF), controllers e forms de documentos, índice de conteúdo e cleanup de mídia passam para o namespace Drupal\\aculta_lms\\Resources e Drupal\\aculta_lms\\Hook, eliminando o submódulo aculta_lms_resources. Unit 31/236 e Kernel 11/340 PASS. Dev.214 incorpora integralmente aculta_lms_agenda ao aculta_lms: agenda de prazos e eventos de turma, calendário pessoal, tokens e enfileiramento de notificações passam para o namespace Drupal\\aculta_lms\\Agenda, eliminando o submódulo aculta_lms_agenda e tornando o aculta_lms consumidor direto de aculta_calendar e aculta_events. Unit 8/18 e Kernel 5/195 PASS. Dev.213 corrige cache de autorização de matrícula: decisões de acesso a aula, submissão e download agora variam pelas memberships das turmas vinculadas; Unit 272/1.039 e Kernel focal 1/47 PASS. Dev.209 acrescenta teste do LmsFriendlyRouteProcessor: URL de resposta gera tags de listas de aulas/atividades; LMS Unit 271/1.034, PHPCS e PHP lint PASS. Dev.208 corrige cache do currículo: página de aula, access checks e URLs amigáveis recebem tags de listas de aula/atividade. Kernel confirma tags, invalidação após salvar atividade e renderização atualizada; LMS Unit 270/1.027, Kernel focal 1/45 PASS. Dev.207 corrige cache de acesso a evento de turma: negativa inclui dependência do curso pai em rascunho e invalida após publicação; Agenda Kernel 5/195, Unit 8/18, LMS Kernel 41/1.330, Unit 270/1.024 PASS. Avaliação funcional responsiva em Firefox: estrutura do curso sem overflow horizontal; campos de título e questão (635 px) excedem viewport em 320–600 px; sem CSS/tema alterado. Smoke autenticado de evento Runtime pendente pois não há eventos de turma no banco. Dev.206: análise estática Upgrade Status/PHPStan limpa (225 arquivos); corrigida serialização dos serviços nos formulários de mover/reordenar/excluir e metadados @covers. Kernel AcultaLmsInstall 9/409 valida DI restaurada. Dev.205: formulários de aula/atividade e reordenação alertam ao sair com alterações não salvas; JS Unit 3/3 cobre mudança, submissão e reattach. Dev.204: removida answer-form.css, folha obsoleta sem efeito nos temas ACULTA; Kernel confirma resposta/anexo sem anexar biblioteca legado. Course Builder: corrigida assinatura Form API; Firefox docente confirma controles funcionais a 320–1280 px, com overflow 320 px restrito ao Turnstile global. Dev.202: formulário de compra impede inscrição em curso não publicado. Dev.201: Kernel Commerce 1/45 valida turma publicada, turma encerrada excluída, preço/ação e item de carrinho com a turma selecionada, sem gateway. Dev.200: Unit CourseEnrollmentPurchaseForm 2/20 cobre ausência de turmas publicadas e ausência de produto, sem expor botão de compra. Runtime LMS: membro matriculado UID262 abre aula/atividade/link; outsider UID265 e visitante recebem 403 sem título. Dev.199: células da tabela de atividades usam a chave data do Render API; Kernel renderiza conteúdo e link, corrigindo HTTP 500. Dev.198: painel do educador lê a série diária agregada lms.students.by_status por turma, com links GET 7/14/30d, somente dimensões da turma e sem IDs de estudante. Dev.197/196: reordenação por arraste e fallback acessível por teclado, lock/transação e validação de permutação."
next_phase: 'Continuar a fechar os gates LMS; checkout HTTP e revisão visual F7 dependem de produto/turma de negócio disponível. Só depois avançar pagamentos e examinar cada update de banco pendente, ou registrar evidência de que não há updates.'

