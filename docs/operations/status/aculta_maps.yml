# Status de componente para a tabela do README raiz (gerada). Edite só este arquivo.
version: 0.1.0-dev.7
state: Dev
progress_note: >-
  Dev.7: Diagnóstico, apresentação visual de Maps e homologação concluídos em 2026-11-07. Causa dos mapas vazios identificada e corrigida em EventLocation::preSave() (locais existentes sem coordenadas voltam a geocodificar). Tema V2 ajustado com altura responsiva (18rem/24rem/30rem), Leaflet attribution legível, foco visível e ordem mobile-first (mapa -> aviso -> lista). Popups integrados com o SDC map-popup, URLs canônicas e categorias validadas por ACL. Homologação completa via Playwright Firefox (320, 390, 768, 1024, 1440 px, claro/escuro, zoom 200% e no-JS) executada com sucesso e manifest.json registrado. Rotas OSM no MAIN permanecem seguras (403 anônimo) e sem escrita externa.
next_phase: 'Revisar e aprovar a minuta 0.6 com o responsável, publicando-a somente por janela autorizada no Runtime; completar gates LOC/IDX-LOC de propósito e consumidores externos; repetir validação antes de RC ([revisão F0](web/modules/custom/aculta_portal/modules/aculta_maps/docs/REVISAO-TERMOS-MAPAS-2026-10-28.md), [roadmap](web/modules/custom/aculta_portal/modules/aculta_maps/docs/ROADMAP.md)).'
