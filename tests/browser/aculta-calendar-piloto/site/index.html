<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piloto calendário — DHTMLX Scheduler</title>
<link rel="stylesheet" href="dhtmlx/dhtmlxscheduler.css">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  h1 { font-size: 1.2rem; margin: 0.5rem; }
  #scheduler_here { width: 100%; height: 620px; }
</style>
</head>
<body>
<h1>Piloto (dados fictícios)</h1>
<div id="scheduler_here"></div>
<script src="dhtmlx/dhtmlxscheduler.js"></script>
<script>
  // Dados fictícios: nenhum dado real de pessoa ou de local.
  const titulos = ["Oficina de teatro", "Roda de conversa", "Exposição fotográfica", "Sarau", "Show acústico"];
  const eventos = [];
  for (let i = 0; i < 40; i++) {
    const dia = 2 + (i % 20);
    const hora = 9 + (i % 9);
    eventos.push({
      id: i + 1,
      text: titulos[i % titulos.length] + " " + (i + 1),
      start_date: new Date(2026, 10, dia, hora, 0),
      end_date: new Date(2026, 10, dia, hora + 1, 30)
    });
  }
  scheduler.config.first_hour = 8;
  scheduler.config.last_hour = 22;
  scheduler.config.xml_date = "%Y-%m-%d %H:%i";
  if (location.search.includes("keynav=1")) { scheduler.plugins({ key_nav: true }); scheduler.config.key_nav = true; }
  scheduler.init("scheduler_here", new Date(2026, 10, 1), "month");
  scheduler.parse(eventos, "json");
</script>
</body>
</html>
