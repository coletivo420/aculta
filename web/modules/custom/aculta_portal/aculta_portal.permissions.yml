access aculta portal:
  title: Acessar o portal da pessoa usuária
  description: Consultar e administrar somente as próprias informações de conta no portal.
administer aculta appearance settings:
  title: Administrar o modo de cor padrão do site
  description: Definir se o site abre em claro, escuro ou automático para quem não escolheu um modo.
  restrict access: true
administer aculta support settings:
  title: Administrar configurações editoriais de Apoie
  description: Alterar o texto público da página Apoie.
  restrict access: true
administer aculta secrets:
  title: Gerenciar credenciais do ambiente
  description: Cadastrar credenciais, ver valores mascarados e revelar um valor pelo botão de olho. A revelação é registrada no log (nome e usuário).
  restrict access: true
administer aculta deployer:
  title: Ver o status do ACULTA Deployer
  description: Consultar o relatório neutro de fronteiras, correções abertas e credenciais (somente leitura).
  restrict access: true

confirmar email de conta manualmente:
  title: Confirmar o e-mail de uma conta manualmente
  description: Marca o e-mail de uma conta como confirmado pela administração. A ação é registrada no log (administrador e conta, sem o endereço).
  restrict access: true

gerenciar pagamentos de vendas:
  title: Cancelar e estornar pagamentos de vendas
  description: Cancelar pagamento pendente e estornar venda de produto pelo Mercado Pago. Concedido ao gerente de loja. Não inclui doações.
