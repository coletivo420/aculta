    _admin_route: true
aculta_portal.support_my:
  path: /meu-apoio
  defaults:
    _controller: '\Drupal\aculta_portal\Support\Controller\SupportController::mySupport'
    _title: Meu Apoio
  requirements:
    _permission: access aculta portal
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true
aculta_portal.support_subscription_action:
  path: '/meu-apoio/assinatura/{commerce_order}/{acao}'
  defaults:
    _form: '\Drupal\aculta_portal\Support\Form\SubscriptionActionForm'
    _title: 'Doação mensal'
  requirements:
    _permission: access aculta portal
    _user_is_logged_in: 'TRUE'
    acao: 'pausar|reativar|cancelar'
  options:
    no_cache: true
    parameters:
      commerce_order:
        type: entity:commerce_order






aculta_portal.search:
  path: /busca
  defaults:
    _controller: '\Drupal\aculta_portal\Search\SearchPageController::page'
    _title: Buscar
  requirements:
    _permission: access content
aculta_portal.search_popup:
  path: /busca/popup
  defaults:
    _form: '\Drupal\aculta_portal\Search\Form\SearchPopupForm'
    _title: Buscar no site
  requirements:
    _permission: access content
aculta_portal.search_preview:
  path: /busca/previa
  defaults:
    _controller: 'aculta_portal.search_preview_controller:preview'
  requirements:
    _permission: access content
aculta_portal.search_suggestions:
  path: /busca/sugestoes
  defaults:
    _controller: '\Drupal\aculta_portal\Search\SearchPageController::suggestions'
  requirements:
    _permission: access content

aculta_portal.courses_home:
  path: /cursos
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\CoursesController::home'
    _title: Cursos
  requirements:
    _access: 'TRUE'
  options:
    _aculta_domain_purpose: courses
aculta_portal.shop_home:
  path: /loja
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\ShopController::home'
    _title: 'Loja da Associação'
  requirements:
    _access: 'TRUE'
  options:
    _aculta_domain_purpose: shop
aculta_portal.secrets_import:
  path: /painel-administrativo/aculta/segredos
  defaults:
    _controller: 'aculta_portal.secrets_controller:page'
    _title: Credenciais do ambiente
  requirements:
    _permission: administer aculta secrets
  options:
    _admin_route: true
aculta_portal.secrets_clear:
  path: /painel-administrativo/aculta/segredos/apagar/{name}
  defaults:
    _controller: 'aculta_portal.secrets_controller:clear'
    _title: Apagar valor
  requirements:
    _permission: administer aculta secrets
    name: '[A-Z][A-Z0-9_]*'
  options:
    _admin_route: true
aculta_portal.secrets_edit:
  path: /painel-administrativo/aculta/segredos/editar/{name}
  defaults:
    _controller: 'aculta_portal.secrets_controller:edit'
    _title: Alterar credencial
  requirements:
    _permission: administer aculta secrets
    name: '[A-Z][A-Z0-9_]*'
  options:
    _admin_route: true
aculta_portal.secrets_show:
  path: /painel-administrativo/aculta/segredos/mostrar/{name}
  defaults:
    _controller: 'aculta_portal.secrets_controller:show'
    _title: Valor da credencial
  requirements:
    _permission: administer aculta secrets
    name: '[A-Z][A-Z0-9_]*'
  options:
    _admin_route: true
aculta_portal.deployer_status:
  path: /painel-administrativo/aculta/deployer
  defaults:
    _controller: '\Drupal\aculta_portal\Deployer\DeployerStatusController::page'
    _title: ACULTA Deployer
  requirements:
    _permission: administer aculta deployer
  options:
    _admin_route: true
aculta_portal.email_resend:
  path: /confirmar-email/reenviar
  defaults:
    _form: '\Drupal\aculta_portal\Form\EmailResendForm'
    _title: 'Reenviar confirmação de e-mail'
  requirements:
    _user_is_logged_in: 'TRUE'

# Edição do próprio perfil a partir do painel administrativo (MAIN). Redireciona para o formulário do usuário logado
# (entity.user.edit_form). O item de menu do Navigation aponta para esta rota, porque a rota de identidade da Conta
# não existe em MAIN.
aculta_portal.admin_self_edit:
  path: /painel-administrativo/perfil/editar
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\AdminSelfEditController::redirectToOwnEdit'
    _title: 'Editar perfil'
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    _admin_route: true
    no_cache: true

# Popup "Entrar" da barra multidomínio (use-ajax modal). Exceção do Turnstile: ver docs/portal/TURNSTILE.md.
aculta_portal.login_popup:
  path: /entrar/janela
  defaults:
    _form: '\Drupal\aculta_portal\Form\LoginPopupForm'
    _title: Entrar
  requirements:
    _user_is_logged_in: 'FALSE'

# Cadastro em modal (convite do checkout de doação). Sem Turnstile: exceção em TurnstileToggle e docs/portal/TURNSTILE.md.
aculta_portal.register_popup:
  path: /criar-conta/janela
  defaults:
    _entity_form: 'user.register_popup'
    _title: 'Criar conta'
  requirements:
    _access_user_register: 'TRUE'

aculta_portal.email_confirmacao_pendentes:
  path: '/painel-administrativo/contas/nao-confirmadas'
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\PendingEmailConfirmationController::list'
    _title: 'Contas sem e-mail confirmado'
  requirements:
    _permission: 'confirmar email de conta manualmente'
  options:
    _admin_route: true

aculta_portal.email_confirmar_manual:
  path: '/painel-administrativo/contas/{user}/confirmar-email'
  defaults:
    _form: '\Drupal\aculta_portal\Form\AdminEmailConfirmForm'
    _title: 'Confirmar e-mail'
  requirements:
    _permission: 'confirmar email de conta manualmente'
    user: '\d+'
  options:
    _admin_route: true
    parameters:
      user:
        type: entity:user

aculta_portal.relatorio_vendas_pagamento_atualizar:
  path: '/painel-administrativo/loja/vendas/pagamento/{commerce_payment}/atualizar'
  defaults:
    _form: '\Drupal\aculta_portal\Form\SalesPaymentRefreshForm'
    _title: 'Atualizar pagamento'
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    _admin_route: true
    parameters:
      commerce_payment:
        type: entity:commerce_payment

aculta_portal.relatorio_vendas_pagamento_cancelar:
  path: '/painel-administrativo/loja/vendas/pagamento/{commerce_payment}/cancelar'
  defaults:
    _form: '\Drupal\aculta_portal\Form\SalesPaymentCancelForm'
    _title: 'Cancelar pagamento'
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    _admin_route: true
    parameters:
      commerce_payment:
        type: entity:commerce_payment

aculta_portal.relatorio_doacoes:
  path: '/painel-administrativo/loja/doacoes'
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\DonationReportController::report'
    _title: 'Relatório de doações'
  requirements:
    _permission: 'administrar doacoes'
  options:
    _admin_route: true

aculta_portal.relatorio_vendas:
  path: '/painel-administrativo/loja/vendas'
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\SalesReportController::report'
    _title: 'Relatório de vendas'
  requirements:
    _permission: 'view commerce_order'
  options:
    _admin_route: true


aculta_portal.cart_checkout:
  path: /carrinho/finalizar
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\CartCheckoutController::finalizar'
    _title: 'Finalizar carrinho'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: true
