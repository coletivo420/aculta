  defaults:
    _form: '\Drupal\aculta_portal\Appearance\SettingsForm'
    _title: Aparência do site
  requirements:
    _permission: administer aculta appearance settings
  options:
    _admin_route: true
aculta_portal.support_settings:
  path: /painel-administrativo/aculta/apoio
  defaults:
    _form: '\Drupal\aculta_portal\Support\Form\SettingsForm'
    _title: Formas de apoio
  requirements:
    _permission: administer aculta support settings
  options:
    _admin_route: true
aculta_portal.admin:
  path: /painel-administrativo/aculta
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\PortalRequirementsController::overview'
    _title: ACULTA Portal
  requirements:
    _permission: administer site configuration
  options:
    _admin_route: true
aculta_portal.turnstile_settings:
  path: /painel-administrativo/aculta/turnstile
  defaults:
    _form: '\Drupal\aculta_portal\Captcha\Form\TurnstileSettingsForm'
    _title: Turnstile
  requirements:
    _permission: administer site configuration
