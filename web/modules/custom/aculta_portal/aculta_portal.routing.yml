# Visão geral da conta. Caminho interno: o público é a raiz / do Domain ACCOUNT, cujo front aponta para cá
# (o Core reserva / para a rota <front>). Requisição direta a este caminho responde 404 (DomainPurposeRequestSubscriber).
# Aceite dos termos (popup e retorno sem JavaScript). Ver docs/integrations/AUTHENTICATION.md.
aculta_portal.aculta_user_agreement.accept:
  path: /termos/aceitar
  defaults:
    _form: '\Drupal\aculta_portal\Form\AcultaUserAgreementAcceptForm'
    _title: 'Termos de uso'
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true

aculta_portal.dashboard:
  path: /minha-conta
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\PortalController::dashboard'
    _title: Visão geral
  requirements:
    _permission: access aculta portal
  options:
    no_cache: true

aculta_portal.user_upload_settings:
  path: /admin/config/aculta/uploads-usuarios
  defaults:
    _form: '\Drupal\aculta_portal\Form\UserUploadSettingsForm'
    _title: 'Envio de arquivos por usuários'
  requirements:
    _permission: 'administer site configuration'
aculta_portal.my_data:
  path: /dados
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\PortalController::myData'
