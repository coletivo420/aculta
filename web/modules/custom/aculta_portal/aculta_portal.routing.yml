  requirements:
    _permission: access aculta portal
  options:
    no_cache: true

aculta_portal.security_password:
  path: /seguranca/senha
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\PortalController::securityPassword'
    _title: Senha
  requirements:
    _permission: access aculta portal
