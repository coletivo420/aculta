    no_cache: true

aculta_portal.account_courses:
  path: /meus-cursos
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\AccountCoursesController::page'
    _title: Cursos
  requirements:
    _permission: access aculta portal
