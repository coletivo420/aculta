# Visão geral da conta. Caminho interno: o público é a raiz / do Domain ACCOUNT, cujo front aponta para cá
# (o Core reserva / para a rota <front>). Requisição direta a este caminho responde 404 (DomainPurposeRequestSubscriber).
# Aceite dos termos (popup e retorno sem JavaScript). Ver docs/integrations/AUTHENTICATION.md.
aculta_portal.account_terms.accept:
  path: /termos/aceitar
  defaults:
    _form: '\Drupal\aculta_portal\Form\AccountTermsAcceptForm'
    _title: 'Termos de uso'
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true

aculta_portal.dashboard:
  path: /minha-conta
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\PortalController::dashboard'
    _title: Visão geral
  requirements:
    _permission: access aculta portal
  options:
    no_cache: true
aculta_portal.my_data:
  path: /dados
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\PortalController::myData'
    _title: Meus dados
  requirements:
    _permission: access aculta portal
  options:
    no_cache: true
aculta_portal.my_data_address:
  path: /dados/endereco
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\PortalController::address'
    _title: Endereço
  requirements:
    _permission: access aculta portal
  options:
    no_cache: true
aculta_portal.my_data_other:
  path: /dados/outros-dados
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\PortalController::otherData'
    _title: Outros Dados
  requirements:
    _permission: access aculta portal
  options:
    no_cache: true
aculta_portal.connections:
  path: /conexoes
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\PortalController::connections'
    _title: Conexões
  requirements:
    _permission: access aculta portal
  options:
    no_cache: true
aculta_portal.security:
  path: /seguranca
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\PortalController::security'
    _title: E-mail
  requirements:
    _permission: access aculta portal
  options:
    no_cache: true

aculta_portal.security_password:
  path: /seguranca/senha
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\PortalController::securityPassword'
    _title: Senha
  requirements:
    _permission: access aculta portal
  options:
    no_cache: true

aculta_portal.account_courses:
  path: /meus-cursos
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\AccountCoursesController::page'
    _title: Cursos
  requirements:
    _permission: access aculta portal
  options:
    no_cache: true
    _aculta_domain_purpose: account

aculta_portal.support_form:
  path: /apoio
  defaults:
    _form: '\Drupal\aculta_portal\Support\Form\SupportForm'
    _title: Apoie a Associação
  requirements:
    _access: 'TRUE'
aculta_portal.account_settings:
  path: /configuracoes
  defaults:
    _form: '\Drupal\aculta_portal\Appearance\AppearanceForm'
    _title: Configurações
  requirements:
    _permission: access aculta portal
  options:
    no_cache: true
aculta_portal.appearance_settings:
  path: /admin/config/aculta/aparencia
  defaults:
    _form: '\Drupal\aculta_portal\Appearance\SettingsForm'
    _title: Aparência do site
  requirements:
    _permission: administer aculta appearance settings
aculta_portal.support_settings:
  path: /admin/config/aculta/apoio
  defaults:
    _form: '\Drupal\aculta_portal\Support\Form\SettingsForm'
    _title: Formas de apoio
  requirements:
    _permission: administer aculta support settings
aculta_portal.admin:
  path: /admin/config/aculta/portal
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\PortalRequirementsController::overview'
    _title: ACULTA Portal
  requirements:
    _permission: administer site configuration
aculta_portal.turnstile_settings:
  path: /admin/config/aculta/portal/turnstile
  defaults:
    _form: '\Drupal\aculta_portal\Captcha\Form\TurnstileSettingsForm'
    _title: Turnstile
  requirements:
    _permission: administer site configuration
aculta_portal.requirements:
  path: /admin/config/aculta/portal/requisitos
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\PortalRequirementsController::report'
    _title: Status do Portal Aculta
  requirements:
    _permission: administer site configuration
aculta_portal.support_my:
  path: /meu-apoio
  defaults:
    _controller: '\Drupal\aculta_portal\Support\Controller\SupportController::mySupport'
    _title: Meu Apoio
  requirements:
    _permission: access aculta portal
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true






aculta_portal.wiki_home:
  path: /wiki
  defaults:
    _controller: \Drupal\aculta_portal\Controller\WikiController::home
    _title: Wiki420
  requirements:
    _permission: access content

aculta_portal.search:
  path: /busca
  defaults:
    _controller: '\Drupal\aculta_portal\Search\SearchPageController::page'
    _title: Buscar
  requirements:
    _permission: access content
aculta_portal.search_popup:
  path: /busca/popup
  defaults:
    _form: '\Drupal\aculta_portal\Search\Form\SearchPopupForm'
    _title: Buscar no site
  requirements:
    _permission: access content
aculta_portal.search_preview:
  path: /busca/previa
  defaults:
    _controller: 'aculta_portal.search_preview_controller:preview'
  requirements:
    _permission: access content
aculta_portal.search_suggestions:
  path: /busca/sugestoes
  defaults:
    _controller: '\Drupal\aculta_portal\Search\SearchPageController::suggestions'
  requirements:
    _permission: access content
aculta_portal.wiki_search:
  path: /wiki/busca
  defaults:
    _controller: \Drupal\aculta_portal\Controller\WikiController::search
    _title: Buscar na Wiki420
  requirements:
    _permission: access content


aculta_portal.courses_home:
  path: /cursos
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\CoursesController::home'
    _title: Cursos
  requirements:
    _access: 'TRUE'
  options:
    _aculta_domain_purpose: courses
aculta_portal.secrets_import:
  path: /admin/config/aculta/segredos
  defaults:
    _controller: 'aculta_portal.secrets_controller:page'
    _title: Credenciais do ambiente
  requirements:
    _permission: administer aculta secrets
aculta_portal.secrets_clear:
  path: /admin/config/aculta/segredos/apagar/{name}
  defaults:
    _controller: 'aculta_portal.secrets_controller:clear'
    _title: Apagar valor
  requirements:
    _permission: administer aculta secrets
    name: '[A-Z][A-Z0-9_]*'
aculta_portal.secrets_edit:
  path: /admin/config/aculta/segredos/editar/{name}
  defaults:
    _controller: 'aculta_portal.secrets_controller:edit'
    _title: Alterar credencial
  requirements:
    _permission: administer aculta secrets
    name: '[A-Z][A-Z0-9_]*'
aculta_portal.secrets_show:
  path: /admin/config/aculta/segredos/mostrar/{name}
  defaults:
    _controller: 'aculta_portal.secrets_controller:show'
    _title: Valor da credencial
  requirements:
    _permission: administer aculta secrets
    name: '[A-Z][A-Z0-9_]*'
aculta_portal.deployer_status:
  path: /admin/config/aculta/deployer
  defaults:
    _controller: '\Drupal\aculta_portal\Deployer\DeployerStatusController::page'
    _title: ACULTA Deployer
  requirements:
    _permission: administer aculta deployer
aculta_portal.email_resend:
  path: /confirmar-email/reenviar
  defaults:
    _controller: '\Drupal\aculta_portal\Email\EmailResendController::resend'
  requirements:
    _user_is_logged_in: 'TRUE'
    _csrf_token: 'TRUE'
