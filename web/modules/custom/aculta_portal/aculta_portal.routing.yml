aculta_portal.requirements:
  path: /painel-administrativo/aculta/requisitos
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\PortalRequirementsController::report'
    _title: Status do Portal Aculta
  requirements:
    _permission: administer site configuration
