metatag.metatag_tag.schema_organization_legal_name:
  type: text
  label: Nome empresarial
metatag.metatag_tag.schema_organization_alternate_name:
  type: text
  label: Nome fantasia registrado
metatag.metatag_tag.schema_organization_tax_id:
  type: text
  label: CNPJ
metatag.metatag_tag.schema_organization_email:
  type: text
  label: E-mail institucional
metatag.metatag_tag.schema_web_page_name:
  type: text
  label: Nome da página estruturada
metatag.metatag_tag.schema_web_page_url:
  type: text
  label: URL canônica da página estruturada

aculta_portal.settings:
  type: config_object
  label: 'Configurações institucionais do ACULTA Portal'
  mapping:
    institution_data_uuid:
      type: string
      label: 'UUID do bloco institucional canônico'
    institution_transparency_nid:
      type: integer
      label: 'Página de transparência institucional'
    mercado_pago_account_url:
      type: uri
      label: 'Endereço da conta Mercado Pago (caixa de pagamentos em Meus pedidos; vazio oculta o link)'

aculta_portal.user_upload:
  type: config_object
  label: 'Política de upload de arquivos de usuários'
  mapping:
    allowed_extensions:
      type: string
      label: 'Extensões globais permitidas'
    max_size_mb:
      type: integer
      label: 'Tamanho global máximo em megabytes'
    consumers:
      type: sequence
      label: 'Políticas por consumidor'
      sequence:
        type: mapping
        mapping:
          inherit_global:
            type: boolean
            label: 'Herdar política global'
          allowed_extensions:
            type: string
            label: 'Extensões permitidas'
          max_size_mb:
            type: integer
            label: 'Tamanho máximo em megabytes'

aculta_portal.appearance:
  type: config_object
  label: 'Modo de cor padrão do ACULTA Portal'
  mapping:
    default_mode:
      type: string
      label: 'Modo de cor padrão (light, dark ou auto)'
aculta_portal.visual_skins:
  type: config_object
  label: 'Mapeamento visual de skins por Domain ID'
  mapping:
    domains:
      type: mapping
      label: 'Skins por Domain ID'
      mapping:
        aculta_org: { type: string, label: 'Skin do domínio ACULTA' }
        conta_aculta_org: { type: string, label: 'Skin do domínio Conta' }
        apoio_aculta_org: { type: string, label: 'Skin do domínio Apoio' }
        revista420_aculta_org: { type: string, label: 'Skin do domínio Revista' }
        wiki420_aculta_org: { type: string, label: 'Skin do domínio Wiki' }
        loja_aculta_org: { type: string, label: 'Skin do domínio Loja' }
        cursos_aculta_org: { type: string, label: 'Skin do domínio Cursos' }
        forum_aculta_org: { type: string, label: 'Skin do domínio Fórum' }
        links_aculta_org: { type: string, label: 'Skin do domínio Links' }
        eventos_aculta_org: { type: string, label: 'Skin do domínio Eventos' }
# Legacy config retained as a rollback source while aculta_linkweed dual-writes.
aculta_portal.social_links:
  type: config_object
  label: 'Redes sociais públicas da ACULTA'
  mapping:
    instagram:
      type: string
      label: 'URL do Instagram'
    youtube:
      type: string
      label: 'URL do YouTube'
    facebook:
      type: string
      label: 'URL do Facebook'
    buttons:
      type: sequence
      label: 'Botões adicionais da página LINKS'
      sequence:
        type: mapping
        mapping:
          text:
            type: string
            label: 'Texto do botão'
          url:
            type: string
            label: 'Link do botão'

aculta_portal.support:
  type: config_object
  label: 'Formas de apoio'
  mapping:
    intro:
      type: text
      label: 'Introdução pública'
    amounts:
      type: sequence
      label: 'Valores padrão (R$)'
      sequence:
        type: integer
    custom_amount:
      type: boolean
      label: 'Permite valor personalizado'

aculta_portal.role_hierarchy:
  type: config_object
  label: 'Cadeia de papéis'
  mapping:
    cadeia:
      type: sequence
      label: 'Papéis da cadeia, do mais alto ao mais baixo'
      sequence:
        type: string

aculta_portal.simplified_account:
  type: config_object
  label: 'Cadastro simplificado ao concluir compra'
  mapping:
    enabled:
      type: boolean
      label: 'Cadastro simplificado habilitado'
    resend_window:
      type: integer
      label: 'Intervalo entre reenvios de confirmação (segundos)'

aculta_portal.checkout_settings:
  type: config_object
  label: 'Configurações de checkout do ACULTA Portal'
  mapping:
    common_checkout_enabled:
      type: boolean
      label: 'Checkout comum do Commerce habilitado'
    shop_order_type:
      type: string
      label: 'Tipo de pedido da Loja'
    lms_order_type:
      type: string
      label: 'Tipo de pedido do LMS'
