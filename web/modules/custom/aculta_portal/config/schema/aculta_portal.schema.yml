metatag.metatag_tag.schema_organization_legal_name:
  type: text
  label: Nome empresarial
metatag.metatag_tag.schema_organization_alternate_name:
  type: text
  label: Nome fantasia registrado
metatag.metatag_tag.schema_organization_tax_id:
  type: text
  label: CNPJ
metatag.metatag_tag.schema_organization_email:
  type: text
  label: E-mail institucional
metatag.metatag_tag.schema_web_page_name:
  type: text
  label: Nome da página estruturada
metatag.metatag_tag.schema_web_page_url:
  type: text
  label: URL canônica da página estruturada

aculta_portal.settings:
  type: config_object
  label: 'Configurações institucionais do ACULTA Portal'
  mapping:
    institution_data_uuid:
      type: string
      label: 'UUID do bloco institucional canônico'
    institution_transparency_nid:
      type: integer
      label: 'Página de transparência institucional'
    mercado_pago_account_url:
      type: uri
      label: 'Endereço da conta Mercado Pago (caixa de pagamentos em Meus pedidos; vazio oculta o link)'

aculta_portal.appearance:
  type: config_object
  label: 'Modo de cor padrão do ACULTA Portal'
  mapping:
    default_mode:
      type: string
      label: 'Modo de cor padrão (light, dark ou auto)'
aculta_portal.social_links:
  type: config_object
  label: 'Redes sociais públicas da ACULTA'
  mapping:
    instagram:
      type: string
      label: 'URL do Instagram'
    youtube:
      type: string
      label: 'URL do YouTube'
    facebook:
      type: string
      label: 'URL do Facebook'
    buttons:
      type: sequence
      label: 'Botões adicionais da página LINKS'
      sequence:
        type: mapping
        mapping:
          text:
            type: string
            label: 'Texto do botão'
          url:
            type: string
            label: 'Link do botão'
