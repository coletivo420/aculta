aculta_cgu.admin_reports:
  path: '/painel-administrativo/moderacao/denuncias'
  defaults:
    _controller: '\Drupal\aculta_cgu\Controller\UgcModerationDashboardController::overview'
    _title: 'Fila de denúncias'
  requirements:
    _custom_access: '\Drupal\aculta_cgu\Controller\UgcModerationDashboardController::access'
  options:
    _admin_route: true

aculta_cgu.report_decide:
  path: '/painel-administrativo/moderacao/denuncias/{aculta_ugc_report}/decidir'
  defaults:
    _form: '\Drupal\aculta_cgu\Form\UgcReportDecisionForm'
    _title: 'Decidir denúncia de conteúdo'
  requirements:
    _custom_access: '\Drupal\aculta_cgu\Form\UgcReportDecisionForm::access'
  options:
    _admin_route: true
