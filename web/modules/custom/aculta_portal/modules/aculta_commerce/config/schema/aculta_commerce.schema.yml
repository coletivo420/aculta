aculta_commerce.aculta_shipment_type.*:
  type: config_entity
  label: 'ACULTA shipment type'
  mapping:
    id:
      type: string
      label: 'ID'
    label:
      type: label
      label: 'Label'
    uuid:
      type: string
      label: 'UUID'
    profileType:
      type: string
      label: 'Profile type'
    traits:
      type: sequence
      label: 'Traits'
      sequence:
        type: string
        label: 'Trait'
    sendConfirmation:
      type: boolean
      label: 'Send confirmation'
    confirmationBcc:
      type: string
      label: 'Confirmation BCC'

aculta_commerce.aculta_shipping_method.plugin.*:
  type: aculta_commerce_shipping_method_configuration
  label: 'ACULTA shipping method plugin'

aculta_commerce_shipping_method_configuration:
  type: mapping
  label: 'ACULTA shipping method configuration'
  mapping:
    default_package_type:
      type: string
      label: 'Default package type'
    services:
      type: sequence
      label: 'Services'
      sequence:
        type: string
        label: 'Service'
    workflow:
      type: string
      label: 'Workflow'

aculta_commerce.aculta_shipping_method.plugin.aculta_flat_rate:
  type: aculta_commerce_shipping_method_configuration
  mapping:
    rate_label:
      type: label
      label: 'Rate label'
    rate_description:
      type: label
      label: 'Rate description'
    rate_amount:
      type: field.value.commerce_price
      label: 'Rate amount'

aculta_commerce.aculta_shipping_method.plugin.aculta_flat_rate_per_item:
  type: aculta_commerce.aculta_shipping_method.plugin.aculta_flat_rate

commerce_checkout.commerce_checkout_pane.aculta_shipping_information:
  type: commerce_checkout_pane_configuration
  mapping:
    auto_recalculate:
      type: boolean
      label: 'Auto recalculate shipping costs when the shipping address changes'
    require_shipping_profile:
      type: boolean
      label: 'Hide shipping costs until an address is entered'

commerce_order.commerce_order_type.*.third_party.aculta_commerce:
  type: mapping
  label: 'ACULTA Commerce shipping settings'
  mapping:
    shipment_type:
      type: string
      label: 'Shipment type'
