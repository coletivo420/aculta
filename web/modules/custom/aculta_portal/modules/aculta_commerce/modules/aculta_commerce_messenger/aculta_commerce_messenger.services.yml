services:
  Drupal\aculta_commerce_messenger\CommerceOrderNoticeManagerInterface: '@aculta_commerce_messenger.notice_manager'
  aculta_commerce_messenger.notice_manager:
    class: Drupal\aculta_commerce_messenger\CommerceOrderNoticeManager
    arguments: ['@entity_type.manager', '@aculta_portal.domain_purpose', '@aculta_portal.checkout_settings', '@aculta_messenger.aviso_preferencias', '@queue', '@lock.persistent', '@logger.channel.aculta_commerce_messenger']
    tags:
      - { name: aculta_messenger.aviso_digest_provider }
  aculta_commerce_messenger.order_notice_publisher:
    class: Drupal\aculta_commerce_messenger\EventSubscriber\CommerceOrderNoticePublisher
    arguments: ['@aculta_portal.checkout_settings', '@entity_type.manager', '@aculta_messenger.notice_event_publisher', '@datetime.time', '@logger.channel.aculta_commerce_messenger']
    tags:
      - { name: event_subscriber }
  aculta_commerce_messenger.notice_event_subscriber:
    class: Drupal\aculta_commerce_messenger\EventSubscriber\CommerceOrderNoticeConsumer
    arguments: ['@aculta_commerce_messenger.notice_manager']
    tags:
      - { name: event_subscriber }
  Drupal\aculta_commerce_messenger\Hook\CommerceOrderNoticeHooks:
    class: Drupal\aculta_commerce_messenger\Hook\CommerceOrderNoticeHooks
    arguments: ['@aculta_commerce_messenger.notice_manager']
  aculta_commerce_messenger.notice_access:
    class: Drupal\aculta_commerce_messenger\AccessCommerceOrderNotice
    arguments: ['@aculta_commerce_messenger.notice_manager', '@current_user']
  aculta_commerce_messenger.notice_open_controller:
    class: Drupal\aculta_commerce_messenger\Controller\CommerceOrderNoticeOpenController
    arguments: ['@aculta_commerce_messenger.notice_manager', '@current_user']
  Drupal\aculta_commerce_messenger\Mail\CommerceOrderNoticeMailType:
    class: Drupal\aculta_commerce_messenger\Mail\CommerceOrderNoticeMailType
    arguments: ['@string_translation']
    tags:
      - { name: aculta_mailer.type }
  logger.channel.aculta_commerce_messenger:
    parent: logger.channel_base
    arguments: ['aculta_commerce_messenger']
