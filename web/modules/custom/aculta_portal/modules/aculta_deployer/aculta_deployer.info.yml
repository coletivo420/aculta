name: 'ACULTA Deployer'
type: module
description: 'Complemento opcional do ACULTA Portal: prepara builds e raiz pública Hostinger por symlink, verifica sitemap, robots e credenciais, e publica o relatório neutro lido pelo painel do Portal. A CLI é standalone (bin/aculta-deployer); o módulo não tem serviços próprios e o Portal funciona sem ele.'
package: 'ACULTA Portal'
core_version_requirement: ^11.3
version: '0.1.25'
dependencies:
  - aculta_portal:aculta_portal
