aculta_document_viewer.settings:
  path: '/painel-administrativo/aculta/leitor-documentos'
  defaults:
    _form: '\Drupal\aculta_document_viewer\Form\DocumentViewerSettingsForm'
    _title: 'Leitor de documentos — Geral'
    section: 'aculta_document_viewer_general'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: true

