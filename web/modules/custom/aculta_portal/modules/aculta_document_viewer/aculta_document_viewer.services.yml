services:
  aculta_document_viewer.csp_report_request_guard:
    class: Drupal\aculta_document_viewer\EventSubscriber\CspReportRequestGuardSubscriber
    tags:
      - { name: event_subscriber }

  aculta_document_viewer.content_index_provider:
    class: Drupal\aculta_portal\ContentIndex\MediaContentIndexProvider
    arguments: ['document', 'document']
    tags:
      - { name: aculta_index.provider }

  aculta_document_viewer.course_document_content_index_provider:
    class: Drupal\aculta_portal\ContentIndex\MediaContentIndexProvider
    arguments: ['course_document', 'course_document', 'courses']
    tags:
      - { name: aculta_index.provider }

  aculta_document_viewer_group.course_document_content_index_provider:
    alias: aculta_document_viewer.course_document_content_index_provider

  aculta_document_viewer.pdf_builder:
    class: Drupal\aculta_document_viewer\Pdf\PdfViewerBuilder
    arguments: ['@file_url_generator', '@url_generator', '@current_user', '@aculta_document_viewer.pdf_thumbnail_builder', '@config.factory']

  aculta_document_viewer.builder:
    alias: aculta_document_viewer.pdf_builder

  aculta_document_viewer.pdf_thumbnail_builder:
    class: Drupal\aculta_document_viewer\Pdf\PdfPreviewThumbnailBuilder
    arguments: ['@aculta_image.pdf_thumbnail', '@config.factory', '@aculta_image.generated_file', '@aculta_image.render', '@aculta_image.inspector', '@file_system', '@logger.channel.aculta_document_viewer']

  aculta_document_viewer.thumbnail_builder:
    alias: aculta_document_viewer.pdf_thumbnail_builder

  logger.channel.aculta_document_viewer:
    parent: logger.channel_base
    arguments: ['aculta_document_viewer']

  aculta_document_viewer.doc_package_validator:
    class: Drupal\aculta_document_viewer\Docx\DocxPackageValidator

  aculta_document_viewer.docx_package_validator:
    alias: aculta_document_viewer.doc_package_validator

  aculta_document_viewer.doc_builder:
    class: Drupal\aculta_document_viewer\Docx\DocxViewerBuilder
    arguments: ['@file_url_generator', '@url_generator', '@file_system', '@aculta_document_viewer.doc_package_validator', '@extension.list.module', '@logger.channel.aculta_document_viewer', '@config.factory']

  aculta_document_viewer.docx_builder:
    alias: aculta_document_viewer.doc_builder

  aculta_document_viewer.sheet_builder:
    class: Drupal\aculta_document_viewer\Spreadsheet\SpreadsheetViewerBuilder
    arguments: ['@file_url_generator', '@url_generator', '@file_system', '@extension.list.module', '@aculta_document_viewer.sheet_file_validator', '@logger.channel.aculta_document_viewer', '@config.factory']

  aculta_document_viewer.spreadsheet_builder:
    alias: aculta_document_viewer.sheet_builder

  aculta_document_viewer.sheet_file_validator:
    class: Drupal\aculta_document_viewer\Spreadsheet\SpreadsheetFileValidator

  aculta_document_viewer.spreadsheet_file_validator:
    alias: aculta_document_viewer.sheet_file_validator

  aculta_document_viewer.readable_mime:
    class: Drupal\aculta_document_viewer\Document\ReadableMime
    arguments: ['@string_translation']
