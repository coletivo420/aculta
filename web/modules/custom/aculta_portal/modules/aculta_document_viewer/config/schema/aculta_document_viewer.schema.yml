aculta_document_viewer.settings:
  type: config_object
  label: 'Configurações do leitor PDF ACULTA'
  mapping:
    show_download:
      type: boolean
      label: 'Exibir link de download'
    show_print:
      type: boolean
      label: 'Exibir impressão'
    show_zoom:
      type: boolean
      label: 'Exibir controles de zoom'
    show_rotation:
      type: boolean
      label: 'Exibir controle de rotação'
    show_outline:
      type: boolean
      label: 'Exibir contorno do PDF'
    show_page_thumbnails:
      type: boolean
      label: 'Exibir miniaturas de páginas'
    show_fullscreen:
      type: boolean
      label: 'Exibir tela cheia'
    show_search:
      type: boolean
      label: 'Exibir busca'
    show_page_navigation:
      type: boolean
      label: 'Exibir navegação de páginas'
    show_full_viewer:
      type: boolean
      label: 'Exibir link para o leitor completo'
    default_zoom:
      type: string
      label: 'Zoom inicial'
    default_scroll:
      type: string
      label: 'Rolagem inicial'
    double_page:
      type: boolean
      label: 'Ativar página dupla'
    double_page_mobile:
      type: boolean
      label: 'Manter página dupla em telas móveis'
    language:
      type: string
      label: 'Idioma do leitor'
    embed_title:
      type: label
      label: 'Título acessível'
    link_text:
      type: label
      label: 'Texto do link'
    link_target:
      type: string
      label: 'Destino do link'
    css_class:
      type: string
      label: 'Classe CSS adicional'
    docx_render_headers:
      type: boolean
      label: 'Exibir cabeçalhos DOCX'
    docx_render_footers:
      type: boolean
      label: 'Exibir rodapés DOCX'
    docx_render_footnotes:
      type: boolean
      label: 'Exibir notas de rodapé DOCX'
    docx_render_endnotes:
      type: boolean
      label: 'Exibir notas de fim DOCX'
    docx_respect_page_breaks:
      type: boolean
      label: 'Respeitar quebras de página DOCX'
    spreadsheet_default_mode:
      type: string
      label: 'Modo inicial da planilha'
    spreadsheet_page_size:
      type: integer
      label: 'Linhas por página no modo tabela'

aculta_document_viewer.formatter_settings:
  type: mapping
  label: 'Configurações dos leitores de documentos ACULTA'
  mapping:
    show_download:
      type: boolean
    show_print:
      type: boolean
    show_zoom:
      type: boolean
    show_rotation:
      type: boolean
    show_outline:
      type: boolean
    show_page_thumbnails:
      type: boolean
    show_fullscreen:
      type: boolean
    show_search:
      type: boolean
    show_page_navigation:
      type: boolean
    show_full_viewer:
      type: boolean
    use_site_settings:
      type: boolean
    default_zoom:
      type: string
    default_scroll:
      type: string
    double_page:
      type: boolean
    double_page_mobile:
      type: boolean
    language:
      type: string
    embed_title:
      type: label
    link_text:
      type: label
    link_target:
      type: string
    css_class:
      type: string

field.formatter.settings.aculta_document_pdf_media:
  type: aculta_document_viewer.formatter_settings
  label: 'Configurações do formatter de mídia PDF ACULTA'

field.formatter.settings.aculta_document_media:
  type: aculta_document_viewer.formatter_settings
  label: 'Configurações dos leitores de mídia documental ACULTA'

field.formatter.settings.aculta_document_pdf_file:
  type: aculta_document_viewer.formatter_settings
  label: 'Configurações do formatter de arquivo PDF ACULTA'
