services:
  aculta_editor.fluent_emoji_catalog:
    class: Drupal\aculta_editor\FluentEmojiCatalog
    public: true
  aculta_editor.fluent_emoji_asset_resolver:
    class: Drupal\aculta_editor\Service\FluentEmojiAssetResolver
    arguments: ['@theme.manager']
    public: true
  aculta_editor.fluent_emoji_icon_adapter:
    class: Drupal\aculta_editor\Service\FluentEmojiIconAdapter
    arguments: ['@aculta_editor.fluent_emoji_catalog', '@plugin.manager.icon_pack']
    public: true
