  requirements:
    _entity_access: 'aculta_event.update'
    aculta_event: '\d+'
  options:
    _aculta_domain_purpose: eventos
    no_cache: true
    parameters:
      aculta_event:
        type: entity:aculta_event

aculta_events.organizer_event_date_edit:
