  requirements:
    _access: 'TRUE'
  options:
    _aculta_domain_purpose: eventos
    _aculta_calendar_rotas: {agenda: aculta_events.agenda, month: aculta_events.month, day: aculta_events.day, ics: aculta_events.ics, embed: aculta_events.embed, interactive: aculta_events.interactive}

