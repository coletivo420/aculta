aculta_events.catalogue:
  path: '/eventos'
  defaults:
    _controller: '\Drupal\aculta_events\Controller\EventCatalogueController::page'
    _title: 'Eventos da ACULTA'
  requirements:
    _access: 'TRUE'
  options:
    _aculta_domain_purpose: eventos

aculta_events.page:
  path: '/eventos/{slug}'
  defaults:
    _controller: '\Drupal\aculta_events\Controller\EventPageController::page'
    _title_callback: '\Drupal\aculta_events\Controller\EventPageController::titulo'
  requirements:
    _access: 'TRUE'
    slug: '[a-z0-9]+(-[a-z0-9]+)*'
  options:
    _aculta_domain_purpose: eventos

aculta_events.locations:
  path: '/locais'
  defaults:
    _controller: '\Drupal\aculta_events\Controller\LocationListController::page'
    _title: 'Locais'
  requirements:
    _access: 'TRUE'
  options:
    _aculta_domain_purpose: eventos

aculta_events.map:
  path: '/mapa'
  defaults:
    _controller: '\Drupal\aculta_events\Controller\MapController::page'
    _title: 'Mapa de locais'
  requirements:
    _access: 'TRUE'
  options:
    _aculta_domain_purpose: eventos

aculta_events.ics:
  path: '/calendario/exportar.ics'
  defaults:
    _controller: '\Drupal\aculta_events\Controller\EventIcsController::periodo'
    _title: 'Exportar eventos'
  requirements:
    _access: 'TRUE'
  options:
    _aculta_domain_purpose: eventos

aculta_events.date_rule:
  path: '/eventos/datas/{aculta_event_date}/recorrencia'
  defaults:
    _form: '\Drupal\aculta_events\Form\EventDateRuleForm'
    _title: 'Recorrência da data'
  requirements:
    _permission: 'administer aculta events'
    aculta_event_date: '\d+'
  options:
    _aculta_domain_purpose: eventos

aculta_events.occurrence:
  path: '/eventos/datas/{aculta_event_date}/ocorrencia/{inicio}'
  defaults:
    _form: '\Drupal\aculta_events\Form\EventDateOccurrenceForm'
    _title: 'Editar ocorrência'
  requirements:
    _permission: 'administer aculta events'
    aculta_event_date: '\d+'
    inicio: '\d+'
  options:
    _aculta_domain_purpose: eventos

aculta_events.agenda:
  path: '/calendario'
  defaults:
    _controller: '\Drupal\aculta_events\Controller\EventAgendaController::page'
    _title: 'Calendário de eventos'
  requirements:
    _access: 'TRUE'
  options:
    _aculta_domain_purpose: eventos

aculta_events.month:
  path: '/calendario/mes/{ano}/{mes}'
  defaults:
    _controller: '\Drupal\aculta_events\Controller\EventAgendaController::mes'
    _title_callback: '\Drupal\aculta_events\Controller\EventAgendaController::tituloMes'
  requirements:
    _access: 'TRUE'
    ano: '\d{4}'
    mes: '\d{1,2}'
  options:
    _aculta_domain_purpose: eventos

aculta_events.day:
  path: '/calendario/dia/{ano}/{mes}/{dia}'
  defaults:
    _controller: '\Drupal\aculta_events\Controller\EventAgendaController::dia'
    _title_callback: '\Drupal\aculta_events\Controller\EventAgendaController::tituloDia'
  requirements:
    _access: 'TRUE'
    ano: '\d{4}'
    mes: '\d{1,2}'
    dia: '\d{1,2}'
  options:
    _aculta_domain_purpose: eventos

aculta_events.date_ics:
  path: '/eventos/{slug}/data/{id}.ics'
  defaults:
    _controller: '\Drupal\aculta_events\Controller\EventIcsController::data'
    _title: 'Exportar data do evento'
  requirements:
    _access: 'TRUE'
    slug: '[a-z0-9]+(-[a-z0-9]+)*'
    id: '\d+'
  options:
    _aculta_domain_purpose: eventos

aculta_events.embed:
  path: '/calendario/incorporar'
  defaults:
    _controller: '\Drupal\aculta_events\Controller\EventEmbedController::page'
    _title: 'Calendário de eventos da ACULTA'
  requirements:
    _access: 'TRUE'
  options:
    _aculta_domain_purpose: eventos
