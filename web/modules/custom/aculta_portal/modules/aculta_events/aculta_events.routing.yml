    _title: 'Editar data do evento'
  requirements:
    _entity_access: 'aculta_event.update'
    _custom_access: '\Drupal\aculta_events\Access\EventDateRouteAccess::access'
    aculta_event: '\d+'
    aculta_event_date: '\d+'
  options:
    _aculta_domain_purpose: eventos
    no_cache: true
    parameters:
      aculta_event:
        type: entity:aculta_event
      aculta_event_date:
        type: entity:aculta_event_date

aculta_events.organizer_event_date_delete:
