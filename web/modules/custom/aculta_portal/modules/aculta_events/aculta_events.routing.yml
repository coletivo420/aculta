aculta_events.catalogue:
  path: '/eventos'
  defaults:
    _controller: '\Drupal\aculta_events\Controller\EventCatalogueController::page'
    _title: 'Eventos da ACULTA'
  requirements:
    _access: 'TRUE'
  options:
    _aculta_domain_purpose: eventos

aculta_events.event_add:
  path: '/eventos/adicionar'
  defaults:
    _entity_form: 'aculta_event.add'
    _title: 'Cadastrar evento'
  requirements:
    _entity_create_access: 'aculta_event'
  options:
    _aculta_domain_purpose: eventos

aculta_events.event_edit:
  path: '/eventos/{aculta_event}/editar'
  defaults:
    _entity_form: 'aculta_event.edit'
    _title: 'Editar evento'
  requirements:
    _entity_access: 'aculta_event.update'
    aculta_event: '\d+'
  options:
    _aculta_domain_purpose: eventos

aculta_events.page:
  path: '/eventos/{slug}'
  defaults:
    _controller: '\Drupal\aculta_events\Controller\EventPageController::page'
    _title_callback: '\Drupal\aculta_events\Controller\EventPageController::titulo'
  requirements:
    _access: 'TRUE'
    slug: '[a-z0-9]+(-[a-z0-9]+)*'
  options:
    _aculta_domain_purpose: eventos

aculta_events.locations:
  path: '/locais'
  defaults:
    _controller: '\Drupal\aculta_events\Controller\LocationListController::page'
    _title: 'Locais'
  requirements:
    _access: 'TRUE'
  options:
    _aculta_domain_purpose: eventos

aculta_events.location_canonical:
  path: '/locais/{aculta_event_location}'
  defaults:
    _controller: '\Drupal\aculta_events\Controller\LocationPageController::page'
    _title_callback: '\Drupal\aculta_events\Controller\LocationPageController::title'
  requirements:
    _entity_access: 'aculta_event_location.view'
    aculta_event_location: '\d+'
  options:
    _aculta_domain_purpose: eventos

aculta_events.location_add:
  path: '/locais/adicionar'
  defaults:
    _entity_form: 'aculta_event_location.add'
    _title: 'Adicionar local'
  requirements:
    _entity_create_access: 'aculta_event_location'
  options:
    _admin_route: true
    _aculta_domain_purpose: eventos

aculta_events.location_edit:
  path: '/locais/{aculta_event_location}/editar'
  defaults:
    _entity_form: 'aculta_event_location.edit'
    _title: 'Editar local'
  requirements:
    _entity_access: 'aculta_event_location.update'
    aculta_event_location: '\d+'
  options:
    _admin_route: true
    _aculta_domain_purpose: eventos

aculta_events.location_delete:
  path: '/locais/{aculta_event_location}/excluir'
  defaults:
    _entity_form: 'aculta_event_location.delete'
    _title: 'Excluir local'
  requirements:
    _entity_access: 'aculta_event_location.delete'
    aculta_event_location: '\d+'
  options:
    _admin_route: true
    _aculta_domain_purpose: eventos

aculta_events.date_add:
  path: '/painel-administrativo/eventos/datas/adicionar'
  defaults:
    _form: '\Drupal\aculta_events\Form\EventDateCreateForm'
    _title: 'Adicionar data de evento'
  requirements:
    _permission: 'administer aculta events'
  options:
    _admin_route: true
    _aculta_domain_purpose: eventos

aculta_events.map:
  path: '/mapa'
  defaults:
    _controller: '\Drupal\aculta_events\Controller\MapController::page'
    _title: 'Mapa de locais'
  requirements:
    _access: 'TRUE'
  options:
    _aculta_domain_purpose: eventos

aculta_events.ics:
  path: '/calendario/exportar.ics'
  defaults:
    _controller: '\Drupal\aculta_calendar\Controller\IcsController::periodo'
    _title: 'Exportar eventos'
  requirements:
    _access: 'TRUE'
  options:
    _aculta_domain_purpose: eventos

aculta_events.date_rule:
  path: '/eventos/datas/{aculta_event_date}/recorrencia'
  defaults:
    _form: '\Drupal\aculta_events\Form\EventDateRuleForm'
    _title: 'Recorrência da data'
  requirements:
    _permission: 'administer aculta events'
    aculta_event_date: '\d+'
  options:
    _aculta_domain_purpose: eventos

aculta_events.occurrence:
  path: '/eventos/datas/{aculta_event_date}/ocorrencia/{inicio}'
  defaults:
    _form: '\Drupal\aculta_events\Form\EventDateOccurrenceForm'
    _title: 'Editar ocorrência'
  requirements:
    _permission: 'administer aculta events'
    aculta_event_date: '\d+'
    inicio: '\d+'
  options:
    _aculta_domain_purpose: eventos

aculta_events.agenda:
  path: '/calendario'
  defaults:
    _controller: '\Drupal\aculta_calendar\Controller\AgendaController::page'
    _title: 'Calendário de eventos'
  requirements:
    _access: 'TRUE'
  options:
    _aculta_domain_purpose: eventos
    _aculta_calendar_rotas: {agenda: aculta_events.agenda, month: aculta_events.month, day: aculta_events.day, ics: aculta_events.ics, embed: aculta_events.embed, interactive: aculta_events.interactive}

aculta_events.month:
  path: '/calendario/mes/{ano}/{mes}'
  defaults:
    _controller: '\Drupal\aculta_calendar\Controller\AgendaController::mes'
    _title_callback: '\Drupal\aculta_calendar\Controller\AgendaController::tituloMes'
  requirements:
    _access: 'TRUE'
    ano: '\d{4}'
    mes: '\d{1,2}'
  options:
    _aculta_domain_purpose: eventos
    _aculta_calendar_rotas: {agenda: aculta_events.agenda, month: aculta_events.month, day: aculta_events.day, ics: aculta_events.ics, embed: aculta_events.embed, interactive: aculta_events.interactive}

aculta_events.day:
  path: '/calendario/dia/{ano}/{mes}/{dia}'
  defaults:
    _controller: '\Drupal\aculta_calendar\Controller\AgendaController::dia'
    _title_callback: '\Drupal\aculta_calendar\Controller\AgendaController::tituloDia'
  requirements:
    _access: 'TRUE'
    ano: '\d{4}'
    mes: '\d{1,2}'
    dia: '\d{1,2}'
  options:
    _aculta_domain_purpose: eventos
    _aculta_calendar_rotas: {agenda: aculta_events.agenda, month: aculta_events.month, day: aculta_events.day, ics: aculta_events.ics, embed: aculta_events.embed, interactive: aculta_events.interactive}

aculta_events.date_ics:
  path: '/eventos/{slug}/data/{id}/calendario.ics'
  defaults:
    _controller: '\Drupal\aculta_events\Controller\EventIcsController::data'
    _title: 'Exportar data do evento'
  requirements:
    _access: 'TRUE'
    slug: '[a-z0-9]+(-[a-z0-9]+)*'
    id: '\d+'
  options:
    _aculta_domain_purpose: eventos

aculta_events.interactive:
  path: '/calendario/interativo'
  defaults:
    _controller: '\Drupal\aculta_calendar\Controller\InteractiveController::page'
    _title: 'Calendário interativo'
  requirements:
    _access: 'TRUE'
  options:
    _aculta_domain_purpose: eventos
    _aculta_calendar_rotas: {agenda: aculta_events.agenda, month: aculta_events.month, day: aculta_events.day, ics: aculta_events.ics, embed: aculta_events.embed, interactive: aculta_events.interactive}

aculta_events.embed:
  path: '/calendario/incorporar'
  defaults:
    _controller: '\Drupal\aculta_calendar\Controller\EmbedController::page'
    _title: 'Calendário de eventos da ACULTA'
  requirements:
    _access: 'TRUE'
  options:
    _aculta_domain_purpose: eventos
