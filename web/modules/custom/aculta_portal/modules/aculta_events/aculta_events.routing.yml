aculta_events.catalogue:
  path: '/eventos'
  defaults:
    _controller: '\Drupal\aculta_events\Controller\EventCatalogueController::page'
    _title: 'Eventos da ACULTA'
  requirements:
    _access: 'TRUE'
  options:
    _aculta_domain_purpose: eventos

aculta_events.organizer_dashboard:
  path: '/culturas'
  defaults:
    _controller: '\Drupal\aculta_events\Controller\EventOrganizerDashboardController::page'
    _title: 'ACULTA Studio Culturas'
  requirements:
    _permission: 'access aculta portal'
    _user_is_logged_in: 'TRUE'
  options:
    _aculta_domain_purpose: eventos
    no_cache: true

aculta_events.organizer_event_add:
  path: '/culturas/eventos/novo'
  defaults:
    _entity_form: 'aculta_event.add'
    _title: 'Cadastrar evento'
  requirements:
    _entity_create_access: 'aculta_event'
  options:
    _aculta_domain_purpose: eventos
    no_cache: true

aculta_events.organizer_event_edit:
  path: '/culturas/eventos/{aculta_event}/editar'
  defaults:
    _entity_form: 'aculta_event.edit'
    _title: 'Editar evento'
  requirements:
    _entity_access: 'aculta_event.update'
    aculta_event: '\d+'
  options:
    _aculta_domain_purpose: eventos
    no_cache: true
    parameters:
      aculta_event:
        type: entity:aculta_event

aculta_events.organizer_event_date_add:
  path: '/culturas/eventos/{aculta_event}/datas/adicionar'
  defaults:
    _form: '\Drupal\aculta_events\Form\EventDateCreateForm'
