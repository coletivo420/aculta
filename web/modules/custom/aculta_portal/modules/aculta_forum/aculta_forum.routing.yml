aculta_forum.admin:
  path: '/painel-administrativo/forum'
  defaults:
    _controller: '\Drupal\aculta_forum\Controller\ForumAdminOverviewController::overview'
    _title: 'Painel Growroom420'
  requirements:
    _permission: 'access content overview'

aculta_forum.legacy_admin_redirect:
  path: '/painel-administrativo/conteudo/forum'
  defaults:
    _controller: '\Drupal\aculta_forum\Controller\ForumAdminOverviewController::redirectToOverview'
  requirements:
    _permission: 'access content overview'
  methods: [GET, HEAD, POST]

aculta_forum.legacy_admin_topic_move_redirect:
  path: '/painel-administrativo/conteudo/forum/{node}/mover-categoria'
  defaults:
    _controller: '\Drupal\aculta_forum\Controller\ForumAdminOverviewController::redirectToOverview'
  requirements:
    _permission: 'access content overview'
    node: '\d+'
  methods: [GET, HEAD, POST]

aculta_forum.legacy_admin_comment_move_redirect:
  path: '/painel-administrativo/conteudo/forum/comentario/{comment}/mover'
  defaults:
    _controller: '\Drupal\aculta_forum\Controller\ForumAdminOverviewController::redirectToOverview'
  requirements:
    _permission: 'access content overview'
    comment: '\d+'
  methods: [GET, HEAD, POST]

aculta_forum.legacy_admin_comments_redirect:
  path: '/painel-administrativo/conteudo/forum/comentarios'
  defaults:
    _controller: '\Drupal\aculta_forum\Controller\ForumAdminOverviewController::redirectToOverview'
  requirements:
    _permission: 'access content overview'
  methods: [GET, HEAD, POST]

aculta_forum.legacy_admin_comments_published_redirect:
  path: '/painel-administrativo/conteudo/forum/comentarios/publicados'
  defaults:
    _controller: '\Drupal\aculta_forum\Controller\ForumAdminOverviewController::redirectToOverview'
  requirements:
    _permission: 'access content overview'
  methods: [GET, HEAD, POST]

aculta_forum.legacy_admin_comments_rejected_redirect:
  path: '/painel-administrativo/conteudo/forum/comentarios/rejeitados'
  defaults:
    _controller: '\Drupal\aculta_forum\Controller\ForumAdminOverviewController::redirectToOverview'
  requirements:
    _permission: 'access content overview'
  methods: [GET, HEAD, POST]

aculta_forum.legacy_admin_comments_pending_redirect:
  path: '/painel-administrativo/conteudo/forum/comentarios/aguardando-moderacao'
  defaults:
    _controller: '\Drupal\aculta_forum\Controller\ForumAdminOverviewController::redirectToOverview'
  requirements:
    _permission: 'access content overview'
  methods: [GET, HEAD, POST]

aculta_forum.topic_add:
  path: '/criar-topico'
  defaults:
    _entity_form: 'node.default'
    _title: 'Criar tópico'
    entity_type_id: node
    node_type: aculta_forum_topic
    bundle_parameter: node_type
  requirements:
    _entity_create_access: 'node:{node_type}'
  options:
    parameters:
      node_type:
        type: 'entity:node_type'
        with_config_overrides: true

aculta_forum.mark_all_read:
  path: '/discussoes/marcar-tudo-como-lido'
  defaults:
    _form: '\Drupal\aculta_forum\Form\ForumMarkAllReadForm'
    _title: 'Marcar discussões como lidas'
  requirements:
    _custom_access: 'aculta_forum.read_access:access'

aculta_forum.topic_move:
  path: '/painel-administrativo/forum/{node}/mover-categoria'
  defaults:
    _controller: '\Drupal\aculta_forum\Controller\ForumAdminOverviewController::redirectToOverview'
  requirements:
    _permission: 'move aculta forum topics'
  options:
    parameters:
      node:
        type: 'entity:node'
  methods: [GET, HEAD, POST]

aculta_forum.comment_move:
  path: '/painel-administrativo/forum/comentarios/{comment}/mover'
  defaults:
    _form: '\Drupal\aculta_forum\Form\ForumCommentMoveForm'
    _title: 'Mover comentário do fórum'
  requirements:
    _permission: 'move aculta forum comments'
  options:
    parameters:
      comment:
        type: 'entity:comment'
  methods: [GET, HEAD, POST]

aculta_forum.comment_move_legacy_redirect:
  path: '/painel-administrativo/forum/comentario/{comment}/mover'
  defaults:
    _controller: '\Drupal\aculta_forum\Controller\ForumAdminOverviewController::redirectToOverview'
  requirements:
    _permission: 'access content overview'
    comment: '\d+'
  methods: [GET, HEAD, POST]

aculta_forum.settings:
  path: '/painel-administrativo/forum/configuracoes'
  defaults:
    _form: '\Drupal\aculta_forum\Form\ForumSettingsForm'
    _title: 'Configurações do Fórum'
  requirements:
    _permission: 'administer aculta forum settings'
  methods: [GET, HEAD, POST]

aculta_forum.attachment_dialog:
  path: '/forum/anexos/adicionar/{filter_format}'
  defaults:
    _form: '\Drupal\aculta_forum\Form\ForumAttachmentUploadDialogForm'
    _title: 'Adicionar anexo à discussão'
  requirements:
    _permission: 'post comments'
    _custom_access: 'aculta_forum.attachment_upload_access:access'
  options:
    parameters:
      filter_format:
        type: 'entity:filter_format'
  methods: [GET, HEAD, POST]

aculta_forum.gallery_dialog:
  path: '/forum/galerias/adicionar/{filter_format}'
  defaults:
    _form: '\Drupal\aculta_forum\Form\ForumGalleryUploadDialogForm'
    _title: 'Criar galeria de imagens'
  requirements:
    _permission: 'post comments'
    _custom_access: 'aculta_forum.attachment_upload_access:access'
  options:
    parameters:
      filter_format:
        type: 'entity:filter_format'
  methods: [GET, HEAD, POST]
