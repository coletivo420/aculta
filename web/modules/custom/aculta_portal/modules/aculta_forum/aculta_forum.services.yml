services:
  aculta_forum.comment_migration_audit:
    class: Drupal\aculta_forum\Migration\ForumCommentMigrationAudit
    arguments: ['@entity_type.manager', '@aculta_portal.domain_purpose', '@module_handler']

  Drupal\aculta_forum\Controller\ForumPostSubmissionController:
    class: Drupal\aculta_forum\Controller\ForumPostSubmissionController
    arguments: ['@entity_type.manager', '@entity.form_builder', '@request_stack', '@current_user', '@aculta_forum.discussion_context_resolver']
  Drupal\aculta_forum\Controller\ForumPostEditController:
    class: Drupal\aculta_forum\Controller\ForumPostEditController
    arguments: ['@entity.form_builder', '@aculta_forum.post_public_edit_access']
  Drupal\aculta_forum\Controller\ForumPostModerationFormController:
    class: Drupal\aculta_forum\Controller\ForumPostModerationFormController
    arguments: ['@entity_type.manager', '@entity.form_builder']
  Drupal\aculta_forum\Controller\ForumPostModerationQueueController:
    class: Drupal\aculta_forum\Controller\ForumPostModerationQueueController
    arguments: ['@entity_type.manager', '@current_user', '@date.formatter', '@aculta_portal.domain_purpose']
  Drupal\aculta_forum\Controller\ForumPostRevisionHistoryController:
    class: Drupal\aculta_forum\Controller\ForumPostRevisionHistoryController
    arguments: ['@entity_type.manager', '@date.formatter']
  Drupal\aculta_forum\Hook\ForumActivityEventHooks:
    class: Drupal\aculta_forum\Hook\ForumActivityEventHooks
    arguments: ['@event_dispatcher', '@datetime.time']
  Drupal\aculta_forum\Hook\ForumAttachmentCleanupHooks:
    class: Drupal\aculta_forum\Hook\ForumAttachmentCleanupHooks
    arguments: ['@aculta_forum.attachment_cleanup', '@aculta_forum.gallery_publication', '@datetime.time']
  Drupal\aculta_forum\Hook\ForumAttachmentPublicationHooks:
    class: Drupal\aculta_forum\Hook\ForumAttachmentPublicationHooks
    arguments: ['@aculta_forum.attachment_publication', '@aculta_forum.gallery_publication']
  Drupal\aculta_forum\Hook\ForumCommentMoveHooks:
    class: Drupal\aculta_forum\Hook\ForumCommentMoveHooks
    arguments: ['@aculta_forum.comment_mover', '@current_user']
  Drupal\aculta_forum\Hook\ForumDiscussionWriteHooks:
    class: Drupal\aculta_forum\Hook\ForumDiscussionWriteHooks
    arguments: ['@aculta_forum.discussion_write_guard']
  Drupal\aculta_forum\Hook\ForumHistoricModerationQueueHooks:
    class: Drupal\aculta_forum\Hook\ForumHistoricModerationQueueHooks
    arguments: ['@database']
  Drupal\aculta_forum\Hook\ForumPublicationTimeHooks:
    class: Drupal\aculta_forum\Hook\ForumPublicationTimeHooks
    arguments: ['@datetime.time', '@aculta_user.participation_rules']
  Drupal\aculta_forum\Hook\ForumPostAccessHooks:
    class: Drupal\aculta_forum\Hook\ForumPostAccessHooks
    arguments: ['@aculta_portal.domain_purpose']
  Drupal\aculta_forum\Hook\ForumPostThreadHooks:
    class: Drupal\aculta_forum\Hook\ForumPostThreadHooks
    arguments: ['@aculta_forum.post_thread_builder']
  Drupal\aculta_forum\Hook\ForumPostMigrationFieldHooks:
    class: Drupal\aculta_forum\Hook\ForumPostMigrationFieldHooks
  Drupal\aculta_forum\Hook\ForumQuoteHooks:
    class: Drupal\aculta_forum\Hook\ForumQuoteHooks
    arguments: ['@aculta_forum.discussion_context_resolver', '@current_user', '@aculta_forum.quote_builder', '@request_stack', '@string_translation']
  Drupal\aculta_forum\Hook\ForumTopicMoveHooks:
    class: Drupal\aculta_forum\Hook\ForumTopicMoveHooks
    arguments: ['@aculta_forum.topic_mover', '@current_user']
  Drupal\aculta_forum\Hook\HistoricForumFlagAccessHooks:
    class: Drupal\aculta_forum\Hook\HistoricForumFlagAccessHooks
    arguments: ['@entity_type.manager', '@current_user', '@aculta_portal.domain_purpose']
  Drupal\aculta_forum\Hook\PublicForumExposedFormHooks:
    class: Drupal\aculta_forum\Hook\PublicForumExposedFormHooks
    arguments: ['@entity_type.manager', '@current_user', '@entity.repository', '@string_translation']
  Drupal\aculta_forum\Hook\PublicForumFrontNavigationHooks:
    class: Drupal\aculta_forum\Hook\PublicForumFrontNavigationHooks
    arguments: ['@plugin.manager.menu.local_task', '@request_stack', '@aculta_portal.domain_purpose']
  Drupal\aculta_forum\Hook\PublicForumLastCommentAuthorHooks:
    class: Drupal\aculta_forum\Hook\PublicForumLastCommentAuthorHooks
    arguments: ['@entity_type.manager', '@aculta_user.author_card_builder']
  Drupal\aculta_forum\Hook\PublicForumTopicCreateActionHooks:
    class: Drupal\aculta_forum\Hook\PublicForumTopicCreateActionHooks
    arguments: ['@access_manager', '@aculta_portal.domain_purpose']
  Drupal\aculta_forum\Hook\PublicForumTopicHooks:
    class: Drupal\aculta_forum\Hook\PublicForumTopicHooks
    arguments: ['@aculta_portal.domain_purpose']

  aculta_forum.attachment_publication:
    class: Drupal\aculta_forum\Attachment\ForumAttachmentPublication
    arguments: ['@entity_type.manager', '@aculta_portal.domain_purpose']
  aculta_forum.gallery_publication:
    class: Drupal\aculta_forum\Attachment\ForumGalleryPublication
    arguments: ['@entity_type.manager', '@aculta_forum.attachment_publication']
  aculta_forum.attachment_cleanup:
    class: Drupal\aculta_forum\Attachment\ForumAttachmentCleanup
    arguments: ['@entity_type.manager', '@entity_usage.usage', '@file.usage', '@database', '@datetime.time', '@aculta_image.file_remover', '@aculta_image.inspector']
  aculta_forum.attachment_upload_access:
    class: Drupal\aculta_forum\Access\ForumAttachmentUploadAccess
    arguments: ['@aculta_portal.domain_purpose']
  aculta_forum.post_public_edit_access:
    class: Drupal\aculta_forum\Access\ForumPostPublicEditAccess
    arguments: ['@entity_type.manager', '@request_stack']
  aculta_forum.post_moderation_access:
    class: Drupal\aculta_forum\Access\ForumPostModerationAccess
    arguments: ['@entity_type.manager', '@aculta_portal.domain_purpose']
  aculta_forum.post_submission_access:
    class: Drupal\aculta_forum\Access\ForumPostSubmissionAccess
    arguments: ['@entity_type.manager', '@aculta_forum.discussion_context_resolver', '@request_stack']

  aculta_forum.search_query_subscriber:
    class: Drupal\aculta_forum\EventSubscriber\ForumSearchQuerySubscriber
    arguments: ['@aculta_portal.domain_purpose']
    tags:
      - { name: event_subscriber }
  aculta_forum.quote_builder:
    class: Drupal\aculta_forum\Service\ForumQuoteBuilder

  aculta_forum.topic_mover:
    class: Drupal\aculta_forum\Service\ForumTopicMover
    arguments: ['@entity_type.manager', '@aculta_portal.domain_purpose', '@logger.channel.aculta_forum']
  aculta_forum.comment_mover:
    class: Drupal\aculta_forum\Service\ForumCommentMover
    arguments: ['@entity_type.manager', '@config.factory', '@aculta_forum.discussion_write_guard', '@aculta_portal.domain_purpose', '@lock', '@database', '@comment.statistics', '@cache_tags.invalidator', '@event_dispatcher', '@logger.channel.aculta_forum']
  aculta_forum.discussion_write_guard:
    class: Drupal\aculta_forum\Service\ForumDiscussionWriteGuard
    arguments: ['@entity_type.manager', '@lock', '@database']
  aculta_forum.post_thread_builder:
    class: Drupal\aculta_forum\Service\ForumPostThreadBuilder
    arguments: ['@entity_type.manager', '@current_user', '@aculta_portal.domain_purpose', '@aculta_forum.discussion_context_resolver', '@pager.manager']
  logger.channel.aculta_forum:
    parent: logger.channel_base
    arguments: ['aculta_forum']
  aculta_forum.discussion_context_resolver:
    class: Drupal\aculta_forum\Context\DiscussionContextResolver
    arguments: [!tagged_iterator aculta_forum.discussion_context_provider]

  aculta_forum.discussion_context_provider.public_forum:
    class: Drupal\aculta_forum\Context\Provider\PublicForumContextProvider
    arguments: ['@aculta_portal.domain_purpose']
    tags:
      - { name: aculta_forum.discussion_context_provider }

  aculta_forum.discussion_context_provider.publication:
    class: Drupal\aculta_forum\Context\Provider\PublicationContextProvider
    tags:
      - { name: aculta_forum.discussion_context_provider }

  aculta_forum.read_access:
    class: Drupal\aculta_forum\Access\ForumReadAccess
    arguments: ['@aculta_portal.domain_purpose']

  aculta_forum.read_marker:
    class: Drupal\aculta_forum\Service\ForumReadMarker
    arguments: ['@entity_type.manager', '@aculta_portal.domain_purpose', '@current_user', '@string_translation', '@messenger']
