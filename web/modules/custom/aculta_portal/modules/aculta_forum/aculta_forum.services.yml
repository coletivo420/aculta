services:
  Drupal\aculta_forum\Hook\ForumPostAccessHooks:
    class: Drupal\aculta_forum\Hook\ForumPostAccessHooks
    arguments: ['@aculta_portal.domain_purpose']
  aculta_forum.attachment_publication:
    class: Drupal\aculta_forum\Attachment\ForumAttachmentPublication
    arguments: ['@entity_type.manager', '@aculta_portal.domain_purpose']
  aculta_forum.gallery_publication:
    class: Drupal\aculta_forum\Attachment\ForumGalleryPublication
    arguments: ['@entity_type.manager', '@aculta_forum.attachment_publication']
  aculta_forum.attachment_cleanup:
    class: Drupal\aculta_forum\Attachment\ForumAttachmentCleanup
    arguments: ['@entity_type.manager', '@entity_usage.usage', '@file.usage', '@database', '@datetime.time', '@aculta_image.file_remover', '@aculta_image.inspector']
  aculta_forum.attachment_upload_access:
    class: Drupal\aculta_forum\Access\ForumAttachmentUploadAccess
    arguments: ['@aculta_portal.domain_purpose']

  aculta_forum.search_query_subscriber:
    class: Drupal\aculta_forum\EventSubscriber\ForumSearchQuerySubscriber
    arguments: ['@aculta_portal.domain_purpose']
    tags:
      - { name: event_subscriber }
  aculta_forum.quote_builder:
    class: Drupal\aculta_forum\Service\ForumQuoteBuilder

  aculta_forum.topic_mover:
    class: Drupal\aculta_forum\Service\ForumTopicMover
    arguments: ['@entity_type.manager', '@aculta_portal.domain_purpose', '@logger.channel.aculta_forum']
  aculta_forum.comment_mover:
    class: Drupal\aculta_forum\Service\ForumCommentMover
    arguments: ['@entity_type.manager', '@config.factory', '@aculta_forum.discussion_write_guard', '@aculta_portal.domain_purpose', '@lock', '@database', '@comment.statistics', '@cache_tags.invalidator', '@event_dispatcher', '@logger.channel.aculta_forum']
  aculta_forum.discussion_write_guard:
    class: Drupal\aculta_forum\Service\ForumDiscussionWriteGuard
    arguments: ['@entity_type.manager', '@lock', '@database']
  logger.channel.aculta_forum:
    parent: logger.channel_base
    arguments: ['aculta_forum']
  aculta_forum.discussion_context_resolver:
    class: Drupal\aculta_forum\Context\DiscussionContextResolver
    arguments: [!tagged_iterator aculta_forum.discussion_context_provider]

  aculta_forum.discussion_context_provider.public_forum:
    class: Drupal\aculta_forum\Context\Provider\PublicForumContextProvider
    arguments: ['@aculta_portal.domain_purpose']
    tags:
      - { name: aculta_forum.discussion_context_provider }

  aculta_forum.discussion_context_provider.publication:
    class: Drupal\aculta_forum\Context\Provider\PublicationContextProvider
    tags:
      - { name: aculta_forum.discussion_context_provider }

  aculta_forum.read_access:
    class: Drupal\aculta_forum\Access\ForumReadAccess
    arguments: ['@aculta_portal.domain_purpose']

  aculta_forum.read_marker:
    class: Drupal\aculta_forum\Service\ForumReadMarker
    arguments: ['@entity_type.manager', '@aculta_portal.domain_purpose', '@current_user', '@string_translation', '@messenger']
