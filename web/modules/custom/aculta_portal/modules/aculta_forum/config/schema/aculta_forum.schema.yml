aculta_forum.settings:
  type: config_object
  label: 'ACULTA Forum settings'
  mapping:
    comment_move_enabled:
      type: boolean
      label: 'Enable moving public Forum comments between topics'
    edit_window_minutes:
      type: integer
      label: 'Minutes an author can edit a Forum post after its first publication'
    restricted_group_type:
      type: string
      label: 'Group type whose members can read restricted Forum topics (empty disables restricted forums)'
    reactions_enabled:
      type: boolean
      label: 'Enable emoji reactions on discussions'
    reply_max_depth:
      type: integer
      label: 'Maximum reply indentation depth for discussion comments (0 = off, 2 = 2 levels, 3 = 3 levels)'
    topic_author_delete_policy:
      type: string
      label: 'Topic deletion policy for topic author (moderation_queue, direct_delete, disabled)'
    default_reaction:
      type: string
      label: 'Default reaction machine name'
    allowed_reactions:
      type: sequence
      label: 'Allowed emoji reactions'
      sequence:
        type: mapping
        label: 'Reaction configuration'
        mapping:
          id:
            type: string
            label: 'Reaction ID'
          icon:
            type: string
            label: 'Icon name'
          label:
            type: label
            label: 'Reaction label'
          enabled:
            type: boolean
            label: 'Whether this reaction is enabled'


# Valor do filtro de tópicos sem respostas (plugin aculta_forum_no_replies). O plugin ignora o valor na consulta;
# o schema existe para que a configuração da view seja validada na importação.
views.filter_value.aculta_forum_no_replies:
  type: mapping
  label: 'Valor do filtro sem respostas'
  mapping:
    min:
      type: string
      label: 'Mínimo'
    max:
      type: string
      label: 'Máximo'
    value:
      type: string
      label: 'Valor'

# Plugins de View próprios do Fórum. Sem estas entradas, a instalação limpa
# rejeita as Views do módulo por schema incompleto.
views.field.aculta_forum_reply_count:
  type: views.field.numeric
  label: 'Contagem de respostas do Fórum'

views.field.aculta_forum_last_activity:
  type: views.field.date
  label: 'Última atividade do Fórum'

views.cache.aculta_forum_post_tag:
  type: views_cache
  label: 'Cache por tag de posts do Fórum'
  mapping:
    options:
      type: sequence
      label: 'Opções'

views.filter.aculta_forum_search_type:
  type: views.filter.search_api_string
  label: 'Tipo público do Fórum'
  mapping:
    value:
      type: sequence
      label: 'Tipos incluídos'
      sequence:
        type: string
        label: 'Tipo'
