aculta_forum_lms.settings:
  path: '/painel-administrativo/lms/forum/configuracoes'
  defaults:
    _form: '\Drupal\aculta_forum_lms\Form\LmsForumSettingsForm'
    _title: 'Configurações dos fóruns do LMS'
  requirements:
    _permission: 'administer aculta forum lms settings'
  options:
    _admin_route: true

aculta_forum_lms.moderation_overview:
  path: '/painel-administrativo/lms/forum'
  defaults:
    _controller: 'aculta_forum_lms.moderation_controller:overview'
    _title: 'Fóruns dos cursos'
  requirements:
    _custom_access: 'aculta_forum_lms.moderation_manager:overviewAccess'
  options:
    _admin_route: true

aculta_forum_lms.comments_published:
  path: '/painel-administrativo/lms/curso/{course}/forum/{group}/comentarios/publicados'
  defaults:
    _controller: 'aculta_forum_lms.moderation_controller:comments'
    _title: 'Comentários publicados'
    queue: published
  requirements:
    _custom_access: 'aculta_forum_lms.moderation_manager:courseGroupAccess'
  options:
    _admin_route: true
    parameters:
      course:
        type: entity:group
      group:
        type: entity:group

aculta_forum_lms.comments_rejected:
  path: '/painel-administrativo/lms/curso/{course}/forum/{group}/comentarios/rejeitados'
  defaults:
    _controller: 'aculta_forum_lms.moderation_controller:comments'
    _title: 'Comentários rejeitados'
    queue: rejected
  requirements:
    _custom_access: 'aculta_forum_lms.moderation_manager:courseGroupAccess'
  options:
    _admin_route: true
    parameters:
      course:
        type: entity:group
      group:
        type: entity:group

aculta_forum_lms.comments_pending:
  path: '/painel-administrativo/lms/curso/{course}/forum/{group}/comentarios/aguardando-moderacao'
  defaults:
    _controller: 'aculta_forum_lms.moderation_controller:comments'
    _title: 'Comentários aguardando moderação'
    queue: pending
  requirements:
    _custom_access: 'aculta_forum_lms.moderation_manager:courseGroupAccess'
  options:
    _admin_route: true
    parameters:
      course:
        type: entity:group
      group:
        type: entity:group

aculta_forum_lms.comment_moderate:
  path: '/painel-administrativo/lms/curso/{course}/forum/{group}/comentario/{comment}/moderacao/{decision}'
  defaults:
    _form: '\Drupal\aculta_forum_lms\Form\LmsCommentModerationForm'
    _title: 'Moderar comentário'
  requirements:
    _custom_access: 'aculta_forum_lms.moderation_manager:courseCommentModerationAccess'
    decision: 'approve|reject'
  options:
    _admin_route: true
    parameters:
      course:
        type: entity:group
      group:
        type: entity:group
      comment:
        type: entity:comment
