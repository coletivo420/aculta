services:
  aculta_forum_lms.activity_discussion_resolver:
    class: Drupal\aculta_forum_lms\Context\LmsActivityDiscussionResolver
    arguments: ['@entity_type.manager', '@aculta_lms.class_activity_deadline_manager', '@string_translation']
  aculta_forum_lms.h5p_discussion_resolver:
    class: Drupal\aculta_forum_lms\Context\Lmsaculta_H5PDiscussionResolver
    arguments: ['@entity_type.manager', '@string_translation']
  Drupal\aculta_forum_lms\Hook\Lmsaculta_H5PDiscussionHooks:
    arguments: ['@aculta_forum_lms.h5p_discussion_resolver', '@aculta_lms_h5p.course_access', '@current_user', '@entity_type.manager', '@request_stack']
  Drupal\aculta_forum_lms\Hook\LmsActivityDiscussionHooks:
    arguments: ['@aculta_forum_lms.activity_discussion_resolver', '@current_user']
  aculta_forum_lms.moderation_manager:
    class: Drupal\aculta_forum_lms\Access\LmsForumModerationManager
    arguments: ['@entity_type.manager', '@Drupal\aculta_forum_lms\Context\LmsDiscussionContextProvider']
  aculta_forum_lms.moderation_controller:
    class: Drupal\aculta_forum_lms\Controller\LmsForumModerationController
    arguments: ['@aculta_forum_lms.moderation_manager', '@entity_type.manager', '@views.executable', '@current_user', '@string_translation']
  Drupal\aculta_forum_lms\Context\LmsDiscussionContextProvider:
    arguments: ['@entity_type.manager']
    tags:
      - { name: aculta_forum.discussion_context_provider }

  aculta_forum_lms.edit_window_exemption:
    class: Drupal\aculta_forum_lms\Access\LmsEditWindowExemption
    arguments: ['@Drupal\aculta_forum_lms\Context\LmsDiscussionContextProvider']
    tags:
      # Explicit priority keeps the contract ordering stable: exemptions run
      # from the highest priority to the lowest, and the first allowed wins.
      - { name: aculta_user.edit_window_exemption, priority: 0 }

