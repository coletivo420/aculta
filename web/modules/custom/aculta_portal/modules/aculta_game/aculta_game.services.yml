services:
  aculta_game.course_completion_badge_subscriber:
    class: Drupal\aculta_game\EventSubscriber\CourseCompletionBadgeSubscriber
    arguments: ['@aculta_user.badge_service']
    tags:
      - { name: event_subscriber }
  aculta_game.forum_participation_policy:
    class: Drupal\aculta_game\ForumParticipationPolicy
    arguments: ['@aculta_portal.domain_site']

  aculta_game.mission_progress:
    class: Drupal\aculta_game\MissionProgress
    arguments: ['@config.factory', '@aculta_user.badge_service', '@entity_type.manager', '@date.formatter']
    tags:
      - { name: aculta_portal.helper }
  aculta_game.achievement_presentation:
    class: Drupal\aculta_game\AchievementPresentation
    arguments: ['@entity_type.manager', '@aculta_user.badge_service', '@user.data', '@cache_tags.invalidator', '@extension.list.module']
    tags:
      - { name: aculta_portal.helper }

  aculta_game.achievement_earned_mail_type:
    class: Drupal\aculta_game\Mail\AchievementEarnedMailType
    arguments: ['@string_translation']
    tags:
      - { name: aculta_mailer.type }
