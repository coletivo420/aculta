aculta_image_model:
  ckeditor5:
    plugins:
      - acultaImage.ImageModel
  drupal:
    label: Modelo de imagem
    class: \Drupal\aculta_image\Plugin\CKEditor5Plugin\ImageModel
    library: aculta_image/ckeditor5.image_model
    elements:
      - <img data-aculta-modelo>
    toolbar_items:
      acultaImageModelPequena:
        label: Imagem pequena
      acultaImageModelPadrao:
        label: Imagem padrão
      acultaImageModelLarga:
        label: Imagem larga
      acultaImageModelDestaque:
        label: Imagem destaque
    conditions:
      plugins: [ckeditor5_image]
      toolbarItem: acultaImageModelPequena
