aculta_image.audit:
  path: '/painel-administrativo/imagens'
  defaults:
    _controller: '\Drupal\aculta_image\Controller\ImageAuditController::dashboard'
    _title: 'Administração de imagens'
  requirements:
    _permission: 'administer aculta images'
  options:
    _admin_route: true

aculta_image.settings:
  path: '/painel-administrativo/imagens/configuracoes'
  defaults:
    _form: '\Drupal\aculta_image\Form\ImageSettingsForm'
    _title: 'Configurações de processamento de imagens'
  requirements:
    _permission: 'administer aculta images'
  options:
    _admin_route: true

aculta_image.audit_report:
  path: '/painel-administrativo/imagens/relatorio'
  defaults:
    _controller: '\Drupal\aculta_image\Controller\ImageAuditController::report'
    _title: 'Relatório de imagens'
  requirements:
    _permission: 'administer aculta images'
  options:
    _admin_route: true

aculta_image.file_usage:
  path: '/painel-administrativo/imagens/{file}/usos'
  defaults:
    _controller: '\Drupal\aculta_image\Controller\ImageFileUsageController::view'
    _title: 'Onde o arquivo é usado'
  requirements:
    _permission: 'administer aculta images'
    file: '\d+'
  options:
    _admin_route: true
    parameters:
      file:
        type: entity:file

aculta_image.quarantine:
  path: '/painel-administrativo/imagens/quarentena'
  defaults:
    _form: '\Drupal\aculta_image\Form\ImageQuarantineForm'
    _title: 'Quarentena de imagens'
  requirements:
    _permission: 'administer aculta images'
  options:
    _admin_route: true

aculta_image.cleanup:
  path: '/painel-administrativo/imagens/limpeza'
  defaults:
    _form: '\Drupal\aculta_image\Form\ImageCleanupForm'
    _title: 'Limpeza de imagens'
  requirements:
    _permission: 'administer aculta images'
  options:
    _admin_route: true
