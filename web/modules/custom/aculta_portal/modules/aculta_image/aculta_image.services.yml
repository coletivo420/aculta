services:
  aculta_image.content_index_provider:
    class: Drupal\aculta_portal\ContentIndex\MediaContentIndexProvider
    arguments: ['image', 'image']
    tags:
      - { name: aculta_index.provider }

  aculta_image.catalog:
    class: Drupal\aculta_image\ImageCatalog
    tags:
      - { name: aculta_portal.helper }
  aculta_image.upload_policy:
    class: Drupal\aculta_image\UploadPolicy
    tags:
      - { name: aculta_portal.helper }
  aculta_image.render:
    class: Drupal\aculta_image\ImageRenderer
    arguments: ['@aculta_image.catalog', '@entity_type.manager']
    tags:
      - { name: aculta_portal.helper }
  aculta_image.inspector:
    class: Drupal\aculta_image\ImageInspector
    arguments: ['@image.factory']
    tags:
      - { name: aculta_portal.helper }
  aculta_image.generated_file:
    class: Drupal\aculta_image\GeneratedImageFileManager
    arguments: ['@entity_type.manager', '@file_system', '@file.mime_type.guesser', '@aculta_image.inspector', '@datetime.time']
    tags:
      - { name: aculta_portal.helper }
  aculta_image.file_remover:
    class: Drupal\aculta_image\FileRemover
    arguments: ['@file.usage', '@entity_type.manager', '@database', '@file_system', '@logger.factory']
    tags:
      - { name: aculta_portal.helper }
  aculta_image.cleanup:
    class: Drupal\aculta_image\ImageCleanup
    arguments: ['@database', '@entity_type.manager', '@queue', '@config.factory', '@datetime.time', '@aculta_image.file_remover']
    tags:
      - { name: aculta_portal.helper }
  aculta_image.ingester:
    class: Drupal\aculta_image\ImageIngester
    arguments: ['@file.repository', '@file_system', '@database', '@aculta_image.inspector', '@datetime.time', '@logger.factory']
    tags:
      - { name: aculta_portal.helper }
  aculta_image.upload_ingester:
    class: Drupal\aculta_image\ImageUploadIngestor
    arguments: ['@aculta_image.upload_policy', '@aculta_image.inspector', '@file.upload_handler']
    tags:
      - { name: aculta_portal.helper }
  aculta_image.packaged_asset_publisher:
    class: Drupal\aculta_image\PackagedAssetPublisher
    arguments: ['@file.repository', '@file_system', '@database', '@entity_type.manager', '@file.usage', '@aculta_image.inspector', '@datetime.time', '@logger.factory']
    tags:
      - { name: aculta_portal.helper }
  aculta_image.file_usage_manager:
    class: Drupal\aculta_image\ImageFileUsageManager
    arguments: ['@aculta_image.inspector', '@file.usage']
    tags:
      - { name: aculta_portal.helper }
  aculta_image.audit:
    class: Drupal\aculta_image\Audit\ImageAudit
    arguments: ['@database', '@?media_duplicates.checksum_statistics', '@file_system']
    tags:
      - { name: aculta_portal.helper }
  aculta_image.quarantine:
    class: Drupal\aculta_image\Quarantine\ImageQuarantine
    arguments: ['@database', '@file.repository', '@file_system', '@file.usage', '@aculta_image.file_remover', '@datetime.time', '@entity_type.manager']
    tags:
      - { name: aculta_portal.helper }
  aculta_image.compressor:
    class: Drupal\aculta_image\Compression\ImageCompressor
    arguments: ['@logger.factory']
    tags:
      - { name: aculta_portal.helper }
