services:
  aculta_image.catalog:
    class: Drupal\aculta_image\ImageCatalog
    tags:
      - { name: aculta_portal.helper }
  aculta_image.upload_policy:
    class: Drupal\aculta_image\UploadPolicy
    tags:
      - { name: aculta_portal.helper }
  aculta_image.render:
    class: Drupal\aculta_image\ImageRenderer
    arguments: ['@aculta_image.catalog', '@entity_type.manager']
    tags:
      - { name: aculta_portal.helper }
  aculta_image.inspector:
    class: Drupal\aculta_image\ImageInspector
    arguments: ['@image.factory']
    tags:
      - { name: aculta_portal.helper }
  aculta_image.file_remover:
    class: Drupal\aculta_image\FileRemover
    arguments: ['@file.usage', '@entity_type.manager', '@logger.factory']
    tags:
      - { name: aculta_portal.helper }
  aculta_image.ingester:
    class: Drupal\aculta_image\ImageIngester
    arguments: ['@file.repository', '@file_system', '@database', '@aculta_image.inspector', '@datetime.time', '@logger.factory']
    tags:
      - { name: aculta_portal.helper }
  aculta_image.audit:
    class: Drupal\aculta_image\Audit\ImageAudit
    arguments: ['@database', '@?media_duplicates.checksum_statistics', '@file_system']
    tags:
      - { name: aculta_portal.helper }
  aculta_image.quarantine:
    class: Drupal\aculta_image\Quarantine\ImageQuarantine
    arguments: ['@database', '@file.repository', '@file_system', '@file.usage', '@aculta_image.file_remover', '@datetime.time', '@entity_type.manager']
    tags:
      - { name: aculta_portal.helper }
