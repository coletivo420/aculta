services:
  aculta_index.candidate_cache:
    class: Drupal\aculta_index\Cache\ContentIndexCandidateCache
    arguments: ['@database', '@cache.default', '@cache_tags.invalidator']

  Drupal\aculta_index\Cache\ContentIndexCandidateCache: '@aculta_index.candidate_cache'

  aculta_index.generation_manager:
    class: Drupal\aculta_index\Generation\ContentIndexGenerationManager
    arguments: ['@database', '@uuid', '@datetime.time', '@aculta_index.work_manager', '@aculta_index.provider_registry']

  Drupal\aculta_index\Generation\ContentIndexGenerationManager: '@aculta_index.generation_manager'

  aculta_index.entity_enumerator:
    class: Drupal\aculta_index\Rebuild\ContentIndexEntityEnumerator
    arguments: ['@aculta_index.provider_registry', '@entity_type.manager']

  Drupal\aculta_index\Rebuild\ContentIndexEntityEnumerator: '@aculta_index.entity_enumerator'

  aculta_index.rebuild_checkpoint:
    class: Drupal\aculta_index\Rebuild\ContentIndexRebuildCheckpointManager
    arguments: ['@database', '@datetime.time']

  Drupal\aculta_index\Rebuild\ContentIndexRebuildCheckpointManager: '@aculta_index.rebuild_checkpoint'

  aculta_index.rebuilder:
    class: Drupal\aculta_index\Rebuild\ContentIndexRebuilder
    arguments: ['@aculta_index.generation_manager', '@aculta_index.provider_registry', '@aculta_index.entity_enumerator', '@aculta_index.rebuild_checkpoint', '@aculta_index.writer', '@aculta_index.integrity_checker']

  Drupal\aculta_index\Rebuild\ContentIndexRebuilder: '@aculta_index.rebuilder'

  aculta_index.integrity_checker:
    class: Drupal\aculta_index\Integrity\ContentIndexIntegrityChecker
    arguments: ['@database', '@datetime.time', '@aculta_index.provider_registry', '@aculta_index.work_manager']

  Drupal\aculta_index\Integrity\ContentIndexIntegrityChecker: '@aculta_index.integrity_checker'

  aculta_index.writer:
    class: Drupal\aculta_index\Storage\ContentIndexWriter
    arguments: ['@database', '@aculta_index.provider_registry', '@datetime.time', '@aculta_index.candidate_cache']

  Drupal\aculta_index\Storage\ContentIndexWriter: '@aculta_index.writer'

  aculta_index.access_filter:
    class: Drupal\aculta_index\Query\ContentIndexAccessFilter
    arguments: ['@entity_type.manager', '@aculta_index.provider_registry', '@aculta_portal.domain_purpose']

  Drupal\aculta_index\Query\ContentIndexAccessFilter: '@aculta_index.access_filter'

  aculta_index.cursor_manager:
    class: Drupal\aculta_index\Query\ContentIndexCursorManager
    arguments: ['@database', '@datetime.time']

  Drupal\aculta_index\Query\ContentIndexCursorManager: '@aculta_index.cursor_manager'

  aculta_index.query:
    class: Drupal\aculta_index\Query\ContentIndexQuery
    arguments: ['@database', '@aculta_index.generation_manager', '@aculta_index.access_filter', '@aculta_index.cursor_manager', '@aculta_index.provider_registry', '@aculta_index.candidate_cache']

  Drupal\aculta_index\Query\ContentIndexQuery: '@aculta_index.query'
  Drupal\aculta_index\Query\ContentIndexQueryInterface: '@aculta_index.query'

  aculta_index.relation_query:
    class: Drupal\aculta_index\Query\ContentIndexRelationQuery
    arguments: ['@database', '@aculta_index.generation_manager', '@aculta_index.access_filter', '@aculta_index.cursor_manager', '@language_manager', '@aculta_index.provider_registry']

  Drupal\aculta_index\Query\ContentIndexRelationQuery: '@aculta_index.relation_query'

  aculta_index.statistics_bridge:
    class: Drupal\aculta_index\Statistics\ContentIndexStatisticsBridge
    arguments: ['@aculta_index.query', '@?Drupal\aculta_portal\Statistics\ContentEntityMetricAggregatorInterface']

  Drupal\aculta_index\Statistics\ContentIndexStatisticsBridge: '@aculta_index.statistics_bridge'

  aculta_index.work_manager:
    class: Drupal\aculta_index\Queue\ContentIndexWorkManager
    arguments: ['@database', '@queue', '@datetime.time', '@logger.channel.aculta_index']

  Drupal\aculta_index\Queue\ContentIndexWorkManager: '@aculta_index.work_manager'

  logger.channel.aculta_index:
    parent: logger.channel_base
    arguments: ['aculta_index']

  aculta_index.provider_registry:
    class: Drupal\aculta_index\Provider\ContentIndexProviderRegistry
    arguments: [!tagged_iterator aculta_index.provider]

  Drupal\aculta_index\Provider\ContentIndexProviderRegistry: '@aculta_index.provider_registry'
