services:
  aculta_index.generation_manager:
    class: Drupal\aculta_index\Generation\ContentIndexGenerationManager
    arguments: ['@database', '@uuid', '@datetime.time']

  Drupal\aculta_index\Generation\ContentIndexGenerationManager: '@aculta_index.generation_manager'

  aculta_index.entity_enumerator:
    class: Drupal\aculta_index\Rebuild\ContentIndexEntityEnumerator
    arguments: ['@aculta_index.provider_registry', '@entity_type.manager']

  Drupal\aculta_index\Rebuild\ContentIndexEntityEnumerator: '@aculta_index.entity_enumerator'

  aculta_index.rebuild_checkpoint:
    class: Drupal\aculta_index\Rebuild\ContentIndexRebuildCheckpointManager
    arguments: ['@database', '@datetime.time']

  Drupal\aculta_index\Rebuild\ContentIndexRebuildCheckpointManager: '@aculta_index.rebuild_checkpoint'

  aculta_index.integrity_checker:
    class: Drupal\aculta_index\Integrity\ContentIndexIntegrityChecker
    arguments: ['@database']

  Drupal\aculta_index\Integrity\ContentIndexIntegrityChecker: '@aculta_index.integrity_checker'

  aculta_index.provider_registry:
    class: Drupal\aculta_index\Provider\ContentIndexProviderRegistry
    arguments: [!tagged_iterator aculta_index.provider]

  Drupal\aculta_index\Provider\ContentIndexProviderRegistry: '@aculta_index.provider_registry'
