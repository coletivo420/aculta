services:
  aculta_index_wiki_access_test.content_index_provider:
    class: Drupal\aculta_wiki\ContentIndex\WikiContentIndexProvider
    tags:
      - { name: aculta_index.provider }
  aculta_portal.email_confirmation_policy:
    class: Drupal\aculta_portal\Account\EmailConfirmationPolicy
    arguments: ['@user.data', '@entity_type.manager', '@module_handler']
  Drupal\aculta_portal\Hook\EntityHooks:
    class: Drupal\aculta_portal\Hook\EntityHooks
    arguments: ['@aculta_portal.domain_purpose', '@current_route_match', '@request_stack', '@aculta_portal.email_confirmation_policy']

