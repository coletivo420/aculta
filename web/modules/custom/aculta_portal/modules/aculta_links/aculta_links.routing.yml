aculta_links.dashboard:
  path: '/painel-administrativo/links'
  defaults:
    _controller: 'aculta_links.dashboard_controller:overview'
    _title: 'ACULTA Links'
  requirements:
    _custom_access: 'aculta_links.dashboard_access:access'
  options:
    _admin_route: TRUE

aculta_links.page_editor:
  path: '/painel-administrativo/links/pagina/{aculta_link_page}/editar-itens'
  defaults:
    _form: '\Drupal\aculta_links\Form\LinkPageEditorForm'
    _title: 'Editar itens da micropágina'
  requirements:
    _entity_access: 'aculta_link_page.update'
  options:
    _admin_route: TRUE
    parameters:
      aculta_link_page:
        type: entity:aculta_link_page

aculta_links.page_public:
  path: '/pagina/{slug}'
  defaults:
    _controller: 'aculta_links.public_page_controller:view'
    _title: 'Micropágina'
  requirements:
    slug: '[a-z0-9]+(?:-[a-z0-9]+)*'
  options:
    _aculta_domain_purpose: links

aculta_links.page_preview:
  path: '/pagina/{slug}/previa'
  defaults:
    _controller: 'aculta_links.public_page_controller:previewBySlug'
    _title: 'Pré-visualizar micropágina'
  requirements:
    slug: '[a-z0-9]+(?:-[a-z0-9]+)*'
  options:
    _aculta_domain_purpose: links

aculta_links.landing:
  path: '/redes-sociais'
  defaults:
    _controller: '\Drupal\aculta_links\Controller\LinksLandingController::view'
    _title: 'ACULTA'
  requirements:
    _access: 'TRUE'
  options:
    _aculta_domain_purpose: links

aculta_links.social_links_settings:
  path: '/painel-administrativo/aculta/redes-sociais'
  defaults:
    _form: '\Drupal\aculta_links\Form\SocialLinksSettingsForm'
    _title: 'Redes sociais e botões'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: true
