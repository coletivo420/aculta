aculta_linkweed.dashboard:
  path: '/painel-administrativo/linkweed'
  defaults:
    _controller: 'aculta_linkweed.dashboard_controller:overview'
    _title: 'ACULTA Links'
  requirements:
    _custom_access: 'aculta_linkweed.dashboard_access:access'
  options:
    _admin_route: TRUE

aculta_linkweed.page_editor:
  path: '/painel-administrativo/linkweed/pagina/{aculta_linkweed_page}/editar-itens'
  defaults:
    _form: '\Drupal\aculta_linkweed\Form\LinkPageEditorForm'
    _title: 'Editar itens da micropágina'
  requirements:
    _entity_access: 'aculta_linkweed_page.update'
  options:
    _admin_route: TRUE
    parameters:
      aculta_linkweed_page:
        type: entity:aculta_linkweed_page

aculta_linkweed.page_item_add:
  path: '/painel-administrativo/linkweed/pagina/{aculta_linkweed_page}/item/adicionar'
  defaults:
    _form: '\Drupal\aculta_linkweed\Form\LinkPageItemAddForm'
    _title: 'Adicionar botão à micropágina'
  requirements:
    _entity_access: 'aculta_linkweed_page.update'
  options:
    _admin_route: TRUE
    parameters:
      aculta_linkweed_page:
        type: entity:aculta_linkweed_page

aculta_linkweed.page_public:
  path: '/pagina/{slug}'
  defaults:
    _controller: 'aculta_linkweed.public_page_controller:view'
    _title: 'Micropágina'
  requirements:
    slug: '[a-z0-9]+(?:-[a-z0-9]+)*'
  options:
    _aculta_domain_purpose: links

aculta_linkweed.page_preview:
  path: '/pagina/{slug}/previa'
  defaults:
    _controller: 'aculta_linkweed.public_page_controller:previewBySlug'
    _title: 'Pré-visualizar micropágina'
  requirements:
    slug: '[a-z0-9]+(?:-[a-z0-9]+)*'
  options:
    _aculta_domain_purpose: links

aculta_linkweed.page_qr_code:
  path: '/pagina/{slug}/codigo-qr.svg'
  defaults:
    _controller: 'aculta_linkweed.page_qr_code_controller:download'
    _title: 'Código QR da micropágina'
  requirements:
    slug: '[a-z0-9]+(?:-[a-z0-9]+)*'
  options:
    _aculta_domain_purpose: links

aculta_linkweed.short_redirect:
  path: '/redirecionar/{codigo}'
  defaults:
    _controller: 'aculta_linkweed.public_page_controller:redirectByCode'
    _title: 'Redirecionamento de link'
  requirements:
    codigo: '[0-9a-z]{12}'
  methods: [GET, HEAD]
  options:
    _aculta_domain_purpose: links

aculta_linkweed.short_qr_code:
  path: '/redirecionar/{codigo}/codigo-qr.svg'
  defaults:
    _controller: 'aculta_linkweed.short_qr_code_controller:download'
    _title: 'Código QR do link curto'
  requirements:
    codigo: '[0-9a-z]{12}'
  methods: [GET, HEAD]
  options:
    _aculta_domain_purpose: links

aculta_linkweed.landing:
  path: '/redes-sociais'
  defaults:
    _controller: 'aculta_linkweed.landing_controller:view'
    _title: 'ACULTA'
  requirements:
    _access: 'TRUE'
  options:
    _aculta_domain_purpose: links

aculta_linkweed.social_links_settings:
  path: '/painel-administrativo/aculta/redes-sociais'
  defaults:
    _form: '\Drupal\aculta_linkweed\Form\SocialLinksSettingsForm'
    _title: 'Redes sociais e botões'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: true

aculta_linkweed.analytics_settings:
  path: '/painel-administrativo/aculta/linkweed/configuracoes'
  defaults:
    _form: '\Drupal\aculta_linkweed\Form\LinkAnalyticsSettingsForm'
    _title: 'Configurações de métricas do ACULTA Links'
  requirements:
    _permission: 'administer aculta links'
  options:
    _admin_route: true
