aculta_lms:
  enabled: true
  label: "ACULTA LMS"
  description: "Icones do sistema de aprendizagem ACULTA."
  version: 1.x
  license:
    name: GPL-2.0-or-later
    url: https://www.gnu.org/licenses/old-licenses/gpl-2.0.html
    gpl-compatible: true
  extractor: svg
  config:
    sources:
      - assets/icons/*.svg
  settings:
    size:
      title: "Tamanho"
      type: "integer"
      default: 20
    class:
      title: "Classes"
      type: "string"
      default: ""
  template: >
    <svg
      {{ attributes
          .setAttribute('viewBox', attributes.viewBox|default('0 0 24 24'))
          .setAttribute('class', class)
          .setAttribute('width', size|default('20'))
          .setAttribute('height', size|default('20'))
          .setAttribute('aria-hidden', 'true')
      }}
    >
      {{ content }}
    </svg>
