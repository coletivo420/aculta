aculta_lms.class_dashboard:
  path: '/painel-administrativo/lms/curso/{course}/turma/{group}/painel'
  defaults:
    _controller: 'aculta_lms.learning_dashboard_controller:class'
    _title: 'Painel da turma'
  requirements:
    _custom_access: 'aculta_lms.class_dashboard_access:access'
  options:
    _admin_route: true
    no_cache: true
    parameters:
      course:
        type: entity:group
      group:
        type: entity:group

aculta_lms.xapi_attempt_token:
  path: '/xapi/token'
  defaults:
    _controller: 'aculta_lms.xapi_attempt_token_controller:issue'
  methods: [POST]
  requirements:
    _user_is_logged_in: 'TRUE'
    _csrf_request_header_token: 'TRUE'
  options:
    _aculta_domain_purpose: courses

aculta_lms.xapi_statements:
  path: '/xapi/statements'
  defaults:
    _controller: 'aculta_lms.xapi_statements_controller:post'
  methods: [POST]
  requirements:
    _access: 'TRUE'
  options:
    _aculta_domain_purpose: courses

aculta_lms.lesson_view:
  path: '/curso/{group}/{lesson_delta}'
  defaults:
    _controller: 'aculta_lms.course_lesson_controller:view'
    _title: 'Aula'
  requirements:
    _custom_access: 'aculta_lms.lesson_view_access:access'
  options:
    no_cache: true
    parameters:
      group:
        type: aculta_portal.lms_course_slug
      lesson_delta:
        type: aculta_portal.lms_lesson_slug
    _aculta_domain_purpose: courses

aculta_lms.class_activity_deadline:
  path: '/painel-administrativo/lms/curso/{course}/turma/{group}/atividade/{activity}/prazo'
  defaults:
    _form: '\Drupal\aculta_lms\Form\ClassActivityDeadlineForm'
    _title: 'Prazo da atividade'
  requirements:
    _custom_access: 'aculta_lms.class_activity_deadline_access:access'
  options:
    _admin_route: true
    no_cache: true
    parameters:
      course:
        type: entity:group
      group:
        type: entity:group
      activity:
        type: entity:aculta_lms_activity

aculta_lms.class_roster_settings:
  path: '/painel-administrativo/lms/curso/{course}/turma/{group}/participantes'
  defaults:
    _form: '\Drupal\aculta_lms\Form\ClassRosterVisibilityForm'
    _title: 'Lista de participantes'
  requirements:
    _custom_access: 'aculta_lms.class_dashboard_access:access'
  options:
    _admin_route: true
    no_cache: true
    parameters:
      course:
        type: entity:group
      group:
        type: entity:group

aculta_lms.certificate_issue:
  path: '/painel-administrativo/lms/curso/{group}/certificados/emitir'
  defaults:
    _form: '\Drupal\aculta_lms\Form\CourseCertificateIssueForm'
    _title: 'Emitir certificado'
  requirements:
    _custom_access: 'aculta_lms.certificate_issue_access:access'
  options:
    parameters:
      group:
        type: entity:group

aculta_lms.certificate_revoke:
  path: '/painel-administrativo/lms/curso/{group}/certificado/{certificate}/revogar'
  defaults:
    _form: '\Drupal\aculta_lms\Form\CourseCertificateRevokeForm'
    _title: 'Revogar certificado'
  requirements:
    _custom_access: 'aculta_lms.certificate_issue_access:revokeAccess'
  options:
    parameters:
      group:
        type: entity:group
      certificate:
        type: entity:aculta_lms_certificate

aculta_lms.certificate_verify:
  path: '/verificar-certificado/{codigo}'
  defaults:
    _controller: 'aculta_lms.certificate_verification_controller:verify'
    _title: 'Verificação de certificado'
  requirements:
    _access: 'TRUE'
    codigo: '[A-Za-z0-9_-]{40,64}'

aculta_lms.certificate_pdf:
  path: '/verificar-certificado/{codigo}/pdf'
  defaults:
    _controller: 'aculta_lms.certificate_verification_controller:pdf'
    _title: 'Certificado em PDF'
  requirements:
    _access: 'TRUE'
    codigo: '[A-Za-z0-9_-]{40,64}'

aculta_lms.certificate_qr:
  path: '/verificar-certificado/{codigo}/codigo-qr'
  defaults:
    _controller: 'aculta_lms.certificate_verification_controller:qr'
    _title: 'QR de verificação do certificado'
  requirements:
    _access: 'TRUE'
    codigo: '[A-Za-z0-9_-]{40,64}'



aculta_lms.answer_attachment_download:
  path: '/resposta/{answer}/arquivo'
  defaults:
    _controller: '\Drupal\aculta_lms\Controller\AcultaAnswerFileDownloadController::download'
  requirements:
    _custom_access: 'aculta_lms.answer_attachment_access::access'
  options:
    parameters:
      answer:
        type: entity:aculta_lms_answer

aculta_lms.answer_reviews:
  path: '/painel-administrativo/lms/curso/{course}/turma/{group}/respostas'
  defaults:
    _controller: 'aculta_lms.answer_review_controller:list'
    _title: 'Respostas da turma'
  requirements:
    _custom_access: 'aculta_lms.answer_review_access::access'
  options:
    _admin_route: true
    no_cache: true
    parameters:
      course:
        type: entity:group
      group:
        type: entity:group

aculta_lms.answer_review:
  path: '/painel-administrativo/lms/curso/{course}/turma/{group}/respostas/{answer}'
  defaults:
    _form: '\Drupal\aculta_lms\Form\AnswerReviewForm'
    _title: 'Avaliar resposta'
  requirements:
    _custom_access: 'aculta_lms.answer_review_access::access'
  options:
    _admin_route: true
    no_cache: true
    parameters:
      course:
        type: entity:group
      group:
        type: entity:group
      answer:
        type: entity:aculta_lms_answer

aculta_lms.answer_submission:
  path: '/curso/{group}/{lesson_delta}/{activity_delta}'
  defaults:
    _form: '\Drupal\aculta_lms\Form\AnswerSubmissionForm'
    _title: 'Responder atividade'
  requirements:
    _custom_access: 'aculta_lms.answer_submission_access::access'
  options:
    parameters:
      group:
        type: entity:group
      lesson_delta:
        type: aculta_portal.lms_lesson_slug
      activity_delta:
        type: aculta_portal.lms_activity_slug
    _aculta_domain_purpose: courses

aculta_lms.xapi_token_settings:
  path: '/painel-administrativo/aculta/lms/xapi/validade-token'
  defaults:
    _form: '\Drupal\aculta_lms\Form\XapiTokenSettingsForm'
    _title: 'Validade do token de tentativa'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: true

aculta_lms.course_builder_wizard:
  path: '/painel-administrativo/lms/curso/builder/wizard/{step}'
  defaults:
    _controller: '\Drupal\ctools\Controller\WizardFormController::getContentResult'
    _wizard: '\Drupal\aculta_lms\Wizard\CourseBuilderWizard'
    _title: 'Course Builder Wizard'
    step: 'details'
  requirements:
    _permission: 'create lms_course group'
  options:
    _admin_route: true
    parameters:
      step:
        type: string

aculta_lms.student_tour_wizard:
  path: '/lms/tour-guiado/{step}'
  defaults:
    _controller: '\Drupal\ctools\Controller\WizardFormController::getContentResult'
    _wizard: '\Drupal\aculta_lms\Wizard\StudentTourWizard'
    _title: 'Tour Guiado'
    step: 'welcome'
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    _aculta_domain_purpose: courses
    parameters:
      step:
        type: string

aculta_forum_lms.settings:
  path: '/painel-administrativo/lms/forum/configuracoes'
  defaults:
    _form: '\Drupal\aculta_lms\Form\LmsForumSettingsForm'
    _title: 'Configurações dos fóruns do LMS'
  requirements:
    _permission: 'administer aculta forum lms settings'
  options:
    _admin_route: true

aculta_forum_lms.moderation_overview:
  path: '/painel-administrativo/lms/forum'
  defaults:
    _controller: 'aculta_lms.moderation_controller:overview'
    _title: 'Fóruns dos cursos'
  requirements:
    _custom_access: 'aculta_forum_lms.moderation_manager:overviewAccess'
  options:
    _admin_route: true

aculta_forum_lms.comments_published:
  path: '/painel-administrativo/lms/curso/{course}/forum/{group}/comentarios/publicados'
  defaults:
    _controller: 'aculta_lms.moderation_controller:comments'
    _title: 'Comentários publicados'
    queue: published
  requirements:
    _custom_access: 'aculta_forum_lms.moderation_manager:courseGroupAccess'
  options:
    _admin_route: true
    parameters:
      course:
        type: entity:group
      group:
        type: entity:group

aculta_forum_lms.comments_rejected:
  path: '/painel-administrativo/lms/curso/{course}/forum/{group}/comentarios/rejeitados'
  defaults:
    _controller: 'aculta_lms.moderation_controller:comments'
    _title: 'Comentários rejeitados'
    queue: rejected
  requirements:
    _custom_access: 'aculta_forum_lms.moderation_manager:courseGroupAccess'
  options:
    _admin_route: true
    parameters:
      course:
        type: entity:group
      group:
        type: entity:group

aculta_forum_lms.comments_pending:
  path: '/painel-administrativo/lms/curso/{course}/forum/{group}/comentarios/aguardando-moderacao'
  defaults:
    _controller: 'aculta_lms.moderation_controller:comments'
    _title: 'Comentários aguardando moderação'
    queue: pending
  requirements:
    _custom_access: 'aculta_forum_lms.moderation_manager:courseGroupAccess'
  options:
    _admin_route: true
    parameters:
      course:
        type: entity:group
      group:
        type: entity:group

aculta_forum_lms.comment_moderate:
  path: '/painel-administrativo/lms/curso/{course}/forum/{group}/comentario/{comment}/moderacao/{decision}'
  defaults:
    _form: '\Drupal\aculta_lms\Form\LmsCommentModerationForm'
    _title: 'Moderar comentário'
  requirements:
    _custom_access: 'aculta_forum_lms.moderation_manager:courseCommentModerationAccess'
    decision: 'approve|reject'
  options:
    _admin_route: true
    parameters:
      course:
        type: entity:group
      group:
        type: entity:group
      comment:
        type: entity:comment

