aculta_lms.student_dashboard:
  path: '/studio/ganjalab420'
  defaults:
    _controller: 'aculta_studio.ganjalab420_controller:student'
    _title: 'GanjaLab420'
  requirements:
    _permission: access aculta portal
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true
    _aculta_domain_purpose: account

aculta_lms.class_dashboard:
  path: '/painel-administrativo/lms/curso/{course}/turma/{group}/painel'
  defaults:
    _controller: 'aculta_lms.learning_dashboard_controller:class'
    _title: 'Painel da turma'
  requirements:
    _custom_access: 'aculta_lms.class_dashboard_access:access'
  options:
    _admin_route: true
    no_cache: true
    parameters:
      course:
        type: entity:group
      group:
        type: entity:group

aculta_lms.class_activity_deadline:
  path: '/painel-administrativo/lms/curso/{course}/turma/{group}/atividade/{activity}/prazo'
  defaults:
    _form: '\Drupal\aculta_lms\Form\ClassActivityDeadlineForm'
    _title: 'Prazo da atividade'
  requirements:
    _custom_access: 'aculta_lms.class_activity_deadline_access:access'
  options:
    _admin_route: true
    no_cache: true
    parameters:
      course:
        type: entity:group
      group:
        type: entity:group
      activity:
        type: entity:lms_activity

aculta_lms.class_roster_settings:
  path: '/painel-administrativo/lms/curso/{course}/turma/{group}/participantes'
  defaults:
    _form: '\Drupal\aculta_lms\Form\ClassRosterVisibilityForm'
    _title: 'Lista de participantes'
  requirements:
    _custom_access: 'aculta_lms.class_dashboard_access:access'
  options:
    _admin_route: true
    parameters:
      course:
        type: entity:group
      group:
        type: entity:group

aculta_lms.certificate_issue:
  path: '/painel-administrativo/lms/curso/{group}/certificados/emitir'
  defaults:
    _form: '\Drupal\aculta_lms\Form\CourseCertificateIssueForm'
    _title: 'Emitir certificado'
  requirements:
    _custom_access: 'aculta_lms.certificate_issue_access:access'
  options:
    parameters:
      group:
        type: entity:group

aculta_lms.certificate_revoke:
  path: '/painel-administrativo/lms/curso/{group}/certificado/{certificate}/revogar'
  defaults:
    _form: '\Drupal\aculta_lms\Form\CourseCertificateRevokeForm'
    _title: 'Revogar certificado'
  requirements:
    _custom_access: 'aculta_lms.certificate_issue_access:revokeAccess'
  options:
    parameters:
      group:
        type: entity:group
      certificate:
        type: entity:aculta_lms_certificate

aculta_lms.certificate_verify:
  path: '/verificar-certificado/{codigo}'
  defaults:
    _controller: 'aculta_lms.certificate_verification_controller:verify'
    _title: 'Verificação de certificado'
  requirements:
    _access: 'TRUE'
    codigo: '[A-Za-z0-9_-]{40,64}'

aculta_lms.certificate_pdf:
  path: '/verificar-certificado/{codigo}/pdf'
  defaults:
    _controller: 'aculta_lms.certificate_verification_controller:pdf'
    _title: 'Certificado em PDF'
  requirements:
    _access: 'TRUE'
    codigo: '[A-Za-z0-9_-]{40,64}'

aculta_lms.certificate_qr:
  path: '/verificar-certificado/{codigo}/codigo-qr'
  defaults:
    _controller: 'aculta_lms.certificate_verification_controller:qr'
    _title: 'QR de verificação do certificado'
  requirements:
    _access: 'TRUE'
    codigo: '[A-Za-z0-9_-]{40,64}'


# Rota de compatibilidade antiga; preservar até inventariar consumidores e definir redirect canônico.
aculta_lms.legacy_student_dashboard:
  path: '/minha-aprendizagem'
  defaults:
    _controller: 'aculta_studio.ganjalab420_controller:student'
    _title: 'GanjaLab420'
  requirements:
    _permission: access aculta portal
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true
    _aculta_domain_purpose: account

# Transitional student URL on the account purpose.
aculta_lms.old_student_dashboard:
  path: '/ganjalab420'
  defaults:
    _controller: 'aculta_studio.ganjalab420_controller:student'
    _title: 'GanjaLab420'
  requirements:
    _permission: access aculta portal
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true
    _aculta_domain_purpose: account
