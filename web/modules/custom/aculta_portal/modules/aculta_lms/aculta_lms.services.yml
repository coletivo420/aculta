services:
  aculta_lms.account_user_loader:
    class: Drupal\aculta_lms\Account\AccountUserLoader
    arguments: ['@entity_type.manager']
  aculta_lms.xapi_statement_validator:
    class: Drupal\aculta_lms\Xapi\XapiStatementValidator
  aculta_lms.xapi_batch_ingestor:
    class: Drupal\aculta_lms\Xapi\XapiBatchIngestor
    arguments: ['@aculta_lms.xapi_statement_validator']
  aculta_lms.xapi_attempt_token_controller:
    class: Drupal\aculta_lms\Controller\XapiAttemptTokenController
    arguments: ['@key.repository', '@entity_type.manager', '@current_user', '@config.factory', '@datetime.time']
  aculta_lms.xapi_statements_controller:
    class: Drupal\aculta_lms\Controller\XapiStatementsController
    arguments: ['@key.repository', '@entity_type.manager', '@flood', '@lock', '@database', '@datetime.time', '@aculta_lms.xapi_batch_ingestor', '@logger.channel.aculta_lms']
  aculta_lms.xapi_statement_retention:
    class: Drupal\aculta_lms\Xapi\XapiStatementRetentionPurger
    arguments: ['@entity_type.manager', '@state', '@datetime.time', '@logger.channel.aculta_lms']
  Drupal\aculta_lms\Xapi\XapiStatementRetentionPurger: '@aculta_lms.xapi_statement_retention'
  Drupal\aculta_lms\Hook\XapiRetentionCronHooks:
    class: Drupal\aculta_lms\Hook\XapiRetentionCronHooks
    arguments: ['@aculta_lms.xapi_statement_retention', '@config.factory']
  logger.channel.aculta_lms:
    parent: logger.channel_base
    arguments: ['aculta_lms']
  aculta_lms.account_courses_reader:
    class: Drupal\aculta_lms\Account\AccountCoursesReader
    arguments: ['@lms.training_manager', '@group.membership_loader', '@aculta_portal.domain_purpose']
  Drupal\aculta_learning_contracts\Learning\AccountCoursesReaderInterface: '@aculta_lms.account_courses_reader'
  aculta_portal.lms_friendly_slugs:
    class: Drupal\aculta_lms\Routing\LmsFriendlySlugs
    arguments: ['@entity_type.manager', '@transliteration']
    tags:
      - { name: aculta_portal.helper }
  aculta_portal.lms_friendly_slug_converter:
    class: Drupal\aculta_lms\Routing\LmsFriendlySlugConverter
    arguments: ['@aculta_portal.lms_friendly_slugs']
    tags:
      - { name: paramconverter }
      - { name: aculta_portal.implementation }
  aculta_portal.lms_friendly_route_processor:
    class: Drupal\aculta_lms\Routing\LmsFriendlyRouteProcessor
    arguments: ['@entity_type.manager', '@aculta_portal.lms_friendly_slugs']
    tags:
      - { name: route_processor_outbound, priority: 100 }
      - { name: aculta_portal.implementation }
  aculta_portal.lms_friendly_route_subscriber:
    class: Drupal\aculta_lms\EventSubscriber\LmsFriendlyRouteSubscriber
    tags:
      - { name: event_subscriber }
      - { name: aculta_portal.implementation }
  aculta_lms.learning_dashboard:
    class: Drupal\aculta_lms\LearningDashboardManager
    arguments: ['@?Drupal\aculta_learning_contracts\Learning\AccountCoursesReaderInterface', '@aculta_lms.course_certificate_manager', '@entity_type.manager', '@?lms.training_manager']
  aculta_lms.student_status_cron_hooks:
    class: Drupal\aculta_lms\Hook\StudentStatusSnapshotCronHooks
    arguments: ['@aculta_lms.learning_dashboard', '@entity_type.manager', '@event_dispatcher', '@?aculta_user.aculta_user_agreement_ledger']

  # Alias por classe: o hook de cron recebe o gerenciador por tipo.
  Drupal\aculta_lms\LearningDashboardManager: '@aculta_lms.learning_dashboard'
  Drupal\aculta_learning_contracts\Learning\StudentLearningSummaryReaderInterface: '@aculta_lms.learning_dashboard'
  # Contrato de leitura da jornada: o Studio depende da interface, não do LMS.
  aculta_lms.course_journey_reader:
    alias: aculta_lms.learning_dashboard
  Drupal\aculta_learning_contracts\Learning\CourseJourneyReaderInterface: '@aculta_lms.course_journey_reader'
  aculta_lms.class_dashboard_access:
    class: Drupal\aculta_lms\Access\ClassDashboardAccessCheck
    arguments: ['@aculta_lms.learning_dashboard', '@current_user']
  aculta_lms.learning_dashboard_controller:
    class: Drupal\aculta_lms\Controller\LearningDashboardController
    arguments: ['@aculta_lms.learning_dashboard', '@aculta_lms.class_activity_deadline_manager', '@entity_type.manager', '@current_user', '@date.formatter', '@string_translation']
  aculta_lms.class_activity_deadline_access:
    class: Drupal\aculta_lms\Access\ClassActivityDeadlineAccessCheck
    arguments: ['@entity_type.manager', '@current_user']
  aculta_lms.class_activity_deadline_manager:
    class: Drupal\aculta_lms\Deadline\ClassActivityDeadlineManager
    arguments: ['@entity_type.manager', '@aculta_lms.class_activity_deadline_access']
  Drupal\aculta_lms\Deadline\ClassActivityDeadlineManager: '@aculta_lms.class_activity_deadline_manager'
  aculta_lms.course_certificate_manager:
    class: Drupal\aculta_lms\Certificate\CourseCertificateManager
    arguments: ['@entity_type.manager', '@datetime.time', '@database', '@event_dispatcher', '@logger.channel.aculta_lms', '@lock']
  aculta_lms.certificate_issue_access:
    class: Drupal\aculta_lms\Access\CertificateIssueAccessCheck
    arguments: ['@current_user']
  aculta_lms.certificate_verification_controller:
    class: Drupal\aculta_lms\Controller\CertificateVerificationController
    arguments: ['@aculta_lms.course_certificate_manager', '@?plugin.manager.entity_print.print_engine', '@date.formatter', '@string_translation', '@?aculta_lms.certificate_qr_code_provider']
  aculta_lms.certificate_qr_code_provider:
    class: Drupal\aculta_lms\Certificate\CertificateQrCodeProvider
    arguments: ['@?aculta_qrcode.generator', '@?aculta_qrcode.payload_validator', '@?aculta_qrcode.preset_registry', '@?aculta_portal.domain_purpose']
  aculta_lms.submission_image_validator:
    class: Drupal\aculta_lms\Plugin\Validation\Constraint\LmsSubmissionImageValidator
    arguments: ['@aculta_file_uploader.consumer_policy']
  aculta_lms.uploaded_answer_access:
    class: Drupal\aculta_lms\Access\UploadedAnswerAccessCheck
    arguments: ['@aculta_lms.account_user_loader']
  Drupal\aculta_lms\Controller\AnswerFileDownloadController:
    class: Drupal\aculta_lms\Controller\AnswerFileDownloadController
    autowire: true
  Drupal\aculta_lms\Hook\FileUploadActivityFormHooks:
    class: Drupal\aculta_lms\Hook\FileUploadActivityFormHooks
    autowire: true
  aculta_lms.course_completion_publisher:
    class: Drupal\aculta_lms\Event\CourseCompletionPublisher
    arguments: ['@event_dispatcher']
    tags:
      - { name: aculta_portal.helper }
  Drupal\aculta_lms\Event\CourseCompletionPublisherInterface: '@aculta_lms.course_completion_publisher'
  aculta_lms.course_room_builder:
    class: Drupal\aculta_lms\CourseRoomBuilder
    arguments: ['@current_user', '@form_builder', '@aculta_lms.class_roster_manager', '@aculta_lms.course_journey_reader']
    tags:
      - { name: aculta_portal.helper }
  aculta_lms.class_roster_manager:
    class: Drupal\aculta_lms\ClassRosterManager
    arguments: ['@entity_type.manager', '@string_translation', '@aculta_user.author_card_builder']
  aculta_lms.educator_feedback_policy:
    class: Drupal\aculta_lms\EducatorFeedbackPolicy
  aculta_lms.course_order_enrollment:
    class: Drupal\aculta_lms\CourseOrderEnrollmentManager
    arguments: ['@entity_type.manager', '@aculta_portal.checkout_settings']
    tags:
      - { name: aculta_portal.helper }
      - { name: aculta_portal.implementation }
  aculta_lms.attempt_archive:
    class: Drupal\aculta_lms\AttemptArchiveManager
    arguments: ['@entity_type.manager', '@current_user', '@datetime.time']
    tags:
      - { name: aculta_portal.helper }
      - { name: aculta_portal.implementation }
  Drupal\aculta_lms\Hook\SubmissionImageHooks:
    class: Drupal\aculta_lms\Hook\SubmissionImageHooks
    arguments: ['@string_translation', '@?aculta_file_uploader.consumer_policy', '@entity_type.manager', '@current_user', '@?aculta_file_uploader.recent_uploads']
  aculta_lms.checkout_provider:
    class: Drupal\aculta_lms\Checkout\LmsCheckoutProvider
    arguments: ['@aculta_portal.order_type_checkout_flows', '@aculta_portal.checkout_settings']
    tags:
      - { name: aculta_portal.checkout_provider }


  aculta_lms.notice_eligibility:
    class: Drupal\aculta_lms\Notice\LearningEligibility
    arguments: ['@entity_type.manager', '@aculta_lms.class_activity_deadline_manager']
  Drupal\aculta_lms\Notice\LearningEligibilityInterface: '@aculta_lms.notice_eligibility'
  aculta_lms.notice_recipients:
    class: Drupal\aculta_lms\Notice\LearningNoticeRecipients
    arguments: ['@entity_type.manager', '@aculta_lms.notice_eligibility', '@aculta_messenger.notice_event_publisher']
  Drupal\aculta_lms\Notice\LearningNoticeRecipients: '@aculta_lms.notice_recipients'
  Drupal\aculta_lms\Notice\LearningNoticeRecipientsInterface: '@aculta_lms.notice_recipients'
  aculta_lms.notice_event_publisher:
    class: Drupal\aculta_lms\EventSubscriber\LearningNotificationSubscriber
    arguments: ['@aculta_lms.notice_recipients', '@aculta_messenger.notice_event_publisher', '@logger.channel.aculta_messenger']
    tags:
      - { name: event_subscriber }
