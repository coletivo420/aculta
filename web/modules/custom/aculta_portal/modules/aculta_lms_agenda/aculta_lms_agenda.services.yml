services:
  aculta_lms_agenda.entries:
    class: Drupal\aculta_lms_agenda\AgendaEntriesProvider
    arguments: ['@entity_type.manager', '@aculta_lms.class_activity_deadline_manager', '@aculta_events.occurrences', '@datetime.time']
  aculta_lms_agenda.calendar_provider:
    class: Drupal\aculta_lms_agenda\Calendar\LmsCalendarItemProvider
    arguments: ['@aculta_lms_agenda.entries', '@current_user']
    tags:
      - { name: aculta_calendar.item_provider }
  aculta_lms_agenda.tokens:
    class: Drupal\aculta_lms_agenda\Calendar\PersonalCalendarTokens
    arguments: ['@state']
  aculta_lms_agenda.mail_type_evento_turma:
    class: Drupal\aculta_lms_agenda\Mail\EventoTurmaMailType
    arguments: ['@string_translation']
    tags:
      - { name: aculta_mailer.type }
