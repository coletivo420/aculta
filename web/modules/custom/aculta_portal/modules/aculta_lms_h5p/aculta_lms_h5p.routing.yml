aculta_lms_h5p.admin.content.aculta_lms_h5p.libraries.upgrade-confirm:
  path: '/admin/content/h5p/libraries/{library_id}/upgrade-confirm'
  defaults:
    _form: '\Drupal\aculta_lms_h5p\Form\H5PContentUpgradeForm'
    _title_callback: '\Drupal\aculta_lms_h5p\Controller\H5PContentUpgrade::pageTitle'
  requirements:
    _permission: 'administer h5p libraries'
    library_id: '\d+'

aculta_lms_h5p.admin.content.aculta_lms_h5p.libraries.upgrade:
  path: '/admin/content/h5p/libraries/{library_id}/upgrade'
  defaults:
    _controller: '\Drupal\aculta_lms_h5p\Controller\H5PContentUpgrade::upgrade'
    _title_callback: '\Drupal\aculta_lms_h5p\Controller\H5PContentUpgrade::pageTitle'
  requirements:
    _permission: 'administer h5p libraries'
    library_id: '\d+'
    _csrf_token: 'TRUE'
  methods: [POST]

aculta_lms_h5p.admin.content.aculta_lms_h5p.libraries.restrict:
  path: '/admin/content/h5p/libraries/{library_id}/restrict'
  defaults:
    _controller: '\Drupal\aculta_lms_h5p\Controller\H5PLibraryAdmin::restrict'
    _title: 'Restringir conteúdo H5P'
  requirements:
    _permission: 'administer h5p libraries'
    library_id: '\d+'

aculta_lms_h5p.admin.content.aculta_lms_h5p.libraries.delete:
  path: '/admin/content/h5p/libraries/{library_id}/delete'
  defaults:
    _form: '\Drupal\aculta_lms_h5p\Form\H5PLibraryDeleteForm'
    _title: 'Excluir biblioteca H5P'
  requirements:
    _permission: 'administer h5p libraries'
    library_id: '\d+'

aculta_lms_h5p.admin.content.aculta_lms_h5p.upgrade.library:
  path: '/admin/content/h5p/upgrade/library/{name}/{major}/{minor}'
  defaults:
    _controller: '\Drupal\aculta_lms_h5p\Controller\H5PContentUpgrade::prepareUpgrade'
    _title: 'Biblioteca para atualização de conteúdo H5P'
  requirements:
    _permission: 'administer h5p libraries'
    name: '[A-Za-z0-9_.-]+'
    major: '\d+'
    minor: '\d+'

aculta_lms_h5p.admin.content.aculta_lms_h5p.rebuild_cache:
  path: '/admin/content/h5p/rebuild-cache'
  defaults:
    _controller: '\Drupal\aculta_lms_h5p\Controller\H5PLibraryAdmin::rebuildCache'
    _title: 'Reconstruir cache de conteúdo H5P'
  requirements:
    _permission: 'administer h5p libraries'
    _csrf_token: 'TRUE'
  methods: [POST]
aculta_lms_h5p.ajax.set_finished:
  path: '/h5p-ajax/{group_id}/set-finished.json'
  defaults:
    _controller: '\Drupal\aculta_lms_h5p\Controller\H5PAJAX::setFinished'
    _title: 'Salvar resultados da atividade'
  requirements:
     _permission: 'access content'
     _user_is_logged_in: 'TRUE'
     group_id: '\d+'
  methods: [POST]
  options:
    _aculta_domain_purpose: courses

aculta_lms_h5p.ajax.content_user_data:
  path: '/h5p-ajax/{group_id}/content-user-data/{content_main_id}/{data_id}/{sub_content_id}'
  defaults:
    _controller: '\Drupal\aculta_lms_h5p\Controller\H5PAJAX::contentUserData'
    _title: 'Salvar dados da atividade'
  requirements:
     _permission: 'access content'
     _user_is_logged_in: 'TRUE'
     group_id: '\d+'
     content_main_id: '\d+'
     sub_content_id: '\d+'
  methods: [GET, POST]
  options:
    _aculta_domain_purpose: courses

aculta_lms_h5p.content_file:
  path: '/h5p-content/{group_id}/{content_id}/{file_path}/{path_2}/{path_3}/{path_4}/{path_5}/{path_6}/{path_7}/{path_8}/{path_9}/{path_10}'
  defaults:
    _controller: '\Drupal\aculta_lms_h5p\Controller\H5PFileController::contentFile'
    path_2: ''
    path_3: ''
    path_4: ''
    path_5: ''
    path_6: ''
    path_7: ''
    path_8: ''
    path_9: ''
    path_10: ''
  requirements:
    _permission: 'access content'
    group_id: '\d+'
    content_id: '\d+'
    file_path: '[A-Za-z0-9._~-]+'
    path_2: '[A-Za-z0-9._~-]+'
    path_3: '[A-Za-z0-9._~-]+'
    path_4: '[A-Za-z0-9._~-]+'
    path_5: '[A-Za-z0-9._~-]+'
    path_6: '[A-Za-z0-9._~-]+'
    path_7: '[A-Za-z0-9._~-]+'
    path_8: '[A-Za-z0-9._~-]+'
    path_9: '[A-Za-z0-9._~-]+'
    path_10: '[A-Za-z0-9._~-]+'
  options:
    _aculta_domain_purpose: courses

aculta_lms_h5p.library_file:
  path: '/h5p-library-assets/libraries/{library}/{file_path}/{path_3}/{path_4}/{path_5}/{path_6}/{path_7}/{path_8}/{path_9}/{path_10}/{path_11}/{path_12}'
  defaults:
    _controller: '\Drupal\aculta_lms_h5p\Controller\H5PFileController::libraryFile'
    path_3: ''
    path_4: ''
    path_5: ''
    path_6: ''
    path_7: ''
    path_8: ''
    path_9: ''
    path_10: ''
    path_11: ''
    path_12: ''
  requirements:
    _access: 'TRUE'
    library: '[A-Za-z0-9._~-]+'
    file_path: '[A-Za-z0-9._~-]+'
    path_3: '[A-Za-z0-9._~-]+'
    path_4: '[A-Za-z0-9._~-]+'
    path_5: '[A-Za-z0-9._~-]+'
    path_6: '[A-Za-z0-9._~-]+'
    path_7: '[A-Za-z0-9._~-]+'
    path_8: '[A-Za-z0-9._~-]+'
    path_9: '[A-Za-z0-9._~-]+'
    path_10: '[A-Za-z0-9._~-]+'
    path_11: '[A-Za-z0-9._~-]+'
    path_12: '[A-Za-z0-9._~-]+'

aculta_lms_h5p.editor_ajax:
  path: '/h5peditor/{group_id}/{token}/{content_id}/{action}/{arguments}/{argument_2}/{argument_3}/{argument_4}/{argument_5}/{argument_6}/{argument_7}/{argument_8}/{argument_9}/{argument_10}'
  defaults:
    _controller: '\Drupal\aculta_lms_h5p\Controller\H5PEditorAjaxController::handle'
    arguments: ''
    argument_2: ''
    argument_3: ''
    argument_4: ''
    argument_5: ''
    argument_6: ''
    argument_7: ''
    argument_8: ''
    argument_9: ''
    argument_10: ''
  requirements:
    _permission: 'access content'
    _user_is_logged_in: 'TRUE'
    group_id: '\d+'
    token: '[A-Za-z0-9._~-]+'
    content_id: '\d+'
    action: '[a-z-]+'
    arguments: '[A-Za-z0-9._~-]+'
    argument_2: '[A-Za-z0-9._~-]+'
    argument_3: '[A-Za-z0-9._~-]+'
    argument_4: '[A-Za-z0-9._~-]+'
    argument_5: '[A-Za-z0-9._~-]+'
    argument_6: '[A-Za-z0-9._~-]+'
    argument_7: '[A-Za-z0-9._~-]+'
    argument_8: '[A-Za-z0-9._~-]+'
    argument_9: '[A-Za-z0-9._~-]+'
    argument_10: '[A-Za-z0-9._~-]+'
  methods: [GET, POST]
  options:
    _aculta_domain_purpose: main
