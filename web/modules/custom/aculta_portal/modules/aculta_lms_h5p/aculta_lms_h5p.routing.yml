# ACULTA H5P entry points are split by Drupal/Group access context.
aculta_lms_h5p.admin_dashboard:
  path: '/painel-administrativo/lms/h5p'
  defaults:
    _controller: '\Drupal\aculta_lms_h5p\Controller\H5PDashboardController::administrator'
    _title: 'Conteúdo interativo do LMS'
  requirements:
    _permission: 'administer h5p libraries'

aculta_lms_h5p.student_dashboard:
  path: '/minha-conta/atividades-interativas'
  defaults:
    _controller: '\Drupal\aculta_lms_h5p\Controller\H5PDashboardController::student'
    _title: 'Atividades interativas'
  requirements:
    _role: estudante

aculta_lms_h5p.educator_dashboard:
  path: '/educador/atividades-interativas'
  defaults:
    _controller: '\Drupal\aculta_lms_h5p\Controller\H5PDashboardController::educator'
    _title: 'Atividades interativas dos cursos'
  requirements:
    _role: lms_teacher

# ACULTA fork of Drupal H5P 2.0.0-beta1; adapted 2026-10-18.
aculta_lms_h5p.admin.config.system.h5p:
  path: '/admin/config/system/h5p'
  defaults:
    _form: 'Drupal\aculta_lms_h5p\Form\H5PAdminSettingsForm'
    _title: 'Configurações H5P'
  requirements:
    _permission: 'administer h5p libraries'

aculta_lms_h5p.admin.content.h5p:
  path: '/admin/content/h5p'
  defaults:
    _controller: '\Drupal\aculta_lms_h5p\Controller\H5PLibraryAdmin::libraryList'
    _title: 'Bibliotecas H5P'
  requirements:
    _permission: 'administer h5p libraries'

#aculta_lms_h5p.admin.content.aculta_lms_h5p.libraries.details:
