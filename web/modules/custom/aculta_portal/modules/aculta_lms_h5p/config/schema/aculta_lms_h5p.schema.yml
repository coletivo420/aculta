# ACULTA fork of Drupal H5P 2.0.0-beta1; adapted 2026-10-18.
aculta_lms_h5p.settings:
  type: config_object
  label: 'H5P settings'
  mapping:
   aculta_lms_h5p_frame:
     type: integer
     label: 'Display buttons (download, embed and copyright)'
   aculta_lms_h5p_export:
     type: integer
     label: 'Download button'
   aculta_lms_h5p_embed:
     type: integer
     label: 'Embed button'
   aculta_lms_h5p_copyright:
     type: integer
     label: 'Copyright button'
   aculta_lms_h5p_icon:
     type: integer
     label: 'About H5P button'
   aculta_lms_h5p_default_path:
     type: string
     label: 'Default h5p package path'
   aculta_lms_h5p_revisioning:
     type: integer
     label: 'Save content files for each revision'
   aculta_lms_h5p_whitelist:
     type: string
     label: 'White list of accepted files.'
   aculta_lms_h5p_library_whitelist_extras:
     type: string
     label: 'White list of extra accepted files in libraries.'
   aculta_lms_h5p_save_content_state:
     type: integer
     label: 'Save content state'
   aculta_lms_h5p_save_content_frequency:
     type: integer
     label: 'Save content state frequency'
   aculta_lms_h5p_enable_lrs_content_types:
     type: integer
     label: 'Enable LRS dependent content types'
   aculta_lms_h5p_hub_is_enabled:
     type: integer
     label: 'Use H5P Hub'
   aculta_lms_h5p_send_usage_statistics:
     type: integer
     label: 'Automatically contribute usage statistics'
   aculta_lms_h5p_site_uuid:
     type: string
     label: 'H5P site UUID'
   aculta_lms_h5p_content_type_cache_updated_at:
     type: integer
     label: 'Content Type Cache Update at'
   aculta_lms_h5p_development_mode:
     type: integer
     label: 'Development mode'
   aculta_lms_h5p_first_runnable_saved:
     type: integer
     label: 'First runnable saved'
   aculta_lms_h5p_site_type:
     type: string
     label: 'H5P site type'
