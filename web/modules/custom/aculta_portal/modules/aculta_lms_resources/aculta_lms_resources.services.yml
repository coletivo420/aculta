services:
  aculta_lms_resources.course_document_access:
    class: Drupal\aculta_lms_resources\Access\CourseDocumentAccessCheck
    arguments: ['@aculta_lms.course_authoring_access', '@group_relation_type.manager', '@current_user']

  aculta_lms_resources.course_document_controller:
    class: Drupal\aculta_lms_resources\Controller\CourseDocumentController
    arguments: ['@entity_type.manager', '@entity.form_builder', '@aculta_lms_resources.course_document_access', '@string_translation']

  aculta_lms_resources.course_content_index_provider:
    class: Drupal\aculta_lms_resources\ContentIndex\LmsCourseContentIndexProvider
    arguments: ['@aculta_portal.domain_purpose', '@group_relation_type.manager']
    tags:
      - { name: aculta_index.provider }

  aculta_lms_resources.course_resource_builder:
    class: Drupal\aculta_lms_resources\CourseResourceBuilder
    arguments: ['@aculta_portal.domain_purpose', '@current_user', '@string_translation', '@group_relation_type.manager']
