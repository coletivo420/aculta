services:
  Drupal\aculta_magazine\Hook\MagazineNoticeEventPublisher:
    class: Drupal\aculta_magazine\Hook\MagazineNoticeEventPublisher
    arguments: ['@flag', '@aculta_portal.domain_purpose', '@entity_type.manager', '@aculta_messenger.notice_event_publisher', '@config.factory', '@datetime.time']

  aculta_magazine.content_index_provider:
    class: Drupal\aculta_magazine\ContentIndex\MagazineContentIndexProvider
    tags:
      - { name: aculta_index.provider }

  aculta_magazine.gallery_reference_migrator:
    class: Drupal\aculta_magazine\Migration\GalleryReferenceMigrator
    arguments: ['@entity_type.manager', '@entity_field.manager']

  aculta_magazine.post_presentation:
    class: Drupal\aculta_magazine\Presentation\PostPresentation
    arguments: ['@date.formatter', '@entity_type.manager', '@aculta_portal.domain_purpose']
