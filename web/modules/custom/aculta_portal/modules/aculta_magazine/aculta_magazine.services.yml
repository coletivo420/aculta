services:
  aculta_magazine.post_presentation:
    class: Drupal\aculta_magazine\Presentation\PostPresentation
    arguments: ['@date.formatter', '@entity_type.manager', '@aculta_portal.domain_purpose']
  aculta_magazine.forum_section_resolver:
    class: Drupal\aculta_magazine\Forum\ForumSectionResolver
    arguments: ['@entity_type.manager']
  aculta_magazine.forum_topic_sync:
    class: Drupal\aculta_magazine\Forum\ForumTopicSync
    arguments: ['@entity_type.manager', '@aculta_portal.domain_purpose', '@aculta_magazine.forum_section_resolver']
  aculta_magazine.forum_opening_post:
    class: Drupal\aculta_magazine\Presentation\ForumOpeningPost
    arguments: ['@aculta_portal.domain_purpose', '@aculta_magazine.forum_topic_sync']
  aculta_magazine.publication_type_converter:
    class: Drupal\aculta_magazine\Forum\PublicationTypeConverter
    arguments: ['@entity_type.manager', '@aculta_magazine.forum_topic_sync', '@database']
