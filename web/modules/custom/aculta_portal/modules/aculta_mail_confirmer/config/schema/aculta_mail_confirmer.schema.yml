# Schema for the configuration files of the email confirmer module.

aculta_mail_confirmer.settings:
  type: config_object
  label: 'Email confirmer settings'
  mapping:
    hash_expiration:
      type: integer
      label: 'Hash expiration'
    restrict_same_ip:
      type: boolean
      label: 'Restrict same IP'
    resendrequest_delay:
      type: integer
      label: 'Request resend delay'
    confirmation_lifetime:
      type: integer
      label: 'Confirmation life time'
    confirmation_request:
      type: mail
      label: 'Confirmation request mail'
    confirmation_response:
      type: mapping
      label: 'Confirmation response'
      mapping:
        skip_confirmation_form:
          type: boolean
          label: 'Skip confirmation form'
        questions:
          type: mapping
          label: 'Questions'
          mapping:
            pending:
              type: label
              label: 'Pending'
            expired:
              type: label
              label: 'Expired'
            cancelled:
              type: label
              label: 'Cancelled'
            confirmed:
              type: label
              label: 'Confirmed'
        url:
          type: mapping
          label: 'URLs'
          mapping:
            confirm:
              type: string
              label: 'Confirm'
            cancel:
              type: string
              label: 'Cancel'
            error:
              type: string
              label: 'Error'
    user_email_change:
      type: mapping
      label: 'On user email change'
      mapping:
        enabled:
          type: boolean
          label: 'Require confirmation'
        notify_current:
          type: boolean
          label: 'Send notification to the current email address'
        consider_existent:
          type: boolean
          label: 'Consider existent confirmations'
        limit_user_realm:
          type: boolean
          label: 'Consider only user related confirmations'
    user_login:
      type: mapping
      label: 'On user log in'
      mapping:
        sync_core_confirmation:
          type: boolean
          label: 'Record email confirmation on first user log in'
        sync_core_onetimeloginlinks:
          type: boolean
          label: 'Record email confirmation when user logs in through a one-time log in link'
