aculta_mailer.dashboard:
  path: '/painel-administrativo/configuracoes/aculta/envios-de-email'
  defaults:
    _controller: '\Drupal\aculta_mailer\Controller\MailDashboardController::overview'
    _title: 'Envios de e-mail'
  requirements:
    _permission: 'administer aculta_mailer'

aculta_mailer.failures:
  path: '/painel-administrativo/configuracoes/aculta/envios-de-email/falhas'
  defaults:
    _controller: '\Drupal\aculta_mailer\Controller\MailDashboardController::failures'
    _title: 'Relatório de falhas de envio'
  requirements:
    _permission: 'administer aculta_mailer'

aculta_mailer.template_test:
  path: '/painel-administrativo/configuracoes/aculta/envios-de-email/modelos/{aculta_mailer_template}/teste'
  defaults:
    _form: '\Drupal\aculta_mailer\Form\MailTemplateTestForm'
    _title: 'Enviar teste de modelo'
  requirements:
    _permission: 'administer aculta_mailer'
  options:
    parameters:
      aculta_mailer_template:
        type: entity:aculta_mailer_template

aculta_mailer.diagnostics:
  path: '/painel-administrativo/configuracoes/aculta/envios-de-email/diagnostico'
  defaults:
    _controller: '\Drupal\aculta_mailer\Controller\MailDashboardController::diagnostics'
    _title: 'Diagnóstico de envio de e-mail'
  requirements:
    _permission: 'administer aculta_mailer'

aculta_mailer.webhook:
  path: '/aculta-mailer/webhook/{provider}'
  defaults:
    _controller: '\Drupal\aculta_mailer\Controller\MailWebhookController::receive'
  requirements:
    _access: 'TRUE'
  methods: [POST]
