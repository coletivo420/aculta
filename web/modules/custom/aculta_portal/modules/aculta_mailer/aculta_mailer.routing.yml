aculta_mailer.dashboard:
  path: '/painel-administrativo/configuracoes/aculta/envios-de-email'
  defaults:
    _controller: '\Drupal\aculta_mailer\Controller\MailDashboardController::overview'
    _title: 'Envios de e-mail'
  requirements:
    _permission: 'administer aculta_mailer'

aculta_mailer.failures:
  path: '/painel-administrativo/configuracoes/aculta/envios-de-email/falhas'
  defaults:
    _controller: '\Drupal\aculta_mailer\Controller\MailDashboardController::failures'
    _title: 'Relatório de falhas de envio'
  requirements:
    _permission: 'administer aculta_mailer'
