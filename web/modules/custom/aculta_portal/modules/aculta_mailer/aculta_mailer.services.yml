services:
  Drupal\aculta_mailer\Type\MailTypeRegistry:
    class: Drupal\aculta_mailer\Type\MailTypeRegistry
    arguments: [!tagged_iterator aculta_mailer.type]

  aculta_mailer.mailer:
    class: Drupal\aculta_mailer\Api\AcultaMailer
    arguments: ['@plugin.manager.mail', '@Drupal\aculta_mailer\Type\MailTypeRegistry', '@logger.channel.aculta_mailer', '@aculta_mailer.log_recorder', '@aculta_mailer.smtp_failures', '@aculta_mailer.smtp_classifier', '@Drupal\aculta_mailer\Policy\MailPolicyResolver', '@Drupal\aculta_mailer\Policy\TransportQuota', '@aculta_mailer.transport_failover', '@config.factory', '@Drupal\aculta_mailer\Alert\MailAlerts', '@Drupal\aculta_mailer\Policy\QuotaSignal']

  logger.channel.aculta_mailer:
    parent: logger.channel_base
    arguments: ['aculta_mailer']

  aculta_mailer.retry_schedule:
    class: Drupal\aculta_mailer\Delivery\RetrySchedule

  aculta_mailer.transport_failover:
    class: Drupal\aculta_mailer\Delivery\TransportFailover
    arguments: ['smtp', 'smtp2go']

  aculta_mailer.delivery_planner:
    class: Drupal\aculta_mailer\Delivery\DeliveryPlanner
    arguments: ['@aculta_mailer.retry_schedule', '@aculta_mailer.transport_failover']

  aculta_mailer.queue:
    class: Drupal\aculta_mailer\Queue\MailQueue
    arguments: ['@queue']

  aculta_mailer.log_recorder:
    class: Drupal\aculta_mailer\Log\MailLogRecorder
    arguments: ['@entity_type.manager', '@settings', '@datetime.time', '@Drupal\aculta_mailer\Log\MailLogSettings']

  aculta_mailer.dashboard:
    class: Drupal\aculta_mailer\Dashboard\MailDashboard
    arguments: ['@entity_type.manager']

  Drupal\aculta_mailer\Template\MailTemplateRenderer:
    class: Drupal\aculta_mailer\Template\MailTemplateRenderer
    arguments: ['@entity_type.manager']

  aculta_mailer.smtp_failures:
    class: Drupal\aculta_mailer\Delivery\SmtpFailureRegistry

  aculta_mailer.smtp_classifier:
    class: Drupal\aculta_mailer\Delivery\SmtpReplyClassifier

  aculta_mailer.failure_subscriber:
    class: Drupal\aculta_mailer\EventSubscriber\MailFailureSubscriber
    arguments: ['@aculta_mailer.smtp_failures']
    tags:
      - { name: event_subscriber }

  Drupal\aculta_mailer\Diagnostics\MailDiagnostics:
    class: Drupal\aculta_mailer\Diagnostics\MailDiagnostics
    arguments: ['@entity_type.manager', '@config.factory', '@state', '@queue', '@aculta_mailer.transport_failover', '@?Drupal\aculta_mailer\Transport\SecretProviderInterface']

  Drupal\aculta_mailer\Policy\MailPolicyResolver:
    class: Drupal\aculta_mailer\Policy\MailPolicyResolver
    arguments: ['@config.factory', '@plugin.manager.aculta_mailer_adjuster']

  plugin.manager.aculta_mailer_adjuster:
    class: Drupal\aculta_mailer\Plugin\AcultaMailerAdjuster\AcultaMailerAdjusterManager
    arguments: ['@container.namespaces', '@module_handler', '@cache.discovery']

  Drupal\aculta_mailer\Webhook\ProviderWebhookRegistry:
    class: Drupal\aculta_mailer\Webhook\ProviderWebhookRegistry
    arguments: [!tagged_iterator aculta_mailer.webhook_provider]

  Drupal\aculta_mailer\Webhook\DeliveryEventApplier:
    class: Drupal\aculta_mailer\Webhook\DeliveryEventApplier
    arguments: ['@entity_type.manager']

  Drupal\aculta_mailer\Transport\BrevoSecretTransportFactory:
    class: Drupal\aculta_mailer\Transport\BrevoSecretTransportFactory
    arguments: ['@?Drupal\aculta_mailer\Transport\SecretProviderInterface', '@?Psr\EventDispatcher\EventDispatcherInterface', '@?Symfony\Contracts\HttpClient\HttpClientInterface', '@logger.channel.aculta_mailer']
    tags:
      - { name: mailer.transport_factory }

  Drupal\aculta_mailer\Policy\TransportQuota:
    class: Drupal\aculta_mailer\Policy\TransportQuota
    arguments: ['@config.factory', '@entity_type.manager', '@datetime.time', '@state']

  Drupal\aculta_mailer\Policy\QuotaSignal:
    class: Drupal\aculta_mailer\Policy\QuotaSignal
    arguments: ['@Drupal\aculta_mailer\Policy\TransportQuota', '@Drupal\aculta_mailer\Alert\MailAlerts', '@entity_type.manager']

  Drupal\aculta_mailer\Monitor\BounceParser:
    class: Drupal\aculta_mailer\Monitor\BounceParser

  Drupal\aculta_mailer\Monitor\DmarcReportParser:
    class: Drupal\aculta_mailer\Monitor\DmarcReportParser

  Drupal\aculta_mailer\Monitor\MailMonitor:
    class: Drupal\aculta_mailer\Monitor\MailMonitor
    arguments: ['@config.factory', '@state', '@datetime.time', '@logger.channel.aculta_mailer', '@Drupal\aculta_mailer\Webhook\DeliveryEventApplier', '@Drupal\aculta_mailer\Monitor\BounceParser', '@Drupal\aculta_mailer\Monitor\DmarcReportParser', '@?Drupal\aculta_mailer\Transport\SecretProviderInterface', '@Drupal\aculta_mailer\Alert\MailAlerts', '@Drupal\aculta_mailer\Policy\QuotaSignal']

  Drupal\aculta_mailer\Type\AdminAlertMailType:
    class: Drupal\aculta_mailer\Type\AdminAlertMailType
    arguments: ['@string_translation']
    tags:
      - { name: aculta_mailer.type }

  Drupal\aculta_mailer\Type\WeeklySummaryMailType:
    class: Drupal\aculta_mailer\Type\WeeklySummaryMailType
    arguments: ['@string_translation']
    tags:
      - { name: aculta_mailer.type }

  Drupal\aculta_mailer\Alert\MailAlerts:
    class: Drupal\aculta_mailer\Alert\MailAlerts
    arguments: ['@config.factory', '@state', '@datetime.time', '@aculta_mailer.queue', '@uuid', '@Drupal\aculta_mailer\Delivery\AdministratorRecipients']

  Drupal\aculta_mailer\Report\MailSummary:
    class: Drupal\aculta_mailer\Report\MailSummary
    arguments: ['@config.factory', '@state', '@datetime.time', '@entity_type.manager', '@aculta_mailer.queue', '@uuid', '@Drupal\aculta_mailer\Delivery\AdministratorRecipients']

  Drupal\aculta_mailer\Hook\MailReportHooks:
    class: Drupal\aculta_mailer\Hook\MailReportHooks
    arguments: ['@Drupal\aculta_mailer\Report\MailSummary']

  Drupal\aculta_mailer\Log\MailLogSettings:
    class: Drupal\aculta_mailer\Log\MailLogSettings
    arguments: ['@config.factory']

  Drupal\aculta_mailer\Delivery\AdministratorRecipients:
    class: Drupal\aculta_mailer\Delivery\AdministratorRecipients
    arguments: ['@entity_type.manager']

  Drupal\aculta_mailer\EventSubscriber\ReturnPathSubscriber:
    class: Drupal\aculta_mailer\EventSubscriber\ReturnPathSubscriber
    arguments: ['@config.factory']
    tags:
      - { name: event_subscriber }

  Drupal\aculta_mailer\Transport\MailTransportFactory:
    class: Drupal\aculta_mailer\Transport\MailTransportFactory
    arguments: ['@?Drupal\aculta_mailer\Transport\SecretProviderInterface', '@Drupal\aculta_mailer\Transport\BrevoSecretTransportFactory']

  Drupal\aculta_mailer\Transport\MailTransportSender:
    class: Drupal\aculta_mailer\Transport\MailTransportSender
    arguments: ['@Drupal\aculta_mailer\Transport\MailTransportFactory']

  Drupal\aculta_mailer\Mail\LegacyMessageConverter:
    class: Drupal\aculta_mailer\Mail\LegacyMessageConverter
