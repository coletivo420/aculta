services:
  aculta_maps.geocoding:
    class: Drupal\aculta_maps\Geocoding\GeocodingService
    arguments: ['@http_client', '@logger.factory', '@state', '@lock.persistent', '@datetime.time', '@config.factory', '@?aculta_portal.secrets_manager']
  aculta_maps.renderer:
    class: Drupal\aculta_maps\MapRenderer
    arguments: ['@config.factory', '@?aculta_portal.secrets_manager', '@current_user']
  aculta_maps.route_link_builder:
    class: Drupal\aculta_maps\RouteLinkBuilder
    arguments: ['@config.factory']
