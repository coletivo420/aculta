aculta_messenger.preview:
  path: '/mensagens/resumo'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\MessagesController::preview'
    _title: 'Mensagens'
  requirements:
    _permission: 'use private messaging system,access user profiles'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true

aculta_messenger.alerts_preview:
  path: '/avisos/resumo'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\MessagesController::alertsPreview'
    _title: 'Avisos ativos'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: true

aculta_messenger.drawer_conversations:
  path: '/mensagens/conversas/painel'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\MessagesController::drawerConversations'
    _title: 'Conversas'
  requirements:
    _permission: 'use private messaging system,access user profiles'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true

aculta_messenger.profile_relationship:
  path: '/mensagens/perfil/{user}/relacao'
  methods: [POST]
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\ProfileRelationshipController::post'
    _title: 'Perfil'
  requirements:
    _permission: 'use private messaging system,access user profiles'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true
    parameters:
      user:
        type: entity:user

aculta_messenger.drawer_reply:
  path: '/mensagens/conversa/{private_message_thread}/responder'
  methods: [POST]
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\MessagesController::drawerReply'
    _title: 'Conversa'
  requirements:
    _entity_access: 'private_message_thread.view'
    _permission: 'use private messaging system,access user profiles'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true

aculta_messenger.drawer_options:
  path: '/mensagens/conversa/{private_message_thread}/opcoes'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\MessagesController::drawerOptions'
    _title: 'Opções'
  requirements:
    _entity_access: 'private_message_thread.view'
    _permission: 'use private messaging system,access user profiles'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true

aculta_messenger.drawer_relationship:
  path: '/mensagens/conversa/{private_message_thread}/relacao'
  methods: [POST]
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\MessagesController::drawerRelationship'
    _title: 'Conversa'
  requirements:
    _entity_access: 'private_message_thread.view'
    _permission: 'use private messaging system,access user profiles'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true

aculta_messenger.drawer_conversation:
  path: '/mensagens/conversa/{private_message_thread}/painel'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\MessagesController::drawerConversation'
    _title: 'Conversa'
  requirements:
    _entity_access: 'private_message_thread.view'
    _permission: 'use private messaging system,access user profiles'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true
    parameters:
      private_message_thread:
        type: entity:private_message_thread

aculta_messenger.alert_detail:
  path: '/avisos/alerta/{site_alert}'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\MessagesController::alertDetail'
    _title: 'Aviso'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: true
    parameters:
      site_alert:
        type: entity:site_alert

aculta_messenger.notice_detail:
  path: '/avisos/aviso/{node}'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\MessagesController::noticeDetail'
    _title: 'Aviso'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: true
    parameters:
      node:
        type: entity:node

aculta_messenger.settings_form:
  path: '/painel-administrativo/configuracoes/aculta/portal/mensagens'
  defaults:
    _form: '\Drupal\aculta_messenger\Form\MessengerSettingsForm'
    _title: 'Chat: limites e limpeza'
  requirements:
    _permission: 'administer aculta messenger'
  options:
    _admin_route: true

aculta_messenger.admin_notices:
  path: '/painel-administrativo/avisos'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\NoticeAdminController::overview'
    _title: 'Avisos'
  requirements:
    _permission: 'administer site alert,administer nodes'
  options:
    _admin_route: true

aculta_messenger.admin_temporary_notices:
  path: '/painel-administrativo/avisos/temporarios'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\NoticeAdminController::temporary'
    _title: 'Avisos temporários'
  requirements:
    _permission: 'administer site alert'
  options:
    _admin_route: true

aculta_messenger.admin_persistent_notices:
  path: '/painel-administrativo/avisos/persistentes'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\NoticeAdminController::persistent'
    _title: 'Avisos persistentes'
  requirements:
    _permission: 'administer nodes'
  options:
    _admin_route: true

aculta_messenger.admin_persistent_notice_add:
  path: '/painel-administrativo/avisos/persistentes/criar'
  defaults:
    _entity_form: 'node.default'
    entity_type_id: node
    node_type: aculta_notice
    _title_callback: '\Drupal\node\Controller\NodeController::addPageTitle'
  requirements:
    _entity_create_access: 'node:aculta_notice'
  options:
    _admin_route: true
    parameters:
      node_type:
        type: entity:node_type
        with_config_overrides: true

aculta_messenger.communication_settings:
  path: '/configuracoes/email'
  defaults:
    _form: '\Drupal\aculta_messenger\Form\CommunicationSettingsForm'
    _title: 'Notificações por e-mail'
  requirements:
    _permission: 'access aculta portal,use private messaging system'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true
    _aculta_domain_purpose: account

aculta_messenger.new_conversation:
  path: '/mensagens/nova'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\NewConversationController::start'
    _title: 'Nova conversa'
  requirements:
    _permission: 'use private messaging system,access user profiles'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true

aculta_messenger.new_conversation_search:
  path: '/mensagens/nova/buscar'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\NewConversationController::search'
    _title: 'Buscar membro'
  requirements:
    _permission: 'use private messaging system,access user profiles'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true

aculta_messenger.new_conversation_group:
  path: '/mensagens/nova/grupo/painel'
  methods: [GET, POST]
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\NewConversationController::composeGroup'
    _title: 'Nova conversa'
  requirements:
    _permission: 'use private messaging system,access user profiles'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true

aculta_messenger.new_conversation_compose:
  path: '/mensagens/nova/{user}/painel'
  methods: [GET, POST]
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\NewConversationController::compose'
    _title: 'Nova conversa'
  requirements:
    _permission: 'use private messaging system,access user profiles'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true
    parameters:
      user:
        type: entity:user

aculta_messenger.avisos:
  path: '/avisos-mensagens/{aba}'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\AvisosMensagensController::view'
    _title: 'Avisos/Mensagens'
    aba: 'avisos'
  requirements:
    _permission: 'access aculta portal'
    aba: 'avisos|mensagens'
  options:
    _aculta_domain_purpose: 'account'

aculta_messenger.avisos_raiz:
  path: '/avisos-mensagens'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\AvisosMensagensController::view'
    _title: 'Avisos/Mensagens'
    aba: 'avisos'
  requirements:
    _permission: 'access aculta portal'
  options:
    _aculta_domain_purpose: 'account'
