aculta_messenger.preview:
  path: '/mensagens/resumo'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\MessagesController::preview'
    _title: 'Mensagens'
  requirements:
    _permission: 'use private messaging system,access user profiles'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true

aculta_messenger.alerts_preview:
  path: '/avisos/resumo'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\MessagesController::alertsPreview'
    _title: 'Avisos ativos'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: true

aculta_messenger.drawer_conversations:
  path: '/mensagens/conversas/painel'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\MessagesController::drawerConversations'
    _title: 'Conversas'
  requirements:
    _permission: 'use private messaging system,access user profiles'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true

aculta_messenger.drawer_conversation:
  path: '/mensagens/conversa/{private_message_thread}/painel'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\MessagesController::drawerConversation'
    _title: 'Conversa'
  requirements:
    _entity_access: 'private_message_thread.view'
    _permission: 'use private messaging system,access user profiles'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true
    parameters:
      private_message_thread:
        type: entity:private_message_thread

aculta_messenger.admin_notices:
  path: '/painel-administrativo/avisos'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\NoticeAdminController::overview'
    _title: 'Avisos'
  requirements:
    _permission: 'administer site alert,administer nodes'
  options:
    _admin_route: true

aculta_messenger.admin_temporary_notices:
  path: '/painel-administrativo/avisos/temporarios'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\NoticeAdminController::temporary'
    _title: 'Avisos temporários'
  requirements:
    _permission: 'administer site alert'
  options:
    _admin_route: true

aculta_messenger.admin_persistent_notices:
  path: '/painel-administrativo/avisos/persistentes'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\NoticeAdminController::persistent'
    _title: 'Avisos persistentes'
  requirements:
    _permission: 'administer nodes'
  options:
    _admin_route: true

aculta_messenger.admin_persistent_notice_add:
  path: '/painel-administrativo/avisos/persistentes/criar'
  defaults:
    _entity_form: 'node.default'
    entity_type_id: node
    node_type: aculta_notice
    _title_callback: '\Drupal\node\Controller\NodeController::addPageTitle'
  requirements:
    _entity_create_access: 'node:aculta_notice'
  options:
    _admin_route: true
    parameters:
      node_type:
        type: entity:node_type
        with_config_overrides: true

aculta_messenger.communication_settings:
  path: '/configuracoes/email'
  defaults:
    _form: '\Drupal\aculta_messenger\Form\CommunicationSettingsForm'
    _title: 'Notificações por e-mail'
  requirements:
    _permission: 'access aculta portal,use private messaging system'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true
    _aculta_domain_purpose: account

aculta_messenger.new_conversation:
  path: '/mensagens/nova'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\NewConversationController::start'
    _title: 'Nova conversa'
  requirements:
    _permission: 'use private messaging system,access user profiles'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true

aculta_messenger.new_conversation_search:
  path: '/mensagens/nova/buscar'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\NewConversationController::search'
    _title: 'Buscar membro'
  requirements:
    _permission: 'use private messaging system,access user profiles'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true

aculta_messenger.new_conversation_compose:
  path: '/mensagens/nova/{user}/painel'
  methods: [GET, POST]
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\NewConversationController::compose'
    _title: 'Nova conversa'
  requirements:
    _permission: 'use private messaging system,access user profiles'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true
    parameters:
      user:
        type: entity:user
