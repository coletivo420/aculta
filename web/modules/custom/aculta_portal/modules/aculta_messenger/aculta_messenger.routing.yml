aculta_messenger.messages:
  path: '/mensagens'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\MessagesController::overview'
    _title: 'Mensagens'
  requirements:
    _permission: 'access aculta portal, use private messaging system, access user profiles'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true
    _aculta_domain_purpose: account

# Same-origin dialog fragment, available on each public purpose so Drupal AJAX
# never crosses hosts. Conversation actions still link canonically to ACCOUNT.
aculta_messenger.preview:
  path: '/mensagens/resumo'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\MessagesController::preview'
    _title: 'Mensagens'
  requirements:
    _permission: 'use private messaging system, access user profiles'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true

aculta_messenger.alerts_preview:
  path: '/avisos/resumo'
  defaults:
    _controller: '\Drupal\aculta_messenger\Controller\MessagesController::alertsPreview'
    _title: 'Avisos ativos'
  requirements:
    _access: 'TRUE'
  options:
    no_cache: true

