services:
  # Autowiring aliases for upstream services used by this module's typed constructors.
  Drupal\private_message\Service\PrivateMessageServiceInterface: '@private_message.service'
  Drupal\private_message\Service\PrivateMessageBanManagerInterface: '@private_message.ban_manager'
  Drupal\site_alert\GetAlertsInterface: '@site_alert.get_alerts'
  Drupal\message_notify\MessageNotifyInterface: '@message_notify.sender'
  Drupal\message_subscribe\SubscribersInterface: '@message_subscribe.subscribers'
  Drupal\aculta_user\Social\FriendshipManagerInterface: '@aculta_user.friendship_manager'
  Drupal\aculta_messenger\Service\UnreadThreadCounter: '@aculta_messenger.unread_thread_counter'
  Drupal\aculta_messenger\Aviso\AvisoService: '@aculta_messenger.aviso_service'
  Drupal\aculta_messenger\Aviso\ForumNoticeReadInterface: '@aculta_messenger.aviso_service'
  Drupal\aculta_messenger\Aviso\ForumNoticeRegistrarInterface: '@aculta_messenger.aviso_service'
  Drupal\aculta_messenger\Aviso\ForumNoticeEventProducerInterface: '@aculta_messenger.forum_notice_event_producer'
  Drupal\aculta_messenger\Aviso\ForumNoticeEmailOutboxInterface: '@aculta_messenger.forum_notice_email_outbox'
  Drupal\aculta_messenger\Aviso\AvisoPreferencias: '@aculta_messenger.aviso_preferencias'
  Drupal\aculta_messenger\Aviso\AvisoPreferenciasInterface: '@aculta_messenger.aviso_preferencias'
  Drupal\aculta_messenger\Form\AvisosPrivacyForm: '@aculta_messenger.avisos_privacy_form'
  Drupal\aculta_messenger\Aviso\AvisosResumo: '@aculta_messenger.avisos_resumo'
  aculta_messenger.message_privacy_form:
    class: Drupal\aculta_messenger\Form\MessagePrivacyForm
    arguments:
      - '@current_user'
      - '@user.data'
  aculta_messenger.email_pending_aviso:
    class: Drupal\aculta_messenger\Aviso\EmailPendingAviso
    arguments: ['@entity_type.manager', '@aculta_portal.email_confirmation_policy']
  aculta_messenger.counts:
    class: Drupal\aculta_messenger\Service\MessengerCounts
    arguments:
      - '@entity_type.manager'
      - '@flag'
      - '@site_alert.get_alerts'
      - '@module_handler'
  aculta_messenger.unread_thread_counter:
    class: Drupal\aculta_messenger\Service\UnreadThreadCounter
    arguments:
      - '@current_user'
      - '@private_message.service'
  aculta_messenger.private_message_form_validator:
    class: Drupal\aculta_messenger\Form\PrivateMessageFormValidator
    arguments:
      - '@flood'
      - '@current_user'
      - '@string_translation'
      - '@private_message.ban_manager'
      - '@aculta_user.friendship_manager'
      - '@user.data'
      - '@aculta_messenger.conversation_policy'
    public: true
  aculta_messenger.private_message_account_route_subscriber:
    class: Drupal\aculta_messenger\EventSubscriber\PrivateMessageAccountRouteSubscriber
    tags:
      - { name: event_subscriber }
  aculta_messenger.native_private_message_pages:
    class: Drupal\aculta_messenger\EventSubscriber\NativePrivateMessagePagesSubscriber
    tags:
      - { name: event_subscriber }
  aculta_messenger.notice_admin_route_subscriber:
    class: Drupal\aculta_messenger\EventSubscriber\NoticeAdminRouteSubscriber
    tags:
      - { name: event_subscriber }
  aculta_messenger.persistent_notice_route_access:
    class: Drupal\aculta_messenger\Access\PersistentNoticeRouteAccess
    public: true
  aculta_messenger.conversation_policy:
    class: Drupal\aculta_messenger\Service\ConversationPolicy
    arguments:
      - '@config.factory'

  aculta_messenger.conversation_messaging:
    class: Drupal\aculta_messenger\Service\ConversationMessagingState
    arguments:
      - '@current_user'
      - '@private_message.ban_manager'
      - '@aculta_user.friendship_manager'
      - '@user.data'
  aculta_messenger.aviso_service:
    class: Drupal\aculta_messenger\Aviso\AvisoService
    arguments: ['@entity_type.manager', '@flag', '@aculta_messenger.forum_notice_access_policy', '@database', '@datetime.time', '@lock', '@module_handler']
  aculta_messenger.forum_notice_event_producer:
    class: Drupal\aculta_messenger\Aviso\ForumNoticeEventProducer
    arguments: ['@flag', '@aculta_messenger.forum_notice_access_policy', '@aculta_messenger.notice_event_publisher']
  aculta_messenger.forum_notice_event_subscriber:
    class: Drupal\aculta_messenger\EventSubscriber\ForumNoticeEventSubscriber
    arguments: ['@entity_type.manager', '@aculta_messenger.aviso_service', '@aculta_messenger.aviso_preferencias', '@aculta_messenger.forum_notice_email_outbox']
    tags:
      - { name: event_subscriber }
  aculta_messenger.forum_notice_email_outbox:
    class: Drupal\aculta_messenger\Aviso\ForumNoticeEmailOutbox
    arguments: ['@database', '@queue', '@datetime.time', '@uuid', '@logger.channel.aculta_messenger']
  Drupal\aculta_messenger\Hook\ForumNoticeEmailHooks:
    class: Drupal\aculta_messenger\Hook\ForumNoticeEmailHooks
    arguments: ['@aculta_messenger.forum_notice_email_outbox']
  Drupal\aculta_messenger\Mail\ForumNoticeMailType:
    class: Drupal\aculta_messenger\Mail\ForumNoticeMailType
    arguments: ['@string_translation']
    tags:
      - { name: aculta_mailer.type }
  aculta_messenger.forum_notice_access_policy:
    class: Drupal\aculta_messenger\Aviso\ForumNoticeAccessPolicy
    arguments: ['@entity_type.manager', '@aculta_portal.domain_purpose']
  aculta_messenger.forum_aviso_read_subscriber:
    class: Drupal\aculta_messenger\EventSubscriber\ForumAvisoReadSubscriber
    arguments: ['@current_user', '@aculta_messenger.aviso_service']
    tags:
      - { name: event_subscriber }
  aculta_messenger.forum_comment_move_subscriber:
    class: Drupal\aculta_messenger\EventSubscriber\ForumCommentMoveSubscriber
    arguments: ['@aculta_messenger.aviso_service']
    tags:
      - { name: event_subscriber }
  aculta_messenger.aviso_preferencias:
    class: Drupal\aculta_messenger\Aviso\AvisoPreferencias
    arguments: ['@user.data', '@config.factory']
  aculta_messenger.avisos_privacy_form:
    class: Drupal\aculta_messenger\Form\AvisosPrivacyForm
    arguments: ['@current_user', '@aculta_messenger.aviso_preferencias']
  aculta_messenger.avisos_resumo:
    class: Drupal\aculta_messenger\Aviso\AvisosResumo
    arguments: ['@entity_type.manager', '@aculta_messenger.aviso_preferencias', '@aculta_mailer.mailer', '@aculta_portal.email_confirmation_policy', '@user.data', '@datetime.time', '@aculta_messenger.aviso_service', '@uuid', '@lock.persistent', !tagged_iterator aculta_messenger.aviso_digest_provider]

  aculta_messenger.avisos_resumo_mail_type:
    class: Drupal\aculta_messenger\Mail\AvisosResumoMailType
    arguments: ['@string_translation']
    tags:
      - { name: aculta_mailer.type }
  aculta_messenger.friendship_notice_subscriber:
    class: Drupal\aculta_messenger\Friendship\FriendshipNoticeSubscriber
    arguments: ['@entity_type.manager', '@queue', '@lock.persistent']
    tags:
      - { name: event_subscriber }
  aculta_messenger.friendship_notice_event_producer:
    class: Drupal\aculta_messenger\Friendship\FriendshipNoticeEventProducer
    arguments: ['@entity_type.manager', '@aculta_messenger.notice_event_publisher']
    tags:
      - { name: event_subscriber }

  Drupal\aculta_messenger\Service\MessengerNoticePublisherInterface: '@aculta_messenger.notice_event_publisher'
  aculta_messenger.notice_event_publisher:
    class: Drupal\aculta_messenger\Service\MessengerNoticePublisher
    arguments: ['@event_dispatcher']
  logger.channel.aculta_messenger:
    parent: logger.channel_base
    arguments: ['aculta_messenger']

  aculta_messenger.optional_notice_route_subscriber:
    class: Drupal\aculta_messenger\EventSubscriber\OptionalNoticeRouteSubscriber
    arguments: ['@module_handler']
    tags:
      - { name: event_subscriber }

  # Route references remain resolvable when an optional source module is off;
  # ServiceProvider replaces these fail-closed handlers when it is enabled.
  aculta_messenger.lms_notice_access:
    class: Drupal\aculta_messenger\Integration\UnavailableNoticeAdapterRouteHandler
    public: true
  aculta_messenger.lms_notice_open_controller:
    class: Drupal\aculta_messenger\Integration\UnavailableNoticeAdapterRouteHandler
    public: true
  aculta_messenger.wiki_notice_access:
    class: Drupal\aculta_messenger\Integration\UnavailableNoticeAdapterRouteHandler
    public: true
  aculta_messenger.wiki_notice_open_controller:
    class: Drupal\aculta_messenger\Integration\UnavailableNoticeAdapterRouteHandler
    public: true
  aculta_messenger.commerce_notice_access:
    class: Drupal\aculta_messenger\Integration\UnavailableNoticeAdapterRouteHandler
    public: true
  aculta_messenger.commerce_notice_open_controller:
    class: Drupal\aculta_messenger\Integration\UnavailableNoticeAdapterRouteHandler
    public: true
  aculta_messenger.donation_notice_access:
    class: Drupal\aculta_messenger\Integration\UnavailableNoticeAdapterRouteHandler
    public: true
  aculta_messenger.donation_notice_open_controller:
    class: Drupal\aculta_messenger\Integration\UnavailableNoticeAdapterRouteHandler
    public: true
