services:
  # Autowiring aliases for upstream services used by this module's typed constructors.
  Drupal\private_message\Service\PrivateMessageServiceInterface: '@private_message.service'
  Drupal\private_message\Service\PrivateMessageBanManagerInterface: '@private_message.ban_manager'
  Drupal\site_alert\GetAlertsInterface: '@site_alert.get_alerts'
  Drupal\message_notify\MessageNotifyInterface: '@message_notify.sender'
  Drupal\message_subscribe\SubscribersInterface: '@message_subscribe.subscribers'
  Drupal\aculta_user\Social\FriendshipManagerInterface: '@aculta_user.friendship_manager'
  Drupal\aculta_messenger\Service\UnreadThreadCounter: '@aculta_messenger.unread_thread_counter'
  aculta_messenger.unread_thread_counter:
    class: Drupal\aculta_messenger\Service\UnreadThreadCounter
    arguments:
      - '@current_user'
      - '@private_message.service'
  aculta_messenger.private_message_form_validator:
    class: Drupal\aculta_messenger\Form\PrivateMessageFormValidator
    arguments:
      - '@flood'
      - '@current_user'
      - '@string_translation'
      - '@private_message.ban_manager'
      - '@aculta_user.friendship_manager'
      - '@user.data'
    public: true
  aculta_messenger.private_message_account_route_subscriber:
    class: Drupal\aculta_messenger\EventSubscriber\PrivateMessageAccountRouteSubscriber
    tags:
      - { name: event_subscriber }
  aculta_messenger.notice_admin_route_subscriber:
    class: Drupal\aculta_messenger\EventSubscriber\NoticeAdminRouteSubscriber
    tags:
      - { name: event_subscriber }
  aculta_messenger.persistent_notice_route_access:
    class: Drupal\aculta_messenger\Access\PersistentNoticeRouteAccess
    public: true
