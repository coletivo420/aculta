aculta_messenger.settings:
  type: config_object
  label: 'ACULTA Messenger: controles de comunicação'
  mapping:
    group_creation_enabled:
      type: boolean
      label: 'Usuários comuns podem criar grupos'
    group_max_members:
      type: integer
      label: 'Máximo de outras pessoas num grupo'
    retention_months:
      type: integer
      label: 'Meses de inatividade antes da limpeza'
    cleanup_batch:
      type: integer
      label: 'Conversas removidas por execução do cron'
    send_limit_per_hour:
      type: integer
      label: 'Mensagens por hora por conta'
    email_modes:
      type: mapping
      label: 'Modos de e-mail permitidos por categoria'
      mapping:
        forum_resposta:
          type: aculta_messenger.email_modes
          label: 'Respostas do Fórum'
        forum_atualizacao:
          type: aculta_messenger.email_modes
          label: 'Atualizações do Fórum'
        aprendizagem:
          type: aculta_messenger.email_modes
          label: 'Aprendizagem'
        wiki:
          type: aculta_messenger.email_modes
          label: 'Wiki'
        loja:
          type: aculta_messenger.email_modes
          label: 'Loja'
        doacao:
          type: aculta_messenger.email_modes
          label: 'Doações'
        mensagens_privadas:
          type: aculta_messenger.email_modes
          label: 'Mensagens privadas'
        amizade:
          type: aculta_messenger.email_modes
          label: 'Amizades'
    private_message_digest_anchor:
      type: string
      label: 'Data inicial do digest semanal de mensagens privadas'

aculta_messenger.email_modes:
  type: mapping
  label: 'Modos de entrega permitidos'
  mapping:
    digest:
      type: boolean
      label: 'Resumo diário'
    immediate:
      type: boolean
      label: 'Envio direto'
    default_mode:
      type: string
      label: 'Modo padrão para novas preferências'
