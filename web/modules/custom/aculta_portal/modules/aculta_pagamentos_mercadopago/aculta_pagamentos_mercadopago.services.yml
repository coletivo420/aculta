services:
  aculta_pagamentos_mercadopago.logger:
    class: Drupal\Core\Logger\LoggerChannelInterface
    factory: ['@logger.factory', 'get']
    arguments: ['aculta_pagamentos_mercadopago']
  aculta_pagamentos_mercadopago.client_factory:
    class: Drupal\aculta_pagamentos_mercadopago\MercadoPago\MercadoPagoClientFactory
  aculta_pagamentos_mercadopago.recurrence_request_builder:
    class: Drupal\aculta_pagamentos_mercadopago\MercadoPago\RecurrenceRequestBuilder
  aculta_pagamentos_mercadopago.payment_policy:
    class: Drupal\aculta_pagamentos_mercadopago\Sales\MercadoPagoPaymentPolicy
  aculta_pagamentos_mercadopago.payment_service:
    class: Drupal\aculta_pagamentos_mercadopago\MercadoPago\MercadoPagoPaymentService
    arguments: ['@aculta_pagamentos_mercadopago.client_factory', '@aculta_pagamentos_mercadopago.payment_policy', '@aculta_pagamentos_mercadopago.logger']
  aculta_pagamentos_mercadopago.recurrence_service:
    class: Drupal\aculta_pagamentos_mercadopago\MercadoPago\MercadoPagoRecurrenceService
    arguments: ['@aculta_pagamentos_mercadopago.client_factory', '@aculta_pagamentos_mercadopago.recurrence_request_builder', '@aculta_pagamentos_mercadopago.logger']
  aculta_pagamentos_mercadopago.subscription_recorder:
    class: Drupal\aculta_pagamentos_mercadopago\MercadoPago\MercadoPagoSubscriptionRecorder
    arguments: ['@entity_type.manager', '@aculta_pagamentos_mercadopago.recurrence_service', '@aculta_pagamentos_mercadopago.logger', '@datetime.time']
  aculta_pagamentos_mercadopago.subscription_notifications:
    class: Drupal\aculta_pagamentos_mercadopago\MercadoPago\MercadoPagoSubscriptionNotificationService
    arguments: ['@entity_type.manager', '@aculta_pagamentos_mercadopago.client_factory', '@aculta_pagamentos_mercadopago.recurrence_service', '@http_client', '@aculta_pagamentos_mercadopago.logger', '@aculta_pagamentos_mercadopago.subscription_recorder']
