aculta_mercadopago_payment:
  id: aculta_mercadopago_payment
  group: commerce_payment
  label: 'Mercado Pago'
  states:
    new:
      label: 'New'
    authorization:
      label: 'Authorization'
    pending:
      label: 'Pending'
    authorization_voided:
      label: 'Authorization (Voided)'
    authorization_expired:
      label: 'Authorization (Expired)'
    completed:
      label: 'Completed'
    partially_refunded:
      label: 'Partially refunded'
    refunded:
      label: 'Refunded'
  transitions:
    authorize:
      label: 'Authorize payment'
      from: [new]
      to: authorization
    wait_for_payment:
      label: 'Wait for payment confirmation'
      from: [new, authorization]
      to: pending
    capture:
      label: 'Complete payment'
      from: [new, authorization, pending]
      to: completed
    void:
      label: 'Cancel payment'
      from: [authorization, pending]
      to: authorization_voided
    expire:
      label: 'Expire authorization'
      from: [authorization]
      to: authorization_expired
    partially_refund:
      label: 'Partially refund payment'
      from: [completed]
      to: partially_refunded
    refund:
      label: 'Refund payment'
      from: [completed, partially_refunded]
      to: refunded
