aculta_paths.form:
  path: '/painel-administrativo/aculta/caminhos'
  defaults:
    _controller: '\Drupal\aculta_paths\Controller\SurfaceListController::pagina'
    _title: 'Caminhos das superfícies'
  requirements:
    _permission: 'administrar superficies'
  options:
    _admin_route: TRUE
    _aculta_site_key: main

aculta_paths.editar:
  path: '/painel-administrativo/aculta/caminhos/{purpose}/editar'
  defaults:
    _controller: '\Drupal\aculta_paths\Controller\SurfaceEditController::abrir'
    _title: 'Editar superfície'
  requirements:
    _permission: 'administrar superficies'
    purpose: 'main|account|support|magazine|wiki|shop|courses|forum|links|eventos'
  options:
    _admin_route: TRUE
    _aculta_site_key: main
