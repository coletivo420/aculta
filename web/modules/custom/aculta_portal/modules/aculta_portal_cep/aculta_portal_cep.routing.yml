# Endpoint AJAX (não é página): o caminho é mantido para o JavaScript já publicado (cep-address.js).
aculta_portal_cep.lookup:
  path: '/aculta_portal_cep/{cep}'
  defaults:
    _controller: '\Drupal\aculta_portal_cep\Controller\CepLookupController::lookup'
  requirements:
    _permission: 'access content'
    cep: '\d{8}'
  options:
    _format: 'json'

aculta_portal_cep.settings:
  path: /painel-administrativo/configuracoes/aculta/portal/cep
  defaults:
    _form: '\Drupal\aculta_portal_cep\Form\CepSettingsForm'
    _title: Consulta de CEP
  requirements:
    _permission: administer site configuration
  options:
    _admin_route: true
