services:
  aculta_portal_cep.rate_limit_subscriber:
    class: Drupal\aculta_portal_cep\EventSubscriber\CepLookupRateLimitSubscriber
    arguments: ['@flood']
    tags:
      - { name: event_subscriber }
      - { name: aculta_portal.implementation }

  aculta_portal_cep.local_store:
    class: Drupal\aculta_portal_cep\Local\CepLocalStore
    arguments: ['@file_system']

  # Consulta compartilhada (endpoint AJAX e módulos PHP, como o Melhor Envio). Não faz requisição à rota AJAX.
  aculta_portal_cep.lookup:
    class: Drupal\aculta_portal_cep\Lookup\CepLookupService
    autowire: true

  aculta_portal_cep.api_probe:
    class: Drupal\aculta_portal_cep\Status\CepApiProbe
    autowire: true

  aculta_portal_cep.status_report:
    class: Drupal\aculta_portal_cep\Status\CepStatusReport
    autowire: true

  aculta_portal_cep.sources:
    class: Drupal\aculta_portal_cep\Settings\CepSources
    autowire: true
