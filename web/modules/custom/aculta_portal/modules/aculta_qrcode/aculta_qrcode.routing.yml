aculta_qrcode.redirect:
  path: '/qr/{codigo}'
  defaults:
    _controller: 'aculta_qrcode.redirect_controller:redirectByCode'
    _title: 'Redirecionamento de código QR'
  requirements:
    _access: 'TRUE'
    codigo: '[0-9a-z]{12}'
  methods: [GET, HEAD]
  options:
    _aculta_domain_purpose: links

aculta_qrcode.batch:
  path: '/painel-administrativo/aculta/codigos-qr/lote'
  defaults:
    _controller: 'aculta_qrcode.batch_controller:batch'
    _title: 'Exportar códigos QR em lote'
  requirements:
    _permission: 'administer aculta qr codes'
  methods: [GET]

aculta_qrcode.preview:
  path: '/painel-administrativo/aculta/codigos-qr/previa'
  defaults:
    _controller: 'aculta_qrcode.preview_controller:preview'
    _title: 'Prévia de código QR'
  requirements:
    _permission: 'administer aculta qr codes'
  methods: [GET]

aculta_qrcode.download:
  path: '/painel-administrativo/aculta/codigos-qr/{aculta_qr_code}/baixar/{formato}'
  defaults:
    _controller: 'aculta_qrcode.download_controller:download'
    _title: 'Baixar código QR'
  requirements:
    _permission: 'administer aculta qr codes'
    formato: 'svg|png|webp|pdf'
  methods: [GET]
