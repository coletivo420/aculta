aculta_portal.secrets_import:
  path: /painel-administrativo/aculta/segredos
  defaults:
    _controller: 'aculta_secrets_manager.controller:page'
    _title: Credenciais do ambiente
  requirements:
    _permission: administer aculta secrets
  options:
    _admin_route: true

aculta_portal.secrets_clear:
  path: /painel-administrativo/aculta/segredos/apagar/{name}
  defaults:
    _controller: 'aculta_secrets_manager.controller:clear'
    _title: Apagar valor
  requirements:
    _permission: administer aculta secrets
    _csrf_token: 'TRUE'
    name: '[A-Z][A-Z0-9_]*'
  options:
    _admin_route: true

aculta_portal.secrets_edit:
  path: /painel-administrativo/aculta/segredos/editar/{name}
  defaults:
    _controller: 'aculta_secrets_manager.controller:edit'
    _title: Alterar credencial
  requirements:
    _permission: administer aculta secrets
    _csrf_token: 'TRUE'
    name: '[A-Z][A-Z0-9_]*'
  options:
    _admin_route: true

aculta_portal.secrets_show:
  path: /painel-administrativo/aculta/segredos/mostrar/{name}
  defaults:
    _controller: 'aculta_secrets_manager.controller:show'
    _title: Valor da credencial
  requirements:
    _permission: administer aculta secrets
    _csrf_token: 'TRUE'
    name: '[A-Z][A-Z0-9_]*'
  options:
    _admin_route: true
