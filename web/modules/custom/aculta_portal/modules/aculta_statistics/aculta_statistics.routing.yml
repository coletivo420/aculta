aculta_statistics.retention:
  path: '/painel-administrativo/aculta/estatisticas/retencao'
  defaults:
    _form: '\Drupal\aculta_statistics\Form\RetentionSettingsForm'
    _title: 'Retenção de estatísticas'
  requirements:
    _permission: 'administer aculta_statistics'

aculta_statistics.wiki_read:
  path: '/estatisticas/wiki/{node}/leitura'
  defaults:
    _controller: 'aculta_statistics.wiki_read_controller:record'
  methods: [POST]
  requirements:
    _access: 'TRUE'
  options:
    parameters:
      node:
        type: entity:node

aculta_statistics.dashboard:
  path: '/painel-administrativo/aculta/estatisticas'
  defaults:
    _controller: '\Drupal\aculta_statistics\Controller\StatisticsDashboardController::overview'
    _title: 'Estatísticas'
  requirements:
    _permission: 'administer aculta_statistics'

aculta_statistics.dashboard_export:
  path: '/painel-administrativo/aculta/estatisticas/exportar'
  defaults:
    _controller: '\Drupal\aculta_statistics\Controller\StatisticsDashboardController::export'
    _title: 'Exportar estatísticas'
  requirements:
    _permission: 'administer aculta_statistics'
