aculta_statistics.settings:
  type: config_object
  label: 'Configurações do ACULTA Statistics'
  mapping:
    retention:
      type: sequence
      label: 'Prazo de retenção por métrica'
      sequence:
        type: mapping
        label: 'Prazo de uma métrica'
        mapping:
          metric:
            type: string
            label: 'Identificador da métrica'
          days:
            type: integer
            label: 'Dias de retenção (0 = indefinido)'
    consent_banner:
      type: mapping
      label: 'Banner de consentimento para visitante anônimo'
      mapping:
        enabled:
          type: boolean
          label: 'Exibir o banner e aplicar o Consent Mode v2 padrão negado'
