# Studio owns /studio. Marley owns /studio/marley and its editorial levels.
aculta_studio.personal:
  path: /studio/pessoal
  defaults:
    _controller: 'aculta_studio.personal_controller:page'
    _title: 'Meu Espaço'
  requirements:
    _permission: 'access aculta portal'
    _user_is_logged_in: 'TRUE'
  options:
    _aculta_domain_purpose: account

# P2-A: profile editor entry is private, not the public /u/{apelido}.
aculta_studio.personal_profile:
  path: /studio/pessoal/perfil
  defaults:
    _controller: 'aculta_studio.personal_profile_controller:page'
    _title: 'Meu Perfil'
  requirements:
    _permission: 'access aculta portal'
    _user_is_logged_in: 'TRUE'
  options:
    _aculta_domain_purpose: account

# P2-B: dedicated Studio editing screens using owner Form API.
# These are distinct experiences, not redirects or compatibility aliases.
aculta_studio.personal_data:
  path: /studio/pessoal/perfil/dados
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\PortalController::myData'
    _title: 'Apelido e dados básicos'
  requirements:
    _permission: 'access aculta portal'
    _user_is_logged_in: 'TRUE'
  options:
    _aculta_domain_purpose: account

aculta_studio.personal_privacy:
  path: /studio/pessoal/perfil/privacidade
  defaults:
    _form: '\Drupal\aculta_user\Form\ProfileVisibilityForm'
    _title: 'Privacidade do perfil'
  requirements:
    _permission: 'access aculta portal'
    _user_is_logged_in: 'TRUE'
  options:
    _aculta_domain_purpose: account

aculta_studio.personal_bio:
  path: /studio/pessoal/perfil/bio
  defaults:
    _form: '\Drupal\aculta_user\Form\AccountBioForm'
    _title: 'Editar biografia'
  requirements:
    _permission: 'access aculta portal'
    _user_is_logged_in: 'TRUE'
  options:
    _aculta_domain_purpose: account

aculta_studio.personal_social:
  path: /studio/pessoal/perfil/redes/{rede}
  defaults:
    _form: '\Drupal\aculta_user\Form\SocialLinkForm'
    _title: 'Editar rede social'
  requirements:
    _permission: 'access aculta portal'
    _user_is_logged_in: 'TRUE'
    rede: 'instagram|facebook|reddit'
  options:
    _aculta_domain_purpose: account

aculta_studio.we_sativa:
  path: /studio/we-sativa
  defaults:
    _controller: 'aculta_studio.we_sativa_controller:page'
    _title: WE SATIVA
  requirements:
    _permission: access aculta portal
  options:
    _aculta_domain_purpose: account

aculta_studio.we_sativa_start:
  path: /studio/we-sativa/inicio
  defaults:
    _controller: 'aculta_studio.we_sativa_controller:start'
    _title: WE SATIVA
  requirements:
    _permission: access aculta portal
  options:
    _aculta_domain_purpose: account

aculta_studio.home:
  path: /studio/marley
  defaults:
    _controller: 'aculta_studio.marley_controller:page'
    _title: 'ACULTA Studio Marley'
    aba: ''
    secao: ''
    sub: ''
  requirements:
    _permission: access aculta portal
  options:
    _aculta_domain_purpose: account

aculta_studio.area:
  path: /studio/marley/{aba}
  defaults:
    _controller: 'aculta_studio.marley_controller:page'
    _title: 'ACULTA Studio Marley'
    secao: ''
    sub: ''
  requirements:
    _permission: access aculta portal
    aba: '[a-z0-9-]+'
  options:
    _aculta_domain_purpose: account

aculta_studio.section:
  path: /studio/marley/{aba}/{secao}
  defaults:
    _controller: 'aculta_studio.marley_controller:page'
    _title: 'ACULTA Studio Marley'
    sub: ''
  requirements:
    _permission: access aculta portal
    aba: '[a-z0-9-]+'
    secao: '[a-z0-9-]+'
  options:
    _aculta_domain_purpose: account

aculta_studio.tab:
  path: /studio/marley/{aba}/{secao}/{sub}
  defaults:
    _controller: 'aculta_studio.marley_controller:page'
    _title: 'ACULTA Studio Marley'
  requirements:
    _permission: access aculta portal
    aba: '[a-z0-9-]+'
    secao: '[a-z0-9-]+'
    sub: '[a-z0-9-]+'
  options:
    _aculta_domain_purpose: account

# Hub general; no compatibility paths or redirects are registered.
aculta_studio.hub:
  path: /studio
  defaults:
    _controller: 'aculta_studio.hub_controller:page'
    _title: 'ACULTA Studio'
  requirements:
    _permission: access aculta portal
    _user_is_logged_in: 'TRUE'
  options:
    _aculta_domain_purpose: account

