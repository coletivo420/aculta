# Separate Studio experiences. The legacy Portal dashboard stays at the
# ACCOUNT front (/); direct /minha-conta remains a protected technical path.
aculta_studio.account:
  path: /studio/conta
  defaults:
    _controller: 'aculta_studio.account_controller:page'
    _title: 'Minha Conta'
  requirements:
    _permission: 'access aculta portal'
    _user_is_logged_in: 'TRUE'
  options:
    _aculta_domain_purpose: account

# Only the community profile is edited here; private account data is separate.
aculta_studio.profile:
  path: /studio/perfil
  defaults:
    _controller: 'aculta_studio.personal_profile_controller:page'
    _title: 'Meu Perfil'
  requirements:
    _permission: 'access aculta portal'
    _user_is_logged_in: 'TRUE'
  options:
    _aculta_domain_purpose: account

aculta_studio.profile_privacy:
  path: /studio/perfil/privacidade
  defaults:
    _form: '\Drupal\aculta_user\Form\ProfileVisibilityForm'
    _title: 'Privacidade do perfil'
  requirements:
    _permission: 'access aculta portal'
    _user_is_logged_in: 'TRUE'
  options:
    _aculta_domain_purpose: account

aculta_studio.profile_bio:
  path: /studio/perfil/bio
  defaults:
    _form: '\Drupal\aculta_user\Form\AccountBioForm'
    _title: 'Editar biografia'
  requirements:
    _permission: 'access aculta portal'
    _user_is_logged_in: 'TRUE'
  options:
    _aculta_domain_purpose: account

aculta_studio.profile_social:
  path: /studio/perfil/redes/{rede}
  defaults:
    _form: '\Drupal\aculta_user\Form\SocialLinkForm'
    _title: 'Editar rede social'
  requirements:
    _permission: 'access aculta portal'
    _user_is_logged_in: 'TRUE'
    rede: 'instagram|facebook|reddit'
  options:
    _aculta_domain_purpose: account

aculta_studio.we_sativa:
  path: /studio/we-sativa
  defaults:
    _controller: 'aculta_studio.we_sativa_controller:page'
    _title: WE SATIVA
  requirements:
    _permission: access aculta portal
  options:
    _aculta_domain_purpose: account

aculta_studio.we_sativa_start:
  path: /studio/we-sativa/inicio
  defaults:
    _controller: 'aculta_studio.we_sativa_controller:start'
    _title: WE SATIVA
  requirements:
    _permission: access aculta portal
  options:
    _aculta_domain_purpose: account

aculta_studio.home:
  path: /studio/marley
  defaults:
    _controller: 'aculta_studio.marley_controller:page'
    _title: 'ACULTA Studio Marley'
    aba: ''
    secao: ''
    sub: ''
  requirements:
    _permission: access aculta portal
  options:
    _aculta_domain_purpose: account

aculta_studio.area:
  path: /studio/marley/{aba}
  defaults:
    _controller: 'aculta_studio.marley_controller:page'
    _title: 'ACULTA Studio Marley'
    secao: ''
    sub: ''
  requirements:
    _permission: access aculta portal
    aba: '[a-z0-9-]+'
  options:
    _aculta_domain_purpose: account

aculta_studio.section:
  path: /studio/marley/{aba}/{secao}
  defaults:
    _controller: 'aculta_studio.marley_controller:page'
    _title: 'ACULTA Studio Marley'
    sub: ''
  requirements:
    _permission: access aculta portal
    aba: '[a-z0-9-]+'
    secao: '[a-z0-9-]+'
  options:
    _aculta_domain_purpose: account

aculta_studio.tab:
  path: /studio/marley/{aba}/{secao}/{sub}
  defaults:
    _controller: 'aculta_studio.marley_controller:page'
    _title: 'ACULTA Studio Marley'
  requirements:
    _permission: access aculta portal
    aba: '[a-z0-9-]+'
    secao: '[a-z0-9-]+'
    sub: '[a-z0-9-]+'
  options:
    _aculta_domain_purpose: account

# Hub general; no compatibility paths or redirects are registered.
aculta_studio.hub:
  path: /studio
  defaults:
    _controller: 'aculta_studio.hub_controller:page'
    _title: 'ACULTA Studio'
  requirements:
    _permission: access aculta portal
    _user_is_logged_in: 'TRUE'
  options:
    _aculta_domain_purpose: account

