aculta_studio.profile:
  path: /perfil
  defaults:
    _controller: 'aculta_studio.profile_controller:page'
    _title: 'Meu Perfil'
  requirements:
    _custom_access: 'aculta_studio.profile_access:access'
  options:
    _aculta_domain_purpose: account

# ACULTA User owns the standalone public-nickname Form API.
aculta_studio.profile_nickname:
  path: /perfil/apelido
  defaults:
    _form: '\Drupal\aculta_user\Form\NicknameForm'
    _title: 'Editar apelido público'
  requirements:
    _custom_access: 'aculta_studio.profile_access:access'
  options:
    _aculta_domain_purpose: account
    no_cache: true

aculta_studio.profile_privacy:
  path: /perfil/privacidade
  defaults:
    _form: '\Drupal\aculta_user\Form\ProfileVisibilityForm'
    _title: 'Privacidade do perfil'
  requirements:
