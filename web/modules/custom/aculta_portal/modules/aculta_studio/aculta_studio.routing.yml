# Conta and Perfil stay separate; the legacy Portal dashboard remains at
# /conta-legada and the account purpose root serves the Conta entry page.
aculta_studio.account:
  path: /conta
  defaults:
    _controller: 'aculta_studio.account_controller:page'
    _title: 'Minha Conta'
  requirements:
    _permission: 'access aculta portal'
    _user_is_logged_in: 'TRUE'
  options:
    _aculta_domain_purpose: account

# S-R3-B2: Portal Profile Form API narrowed by route to private account fields.
aculta_studio.account_data:
  path: /conta/dados
  defaults:
    _controller: 'aculta_studio.account_section_controller:data'
    _title: 'Dados cadastrais'
  requirements:
    _permission: 'access aculta portal'
    _user_is_logged_in: 'TRUE'
  options:
    _aculta_domain_purpose: account
    no_cache: true

# Only the community profile is edited here; private account data is separate.
# S-R3-A: Portal-owned private sections inside the Studio shell.
# Legacy /dados keeps its form. Studio account form excludes public nickname.
aculta_studio.account_address:
  path: /conta/endereco
  defaults:
    _controller: 'aculta_studio.account_section_controller:address'
    _title: 'Endereço'
  requirements:
    _permission: 'access aculta portal'
    _user_is_logged_in: 'TRUE'
  options:
    _aculta_domain_purpose: account
    no_cache: true

# S-R3-B1: CPF/CNPJ remains owned by Portal + optional aculta_id_cpf.
# No second storage or profile-public exposure.
aculta_studio.account_documents:
  path: /conta/documentos
  defaults:
    _controller: 'aculta_studio.account_section_controller:documents'
    _title: 'Documentos'
  requirements:
    _permission: 'access aculta portal'
    _user_is_logged_in: 'TRUE'
  options:
    _aculta_domain_purpose: account
    no_cache: true

aculta_studio.account_security:
  path: /conta/seguranca
  defaults:
    _controller: 'aculta_studio.account_section_controller:security'
    _title: 'E-mail e segurança'
  requirements:
    _permission: 'access aculta portal'
    _user_is_logged_in: 'TRUE'
  options:
    _aculta_domain_purpose: account
    no_cache: true

aculta_studio.account_password:
  path: /conta/seguranca/senha
  defaults:
    _controller: 'aculta_studio.account_section_controller:password'
    _title: 'Senha'
  requirements:
    _permission: 'access aculta portal'
    _user_is_logged_in: 'TRUE'
  options:
    _aculta_domain_purpose: account
    no_cache: true

aculta_studio.account_connections:
  path: /conta/conexoes
  defaults:
    _controller: 'aculta_studio.account_section_controller:connections'
    _title: 'Contas conectadas'
  requirements:
    _permission: 'access aculta portal'
    _user_is_logged_in: 'TRUE'
  options:
    _aculta_domain_purpose: account
    no_cache: true

# S-R3-B3: keep Commerce orders, support history and appearance Form API
# with their Portal owners, composed under Studio without a second shell.
aculta_studio.account_orders:
  path: /conta/pedidos
  defaults:
    _controller: 'aculta_studio.account_section_controller:orders'
    _title: 'Meus pedidos'
  requirements:
    _permission: 'access aculta portal'
    _user_is_logged_in: 'TRUE'
