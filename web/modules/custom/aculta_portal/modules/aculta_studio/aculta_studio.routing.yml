    _title: 'Meus Salvos'
  requirements:
    _permission: access aculta portal
    _user_is_logged_in: 'TRUE'
  options:
    _aculta_domain_purpose: account

# Ganjalab learner and educator experiences are owned by Studio. Route IDs remain stable during migration.
aculta_lms.student_dashboard:
  path: '/ganjalab'
  defaults:
    _controller: 'aculta_studio.ganjalab_controller:student'
    _title: 'ACULTA Studio Ganjalab Estudante'
  requirements:
    _permission: access aculta portal
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true
    _aculta_domain_purpose: courses

# Keep the Group owner's add Form API inside the educator workspace, purpose
# and theme. The generated entity.group.add_form is an admin route on purpose
# main, so it would return 404 on courses and drop the ACULTA Studio shell.
aculta_lms.course_create:
  path: '/ganjalab/educador/cursos/novo'
  defaults:
    _controller: 'aculta_studio.course_authoring_controller:create'
    _title: 'Novo curso - Ganjalab Educador'
  requirements:
    _permission: 'create lms_course group'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true
    _aculta_domain_purpose: courses

aculta_lms.educator_dashboard:
  path: '/ganjalab/educador'
  defaults:
    _controller: 'aculta_studio.course_authoring_controller:dashboard'
    _title: 'ACULTA Studio Ganjalab Educador'
  requirements:
    _permission: 'create lms_course group'
    _user_is_logged_in: 'TRUE'
  options:
    no_cache: true
    _aculta_domain_purpose: courses

# The LMS owns curriculum data and Form API; Studio owns the educator routes.
aculta_lms.course_structure:
  path: '/ganjalab/educador/cursos/{course}/estrutura'
  defaults:
    _controller: 'aculta_lms.course_structure_controller:structure'
    _title: 'Estrutura do curso'
  requirements:
    _custom_access: 'aculta_lms.course_authoring_access:access'
  options:
    no_cache: true
    _aculta_domain_purpose: courses
    parameters:
      course:
        type: entity:group

aculta_lms.lesson_add:
  path: '/ganjalab/educador/cursos/{course}/aulas/nova'
  defaults:
    _form: '\Drupal\aculta_lms\Form\LessonAuthoringForm'
    _title: 'Nova aula'
  requirements:
    _custom_access: 'aculta_lms.course_authoring_access:access'
  options:
    no_cache: true
    _aculta_domain_purpose: courses
    parameters:
      course:
        type: entity:group

aculta_lms.lesson_edit:
  path: '/ganjalab/educador/cursos/{course}/aulas/{lesson}/editar'
  defaults:
    _form: '\Drupal\aculta_lms\Form\LessonAuthoringForm'
    _title: 'Editar aula'
  requirements:
    _custom_access: 'aculta_lms.course_authoring_access:access'
  options:
    no_cache: true
    _aculta_domain_purpose: courses
    parameters:
      course:
        type: entity:group
      lesson:
        type: entity:aculta_lms_lesson

aculta_lms.lesson_delete:
  path: '/ganjalab/educador/cursos/{course}/aulas/{lesson}/excluir'
  defaults:
    _form: '\Drupal\aculta_lms\Form\LessonDeleteForm'
    _title: 'Excluir aula'
  requirements:
    _custom_access: 'aculta_lms.course_authoring_access:access'
  options:
    no_cache: true
    _aculta_domain_purpose: courses
    parameters:
      course:
        type: entity:group
      lesson:
        type: entity:aculta_lms_lesson

aculta_lms.activity_add:
  path: '/ganjalab/educador/cursos/{course}/aulas/{lesson}/atividades/nova'
  defaults:
    _form: '\Drupal\aculta_lms\Form\ActivityAuthoringForm'
    _title: 'Nova atividade'
  requirements:
    _custom_access: 'aculta_lms.course_authoring_access:access'
  options:
    no_cache: true
    _aculta_domain_purpose: courses
    parameters:
      course:
        type: entity:group
      lesson:
        type: entity:aculta_lms_lesson

aculta_lms.activity_edit:
  path: '/ganjalab/educador/cursos/{course}/aulas/{lesson}/atividades/{activity}/editar'
  defaults:
    _form: '\Drupal\aculta_lms\Form\ActivityAuthoringForm'
    _title: 'Editar atividade'
  requirements:
    _custom_access: 'aculta_lms.course_authoring_access:access'
  options:
    no_cache: true
    _aculta_domain_purpose: courses
    parameters:
      course:
        type: entity:group
      lesson:
        type: entity:aculta_lms_lesson
      activity:
        type: entity:aculta_lms_activity

aculta_lms.activity_delete:
  path: '/ganjalab/educador/cursos/{course}/aulas/{lesson}/atividades/{activity}/excluir'
  defaults:
    _form: '\Drupal\aculta_lms\Form\ActivityDeleteForm'
    _title: 'Excluir atividade'
  requirements:
    _custom_access: 'aculta_lms.course_authoring_access:access'
  options:
