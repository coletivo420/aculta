# Marley ocupa as rotas editoriais; os IDs de área funcionais permanecem estáveis.
# P1-A: personal Studio entry, without replacing /studio (legacy Marley).
# P1-B: preview future global hub, preserving legacy Marley at /studio.
aculta_studio.hub_preview:
  path: /studio/inicio
  defaults:
    _controller: 'aculta_studio.hub_preview_controller:page'
    _title: 'ACULTA Studio'
  requirements:
    _permission: 'access aculta portal'
    _user_is_logged_in: 'TRUE'
  methods: [GET, HEAD]
  options:
    _aculta_domain_purpose: account

aculta_studio.personal:
  path: /studio/pessoal
  defaults:
    _controller: 'aculta_studio.personal_controller:page'
    _title: 'Meu Espaço'
  requirements:
    _permission: 'access aculta portal'
    _user_is_logged_in: 'TRUE'
  options:
    _aculta_domain_purpose: account

aculta_studio.we_sativa:
  path: /studio/we-sativa
  defaults:
    _controller: 'aculta_studio.we_sativa_controller:page'
    _title: WE SATIVA
  requirements:
    _permission: access aculta portal
  options:
    _aculta_domain_purpose: account

aculta_studio.we_sativa_start:
  path: /studio/we-sativa/inicio
  defaults:
    _controller: 'aculta_studio.we_sativa_controller:start'
    _title: WE SATIVA
  requirements:
    _permission: access aculta portal
  options:
    _aculta_domain_purpose: account

aculta_studio.home:
  path: /studio/marley
  defaults:
    _controller: 'aculta_studio.marley_controller:page'
    _title: 'ACULTA Studio Marley'
    aba: ''
    secao: ''
    sub: ''
  requirements:
    _permission: access aculta portal
  options:
    _aculta_domain_purpose: account

aculta_studio.area:
  path: /studio/marley/{aba}
  defaults:
    _controller: 'aculta_studio.marley_controller:page'
    _title: 'ACULTA Studio Marley'
    secao: ''
    sub: ''
  requirements:
    _permission: access aculta portal
    aba: '[a-z0-9-]+'
  options:
    _aculta_domain_purpose: account

aculta_studio.section:
  path: /studio/marley/{aba}/{secao}
  defaults:
    _controller: 'aculta_studio.marley_controller:page'
    _title: 'ACULTA Studio Marley'
    sub: ''
  requirements:
    _permission: access aculta portal
    aba: '[a-z0-9-]+'
    secao: '[a-z0-9-]+'
  options:
    _aculta_domain_purpose: account

aculta_studio.tab:
  path: /studio/marley/{aba}/{secao}/{sub}
  defaults:
    _controller: 'aculta_studio.marley_controller:page'
    _title: 'ACULTA Studio Marley'
  requirements:
    _permission: access aculta portal
    aba: '[a-z0-9-]+'
    secao: '[a-z0-9-]+'
    sub: '[a-z0-9-]+'
  options:
    _aculta_domain_purpose: account

# /studio permanece como entrada de compatibilidade da plataforma editorial.
aculta_studio.legacy_home:
  path: /studio
  defaults:
    _controller: 'aculta_studio.marley_controller:legacyPage'
    _title: 'ACULTA Studio Marley'
    aba: ''
    secao: ''
    sub: ''
  requirements:
    _permission: access aculta portal
  options:
    _aculta_domain_purpose: account

# Os padrões genéricos continuam válidos para áreas antigas; o controller
# reconhece /studio/ganjalab/{...} como a antiga árvore editorial e redireciona.
aculta_studio.legacy_area:
  path: /studio/{aba}
  defaults:
    _controller: 'aculta_studio.marley_controller:legacyPage'
    _title: 'ACULTA Studio Marley'
    secao: ''
    sub: ''
  requirements:
    _permission: access aculta portal
    aba: '[a-z0-9-]+'
  methods: [GET, HEAD]
  options:
    _aculta_domain_purpose: account

aculta_studio.legacy_section:
  path: /studio/{aba}/{secao}
  defaults:
    _controller: 'aculta_studio.marley_controller:legacyPage'
    _title: 'ACULTA Studio Marley'
    sub: ''
  requirements:
    _permission: access aculta portal
    aba: '[a-z0-9-]+'
    secao: '[a-z0-9-]+'
