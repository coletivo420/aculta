# Contrato de navegação: cada nível do GanjaLab tem URL própria. A ordem é área, seção e aba.
aculta_studio.home:
  path: /ganjalab
  defaults:
    _controller: 'aculta_studio.controller:page'
    _title: GanjaLab
    aba: ''
    secao: ''
    sub: ''
  requirements:
    _permission: access aculta portal
  options:
    _aculta_domain_purpose: account

aculta_studio.area:
  path: /ganjalab/{aba}
  defaults:
    _controller: 'aculta_studio.controller:page'
    _title: GanjaLab
    secao: ''
    sub: ''
  requirements:
    _permission: access aculta portal
    aba: '[a-z0-9-]+'
  options:
    _aculta_domain_purpose: account

aculta_studio.section:
  path: /ganjalab/{aba}/{secao}
  defaults:
    _controller: 'aculta_studio.controller:page'
    _title: GanjaLab
    sub: ''
  requirements:
    _permission: access aculta portal
    aba: '[a-z0-9-]+'
    secao: '[a-z0-9-]+'
  options:
    _aculta_domain_purpose: account

aculta_studio.tab:
  path: /ganjalab/{aba}/{secao}/{sub}
  defaults:
    _controller: 'aculta_studio.controller:page'
    _title: GanjaLab
  requirements:
    _permission: access aculta portal
    aba: '[a-z0-9-]+'
    secao: '[a-z0-9-]+'
    sub: '[a-z0-9-]+'
  options:
    _aculta_domain_purpose: account
