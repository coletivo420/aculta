  options:
    _aculta_domain_purpose: account

aculta_studio.profile_bio:
  path: /perfil/bio
  defaults:
    _form: '\Drupal\aculta_user\Form\AccountBioForm'
    _title: 'Editar biografia'
  requirements:
    _custom_access: 'aculta_studio.profile_access:access'
  options:
    _aculta_domain_purpose: account

aculta_studio.profile_social:
  path: /perfil/redes/{rede}
  defaults:
    _form: '\Drupal\aculta_user\Form\SocialLinkForm'
    _title: 'Editar rede social'
  requirements:
    _custom_access: 'aculta_studio.profile_access:access'
    rede: 'instagram|facebook|reddit'
  options:
    _aculta_domain_purpose: account

aculta_studio.we_sativa:
