  defaults:
    _controller: 'aculta_studio.we_sativa_controller:start'
    _title: 'ACULTA STUDIO WE SATIVA'
  requirements:
    _permission: access aculta portal
  options:
    _aculta_domain_purpose: wiki

aculta_studio.home:
  path: /marley
  defaults:
