services:
  aculta_studio.tab_manager:
    class: Drupal\aculta_studio\StudioTabManager
    parent: default_plugin_manager
  aculta_studio.presenter:
    class: Drupal\aculta_studio\StudioPresenter
    arguments: ['@aculta_studio.tab_manager']
  aculta_studio.controller:
    class: Drupal\aculta_studio\Controller\StudioController
    arguments: ['@aculta_studio.presenter', '@current_user', '@aculta_studio.listing', '@string_translation']
  aculta_studio.listing:
    class: Drupal\aculta_studio\StudioListingBuilder
    arguments: ['@entity_type.manager', '@date.formatter', '@aculta_portal.domain_purpose', '@current_user', '@string_translation']
  aculta_studio.learner_dashboard_composer:
    class: Drupal\aculta_studio\Learning\LearnerDashboardComposer
    arguments: ['@aculta_lms.learning_dashboard', '@current_user', '@date.formatter', '@string_translation']
  aculta_studio.experience_manager:
    class: Drupal\aculta_studio\Experience\StudioExperienceManager
    calls:
      - [addProvider, ['@aculta_studio.experience.ganjalab420']]
  aculta_studio.experience.ganjalab420:
    class: Drupal\aculta_studio\Experience\GanjaLab420ExperienceProvider
    arguments: ['@?aculta_lms.learning_dashboard_controller']
  aculta_studio.ganjalab420_controller:
    class: Drupal\aculta_studio\Controller\GanjaLab420Controller
    arguments: ['@aculta_studio.experience_manager', '@current_user']
