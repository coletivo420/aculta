aculta_ui_library.blocks:
  path: /painel-administrativo/aculta/ui-library/blocos
  defaults:
    _controller: '\Drupal\aculta_ui_library\Controller\UiPatternsLibraryRedirectController::redirectToLibrary'
    _title: 'Componentes SDC'
  requirements:
    _permission: 'administer blocks'
    _aculta_ui_library_access: 'TRUE'
  options:
    _admin_route: true
    _aculta_site_key: main
    no_cache: true
