aculta_user.perfil_publico:
  path: '/u/{apelido}'
  defaults:
    _controller: '\Drupal\aculta_user\Controller\PublicProfileController::view'
    _title: 'Perfil'
  requirements:
    _access: 'TRUE'
    apelido: '[a-z0-9][a-z0-9-]{2,39}'
  options:
    # Perfil público existe só no purpose MAIN; em outro host responde 404 (DomainPurposeRequestSubscriber).
    _aculta_domain_purpose: 'main'

aculta_user.configuracoes_privacidade:
  path: '/configuracoes/privacidade'
  defaults:
    _form: '\Drupal\aculta_user\Form\ProfileVisibilityForm'
    _title: 'Privacidade'
  requirements:
    _permission: 'access aculta portal'

aculta_user.participacao_settings:
  path: '/admin/config/aculta/portal/participacao'
  defaults:
    _form: '\Drupal\aculta_user\Form\ParticipationSettingsForm'
    _title: 'Regras de participação'
  requirements:
    _permission: 'administer aculta participacao'

aculta_user.atividade:
  path: '/atividade/{aba}'
  defaults:
    _controller: '\Drupal\aculta_user\Controller\ActivityController::view'
    _title: 'Atividade'
    aba: 'wiki'
  requirements:
    _permission: 'access aculta portal'
    aba: 'wiki|forum|revista|comentarios|conquistas'

aculta_user.associados:
  path: '/admin/aculta/associados'
  defaults:
    _controller: '\Drupal\aculta_user\Controller\AssociadosController::report'
    _title: 'Associados'
  requirements:
    _permission: 'administer aculta associados'

aculta_user.associados_csv:
  path: '/admin/aculta/associados/exportar'
  defaults:
    _controller: '\Drupal\aculta_user\Controller\AssociadosController::export'
    _title: 'Exportar associados'
  requirements:
    _permission: 'export aculta associados'

aculta_user.avatar_reroll:
  path: '/avatar/sortear'
  defaults:
    _controller: '\Drupal\aculta_user\Controller\AvatarRerollController::reroll'
  requirements:
    _permission: 'access aculta portal'
    _csrf_token: 'TRUE'

aculta_user.avatar_crop:
  path: '/avatar/recortar'
  defaults:
    _form: '\Drupal\aculta_user\Form\AvatarCropForm'
    _title: 'Recortar foto'
  requirements:
    _permission: 'access aculta portal'

aculta_user.foto:
  path: '/avatar/foto'
  defaults:
    _form: '\Drupal\aculta_user\Form\UserPictureForm'
    _title: 'Foto do perfil'
  requirements:
    _permission: 'access aculta portal'

aculta_user.bio_form:
  path: '/bio/editar'
  defaults:
    _form: '\Drupal\aculta_user\Form\AccountBioForm'
    _title: 'Editar bio'
  requirements:
    _custom_access: 'aculta_user.account_modal_access:access'
  options:
    _aculta_domain_purpose: 'account'

aculta_user.bio_save:
  path: '/bio/salvar'
  defaults:
    _controller: '\Drupal\aculta_user\Controller\AccountBioSaveController::save'
  methods: [POST]
  requirements:
    _permission: 'access aculta portal'
    _csrf_token: 'TRUE'
  options:
    _aculta_domain_purpose: 'account'

aculta_user.redes_form:
  path: '/redes/editar/{rede}'
  defaults:
    _form: '\Drupal\aculta_user\Form\SocialLinkForm'
    _title: 'Editar rede social'
  requirements:
    _custom_access: 'aculta_user.account_modal_access:access'
    rede: 'instagram|facebook|reddit'
  options:
    _aculta_domain_purpose: 'account'

aculta_user.redes_save:
  path: '/redes/salvar'
  defaults:
    _controller: '\Drupal\aculta_user\Controller\SocialLinkSaveController::save'
  methods: [POST]
  requirements:
    _permission: 'access aculta portal'
    _csrf_token: 'TRUE'
  options:
    _aculta_domain_purpose: 'account'
