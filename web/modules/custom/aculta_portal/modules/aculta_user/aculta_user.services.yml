services:
  aculta_user.achievement_definitions:
    class: Drupal\aculta_user\Badge\AchievementDefinitions
    arguments: ['@config.factory', '@lock.persistent', '@entity_type.manager', '@file.usage']
    tags:
      - { name: aculta_portal.helper }
  aculta_user.friendship_manager:
    class: Drupal\aculta_user\Social\FriendshipManager
    arguments: ['@entity_type.manager', '@current_user', '@lock.persistent', '@flood']
  aculta_user.public_profile_policy:
    class: Drupal\aculta_user\PublicProfilePolicy
  aculta_user.participation_rules:
    class: Drupal\aculta_user\ParticipationRules
    arguments: ['@config.factory', '@entity_type.manager']
  aculta_user.avatar_pool:
    class: Drupal\aculta_user\Avatar\AvatarPool
    arguments: ['@extension.list.module', '@file_system', '@entity_type.manager', '@user.data', '%app.root%']
  aculta_user.social_auth_fields_subscriber:
    class: Drupal\aculta_user\EventSubscriber\SocialAuthFieldsSubscriber
    arguments: ['@entity_type.manager']
    tags:
      - { name: event_subscriber }
  aculta_user.photo_editor_guard:
    class: Drupal\aculta_user\Form\PhotoEditorGuard
  aculta_user.avatar_asset_cleanup:
    class: Drupal\aculta_user\Avatar\AvatarAssetCleanup
    arguments: ["@entity_type.manager", "@datetime.time", "@file.usage", '@aculta_image.file_remover']
  aculta_user.badge_service:
    class: Drupal\aculta_user\Badge\BadgeService
    arguments: ['@entity_type.manager', '@lock.persistent', '@database', '@datetime.time', '@aculta_user.achievement_definitions']
  aculta_user.account_bio_card:
    class: Drupal\aculta_user\Bio\AccountBioCard
    arguments: ['@entity_type.manager']
  aculta_user.account_modal_access:
    class: Drupal\aculta_user\Access\AccountModalAccess
    arguments: ['@current_user', '@request_stack']
  aculta_user.social_networks:
    class: Drupal\aculta_user\Social\SocialNetworks
  aculta_user.social_links_card:
    class: Drupal\aculta_user\Social\SocialLinksCard
    arguments: ['@entity_type.manager', '@aculta_user.social_networks']
  aculta_user.legacy_authors:
    class: Drupal\aculta_user\Legacy\LegacyAuthorManager
    arguments: ['@entity_type.manager']
  aculta_user.report_queue:
    class: Drupal\aculta_user\Moderation\ReportQueue
    arguments: ['@entity_type.manager']
  aculta_user.restricted_forum_not_found:
    class: Drupal\aculta_user\EventSubscriber\RestrictedForumNotFoundSubscriber
    arguments: ['@current_user', '@aculta_user.restricted_forum_grants']
    tags:
      - { name: event_subscriber }
  aculta_user.restricted_forum_grants:
    class: Drupal\aculta_user\Forum\RestrictedForumGrants
    arguments: ['@aculta_user.associado_marker']
  aculta_user.associado_marker:
    class: Drupal\aculta_user\Associado\AssociadoMarker
    arguments: ['@entity_type.manager']
  aculta_user.public_profile_not_canonical:
    class: Drupal\aculta_user\EventSubscriber\PublicProfileNotCanonicalSubscriber
    arguments: ['@router.route_provider']
    tags:
      - { name: event_subscriber }
