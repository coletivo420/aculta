aculta_user.settings:
  type: config_object
  label: 'ACULTA User participation settings for tests'
  mapping:
    topico_limite_ativo:
      type: boolean
      label: 'Enable the topic comment limit'
    topico_comentarios_minimos:
      type: integer
      label: 'Minimum published comments'
    primeiro_comentario_discussao_moderado:
      type: boolean
      label: 'Moderate initial discussion comments'
    bloqueio_ate_aprovacao:
      type: boolean
      label: 'Block topic creation while comments are pending'
    papeis_isentos:
      type: sequence
      label: 'Exempt roles'
      sequence:
        type: string
