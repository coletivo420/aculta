aculta_portal.wiki_home:
  path: /wiki
  defaults:
    _controller: \Drupal\aculta_wiki\Controller\WikiController::home
    _title: Wiki420
  requirements:
    _permission: access content

aculta_portal.wiki_search:
  path: /wiki/busca
  defaults:
    _controller: \Drupal\aculta_wiki\Controller\WikiController::search
    _title: Buscar na Wiki420
  requirements:
    _permission: access content

aculta_portal.wiki_search_preview:
  path: /wiki/busca/previa
  defaults:
    _controller: '\Drupal\aculta_wiki\Controller\WikiController::preview'
  requirements:
    _permission: access content

aculta_wiki.proposal_submit:
  path: '/wiki/verbetes/{node}/contribuir'
  defaults:
    _form: '\Drupal\aculta_wiki\Form\WikiProposalSubmissionForm'
    _title: 'Contribuir com este verbete'
  requirements:
    _permission: 'submit wiki proposals'
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node

aculta_wiki.proposal_decide:
  path: '/studio/ganjalab/wiki/propostas/{proposal}/decidir'
  defaults:
    _form: '\Drupal\aculta_wiki\Form\WikiProposalDecisionForm'
    _title: 'Avaliar proposta da Wiki'
  requirements:
    _permission: 'moderate wiki proposals'
    _entity_access: 'aculta_wiki_proposal.update'
  options:
    _aculta_domain_purpose: account
    parameters:
      proposal:
        type: entity:aculta_wiki_proposal

aculta_wiki.settings:
  path: '/painel-administrativo/aculta/wiki'
  defaults:
    _form: '\Drupal\aculta_wiki\Form\WikiSettingsForm'
    _title: 'Wiki420'
  requirements:
    _permission: 'administer aculta_wiki'
  options:
    _admin_route: TRUE
