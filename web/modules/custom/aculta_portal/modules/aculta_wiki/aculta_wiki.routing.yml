aculta_portal.wiki_home:
  path: /wiki
  defaults:
    _controller: \Drupal\aculta_wiki\Controller\WikiController::home
    _title: Wiki420
  requirements:
    _permission: access content
  options:
    _aculta_site_key: wiki
    _aculta_show_page_title_on_front: true

aculta_portal.wiki_search:
  path: /busca-wiki
  defaults:
    _controller: \Drupal\aculta_wiki\Controller\WikiController::search
    _title: Buscar na Wiki420
  requirements:
    _permission: access content
  options:
    _aculta_site_key: wiki

aculta_portal.wiki_search_preview:
  path: /busca-wiki/previa
  defaults:
    _controller: '\Drupal\aculta_wiki\Controller\WikiController::preview'
  requirements:
    _permission: access content
  options:
    _aculta_site_key: wiki

aculta_wiki.contribution_intent:
  path: '/verbetes/{node}/contribuir/como'
  defaults:
    _controller: '\Drupal\aculta_wiki\Controller\WikiContributionIntentController::page'
    _title: 'Como você quer contribuir?'
  requirements:
    _permission: access content
    _entity_access: 'node.view'
  options:
    _aculta_site_key: wiki
    parameters:
      node:
        type: entity:node

aculta_wiki.proposal_submit:
  path: '/verbetes/{node}/contribuir'
  defaults:
    _form: '\Drupal\aculta_wiki\Form\WikiProposalSubmissionForm'
    _title: 'Contribuir com este verbete'
  requirements:
    _permission: 'submit wiki proposals'
    _entity_access: 'node.view'
  options:
    _aculta_site_key: wiki
    parameters:
      node:
        type: entity:node

aculta_wiki.proposal_status:
  path: '/propostas/{proposal}'
  defaults:
    _controller: '\Drupal\aculta_wiki\Controller\WikiProposalStatusController::view'
    _title: 'Minha proposta para a Wiki420'
  requirements:
    _entity_access: 'proposal.view'
  options:
    _aculta_site_key: wiki
    parameters:
      proposal:
        type: wiki_proposal

aculta_wiki.studio_entry_create:
  path: '/we-sativa/verbetes/novo'
  defaults:
    _controller: '\Drupal\aculta_wiki\Controller\WikiEntryCreateController::createEntry'
    _title: 'Criar verbete'
  requirements:
    _entity_create_access: 'node:wiki_entry'
    _user_is_logged_in: 'TRUE'
  options:
    _aculta_site_key: wiki

aculta_wiki.proposal_withdraw:
  path: '/propostas/{proposal}/retirar'
  defaults:
    _form: '\Drupal\aculta_wiki\Form\WikiProposalWithdrawalForm'
    _title: 'Retirar proposta da Wiki420'
  requirements:
    _entity_access: 'proposal.view'
  options:
    _aculta_site_key: wiki
    parameters:
      proposal:
        type: wiki_proposal

aculta_wiki.proposal_decide:
  path: '/we-sativa/propostas/{proposal}/decidir'
  defaults:
    _form: '\Drupal\aculta_wiki\Form\WikiProposalDecisionForm'
    _title: 'Avaliar proposta da Wiki'
  requirements:
    _permission: 'moderate wiki proposals'
    _entity_access: 'proposal.update'
  options:
    _aculta_site_key: wiki
    parameters:
      proposal:
        type: wiki_proposal


# Wiki editorial moderation belongs to WE Sativa, not Marley or the Forum.
aculta_wiki.moderation_home:
  path: '/we-sativa/moderacao'
  defaults:
    _controller: 'aculta_wiki.moderation_controller:overview'
    _title: 'WE Sativa - moderação da Wiki'
  requirements:
    _custom_access: 'aculta_wiki.moderation_access:overviewAccess'
  options:
    _aculta_site_key: wiki
    no_cache: true
  methods: [GET, HEAD]

aculta_wiki.moderation_proposals:
  path: '/we-sativa/moderacao/propostas'
  defaults:
    _controller: 'aculta_wiki.moderation_controller:proposals'
    _title: 'WE Sativa - propostas'
  requirements:
    _custom_access: 'aculta_wiki.moderation_access:proposalsAccess'
  options:
    _aculta_site_key: wiki
    no_cache: true
  methods: [GET, HEAD]

aculta_wiki.moderation_revisions:
  path: '/we-sativa/moderacao/verbetes'
  defaults:
    _controller: 'aculta_wiki.moderation_controller:revisions'
    _title: 'WE Sativa - verbetes em revisão'
  requirements:
    _custom_access: 'aculta_wiki.moderation_access:revisionsAccess'
  options:
    _aculta_site_key: wiki
    no_cache: true
  methods: [GET, HEAD]

aculta_wiki.moderation_reports:
  path: '/we-sativa/moderacao/denuncias'
  defaults:
    _controller: 'aculta_wiki.moderation_controller:reports'
    _title: 'WE Sativa - denúncias da Wiki'
  requirements:
    _custom_access: 'aculta_wiki.moderation_access:reportsAccess'
  options:
    _aculta_site_key: wiki
    no_cache: true
  methods: [GET, HEAD]

aculta_wiki.moderation_report_decide:
  path: '/we-sativa/moderacao/denuncias/{aculta_cgu_report}/decidir'
  defaults:
    _controller: 'aculta_wiki.moderation_controller:decision'
    _title: 'WE Sativa - avaliar denúncia da Wiki'
  requirements:
    _custom_access: 'aculta_wiki.moderation_access:reportAccess'
  options:
    _aculta_site_key: wiki
    no_cache: true
    parameters:
      aculta_cgu_report:
        type: entity:aculta_cgu_report
  methods: [GET, HEAD, POST]
