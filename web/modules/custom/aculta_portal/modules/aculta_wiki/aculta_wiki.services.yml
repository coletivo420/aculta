services:
  aculta_wiki.presentation.wiki_search_form:
    class: Drupal\aculta_wiki\Presentation\WikiSearchFormBuilder
    arguments: ['@string_translation', '@request_stack']
  aculta_wiki.wiki_lead_image_uploader:
    class: Drupal\aculta_wiki\Upload\WikiLeadImageUploader
    arguments: ['@entity_type.manager', '@aculta_portal.user_upload_policy', '@current_user', '@string_translation']
  Drupal\aculta_wiki\Hook\WikiEntryImageHooks:
    class: Drupal\aculta_wiki\Hook\WikiEntryImageHooks
    arguments:
      - '@string_translation'
      - '@aculta_portal.user_upload_policy'
      - '@aculta_portal.user_upload_dialog_builder'
      - '@aculta_wiki.wiki_lead_image_uploader'
