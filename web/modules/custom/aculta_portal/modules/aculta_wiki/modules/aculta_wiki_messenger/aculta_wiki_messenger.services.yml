services:
  Drupal\aculta_wiki_messenger\WikiNoticeManagerInterface: '@aculta_wiki_messenger.notice_manager'
  aculta_wiki_messenger.notice_manager:
    class: Drupal\aculta_wiki_messenger\WikiNoticeManager
    arguments: ['@entity_type.manager', '@aculta_portal.domain_purpose', '@aculta_messenger.aviso_preferencias', '@queue', '@lock.persistent', '@logger.channel.aculta_wiki_messenger']
    tags:
      - { name: aculta_messenger.aviso_digest_provider }
  aculta_wiki_messenger.editorial_notice_publisher:
    class: Drupal\aculta_wiki_messenger\EventSubscriber\WikiEditorialNoticePublisher
    arguments: ['@entity_type.manager', '@aculta_portal.domain_purpose', '@aculta_messenger.notice_event_publisher', '@datetime.time', '@logger.channel.aculta_wiki_messenger']
    tags:
      - { name: event_subscriber }
  aculta_wiki_messenger.notice_event_subscriber:
    class: Drupal\aculta_wiki_messenger\EventSubscriber\WikiNoticeEventSubscriber
    arguments: ['@aculta_wiki_messenger.notice_manager']
    tags:
      - { name: event_subscriber }
  Drupal\aculta_wiki_messenger\Hook\WikiNoticeHooks:
    class: Drupal\aculta_wiki_messenger\Hook\WikiNoticeHooks
    arguments: ['@aculta_wiki_messenger.notice_manager']
  aculta_wiki_messenger.notice_access:
    class: Drupal\aculta_wiki_messenger\AccessWikiNotice
    arguments: ['@aculta_wiki_messenger.notice_manager', '@current_user']
  aculta_wiki_messenger.notice_open_controller:
    class: Drupal\aculta_wiki_messenger\Controller\WikiNoticeOpenController
    arguments: ['@aculta_wiki_messenger.notice_manager', '@current_user']
  Drupal\aculta_wiki_messenger\Mail\WikiNoticeMailType:
    class: Drupal\aculta_wiki_messenger\Mail\WikiNoticeMailType
    arguments: ['@string_translation']
    tags:
      - { name: aculta_mailer.type }
  logger.channel.aculta_wiki_messenger:
    parent: logger.channel_base
    arguments: ['aculta_wiki_messenger']
