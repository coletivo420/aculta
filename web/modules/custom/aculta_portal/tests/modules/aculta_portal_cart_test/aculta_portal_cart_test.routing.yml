# Cópia mínima da rota real (`aculta_portal.routing.yml`) para os testes em
# Kernel, que não habilitam o módulo aculta_portal inteiro. Se o caminho ou o
# controller da rota real mudarem, o teste Unit de caracterização das rotas
# falha; este arquivo precisa acompanhar.
aculta_portal.cart_checkout:
  path: /carrinho/finalizar
  defaults:
    _controller: '\Drupal\aculta_portal\Controller\CartCheckoutController::finalizar'
    _title: 'Finalizar carrinho'
  requirements:
    _access: 'TRUE'
