$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: QR Download
description: 'Lista de formatos para baixar um código QR (SVG, PNG, WebP e PDF).'
status: experimental
group: ACULTA QR

props:
  type: object
  properties:
    title:
      title: Título do grupo
      type: string
    formats:
      title: Formatos disponíveis
      type: array
      items:
        type: object
        properties:
          label:
            title: Rótulo
            type: string
          url:
            title: URL do download
            type: string
        required:
          - label
          - url
  required:
    - title
    - formats
