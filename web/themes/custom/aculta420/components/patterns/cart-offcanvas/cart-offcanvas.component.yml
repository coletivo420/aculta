$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Carrinho (gaveta lateral)
status: experimental
group: Patterns
description: 'Ícone do carrinho na barra multidomínio e gaveta lateral: um carrinho único, com separador por tipo de pedido e botão de checkout em cada separador. Usa o offcanvas e as abas do Bootstrap, sem JavaScript próprio. Recebe só dados neutros do Portal.'
props:
  type: object
  properties:
    count:
      type: integer
      description: 'Quantidade de itens no carrinho.'
      default: 0
      minimum: 0
    empty:
      type: boolean
      description: 'Carrinho vazio.'
      default: true
    url:
      type: string
      description: 'URL absoluta do carrinho no MAIN.'
      default: ''
    total:
      type: string
      description: 'Total formatado (ex.: R$ 30,00).'
      default: ''
    sites:
      type: array
      description: 'Separadores do carrinho único (loja, cursos, apoio): key, label, count, empty, total, items (title, quantity, total) e checkout_url (botão de checkout do separador, no MAIN).'
      default: []
    banner:
      type: string
      description: 'Frase fixa do rodapé da gaveta.'
      default: 'Compre na loja e apoie a luta antiproibicionista!'
slots: {}
assets:
  css:
    component:
      cart-offcanvas.css: {}
