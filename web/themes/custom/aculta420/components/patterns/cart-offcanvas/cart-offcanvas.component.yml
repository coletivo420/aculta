$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Carrinho (gaveta lateral)
status: experimental
group: Patterns
description: 'Ícone do carrinho na barra multidomínio e gaveta lateral com os itens. Usa o offcanvas do Bootstrap, sem JavaScript próprio. Recebe só dados neutros do Portal (contagem, itens, total e URL do carrinho no MAIN).'
props:
  type: object
  properties:
    count:
      type: integer
      description: 'Quantidade de itens no carrinho.'
      default: 0
      minimum: 0
    empty:
      type: boolean
      description: 'Carrinho vazio.'
      default: true
    url:
      type: string
      description: 'URL absoluta do carrinho no MAIN.'
      default: ''
    total:
      type: string
      description: 'Total formatado (ex.: R$ 30,00).'
      default: ''
    items:
      type: array
      description: 'Itens do carrinho: title, quantity e total (texto).'
      default: []
    banner:
      type: string
      description: 'Frase fixa do rodapé da gaveta.'
      default: 'Compre na loja e apoie a luta antiproibicionista!'
slots: {}
assets:
  css:
    component:
      cart-offcanvas.css: {}
