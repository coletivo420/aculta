$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Content grid
status: experimental
group: Patterns
description: 'Responsive grid for mixed rendered items such as content, taxonomy terms and external links. Each item keeps its own markup.'
props:
  type: object
  properties:
    columns:
      type: integer
      description: 'Number of columns.'
      enum: [2, 3]
      default: 2
slots:
  items:
    title: Items
    description: 'Any rendered item, including a content card, taxonomy term or external link, wrapped by its caller.'
assets:
  css:
    component:
      content-grid.css: {}
