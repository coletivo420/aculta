$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Content section
status: experimental
group: Patterns
description: 'Editorial section frame: optional bar title, optional sub-heading and renderable body. The body keeps rich content as it was.'
props:
  type: object
  properties:
    title:
      type: ["string", "null"]
      description: 'Section bar title (h2).'
      default: null
    heading:
      type: ["string", "null"]
      description: 'Sub-heading (h3) under the bar title.'
      default: null
    variant:
      type: string
      description: 'Visual variant. Maps to the legacy modifier classes.'
      enum: [default, city, transparency]
      default: default
slots:
  body:
    title: Body
    description: 'Rich content of the section, already rendered.'
