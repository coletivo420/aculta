aculta_fluent_emoji:
  enabled: true
  label: "Fluent Emoji"
  description: "Emojis vetoriais Fluent coloridos do catálogo editorial ACULTA."
  version: "1.0.0"
  license:
    name: MIT
    url: https://github.com/microsoft/fluentui-emoji/blob/main/LICENSE
    gpl-compatible: true
  extractor: svg
  config:
    sources:
      - assets/icons/fluent-emoji/color/*.svg
  settings:
    size:
      title: "Tamanho"
      type: "integer"
      default: 24
    class:
      title: "Classes"
      type: "string"
      default: ""
  template: >
    <svg
      {{ attributes
          .setAttribute('viewBox', attributes.viewBox|default('0 0 32 32'))
          .setAttribute('class', ('aculta-emoji ' ~ class)|trim)
          .setAttribute('width', size|default('24'))
          .setAttribute('height', size|default('24'))
          .setAttribute('aria-hidden', 'true')
