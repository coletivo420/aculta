aculta_phosphor_regular:
  enabled: true
  label: "Phosphor Regular"
  description: "Ícones vetoriais Phosphor na variante regular do tema ACULTA420 V2."
  version: "2.1.0"
  license:
    name: MIT
    url: https://github.com/phosphor-icons/core/blob/main/LICENSE
    gpl-compatible: true
  extractor: svg
  config:
    sources:
      - assets/icons/phosphor/regular/*.svg
  settings:
    size:
      title: "Tamanho"
      type: "integer"
      default: 20
    class:
      title: "Classes"
      type: "string"
      default: ""
  template: >
    <svg
      {{ attributes
          .setAttribute('viewBox', attributes.viewBox|default('0 0 256 256'))
          .setAttribute('class', ('aculta-icon aculta-icon--regular ' ~ class)|trim)
          .setAttribute('width', size|default('20'))
          .setAttribute('height', size|default('20'))
          .setAttribute('fill', 'currentColor')
          .setAttribute('aria-hidden', 'true')
      }}
    >
      {{ content }}
    </svg>

