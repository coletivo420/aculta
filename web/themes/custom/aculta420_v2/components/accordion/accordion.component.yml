$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Acordeão
description: Resposta expansível com controles HTML nativos e sem JavaScript.
status: experimental
group: Conteúdo
props:
  type: object
  additionalProperties: false
  properties:
    title:
      type: string
      minLength: 1
