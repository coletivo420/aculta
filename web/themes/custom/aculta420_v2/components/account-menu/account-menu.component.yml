$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Menu de conta na barra institucional
description: Menu de conta fixo na barra institucional. Visitante vê os links de acesso; usuário autenticado vê um disclosure com avatar e as ações de conta (ADR-047).
group: ACULTA
status: experimental
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
props:
  type: object
  additionalProperties: false
  required: [authenticated]
  properties:
    authenticated:
      type: boolean
      title: Usuário autenticado
      default: false
    summary_label:
      type: string
      title: Rótulo acessível
      description: Nome acessível do botão; fica visualmente oculto.
      default: Abrir menu de conta
    account_name:
      type: [string, 'null']
      title: Nome de exibição
      description: Nome entregue pelo Portal, mostrado somente no bloco de sessão autenticada.
      default: null
    sites:
      type: array
      title: Sites por purpose
      description: Links neutros entregues pelo Portal para sites publicados.
      default: []
      items:
        type: object
        additionalProperties: false
        required: [purpose, title, url, current]
        properties:
          purpose:
            type: string
            minLength: 1
          title:
            type: string
            minLength: 1
          url:
            type: string
            format: uri
          current:
            type: boolean
slots:
  avatar:
    title: Avatar
    description: Avatar fornecido pelo Portal (AvatarResolver). Sem slot, o componente usa o ícone neutro. Nunca gera inicial do nome.
  menu_items:
    title: Itens do menu
    description: Render array do menu Drupal de conta (system_menu_block:account), com access e cache preservados pelo Portal.
