$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Shell da Conta
status: experimental
description: Estrutura da área da Conta com menu, acordeão de seções e conteúdo, preservando os atributos de comportamento do Portal.
group: Conta
props:
  type: object
  additionalProperties: false
  required: [title]
  properties:
    title:
      title: Título da página da conta
      type: string
      minLength: 1
    section_title:
      title: Título da seção da conta
      type: string
      default: ''
    menu_items:
      title: Itens de navegação da conta
      type: array
      default: []
      items:
        type: object
        additionalProperties: false
        required: [label, href]
        properties:
          label:
            type: string
          href:
            type: string
          active:
            type: boolean
            default: false
    accordion_items:
      title: Seções expansíveis da conta
      type: array
      default: []
      items:
        type: object
        additionalProperties: false
        required: [label, href]
        properties:
          label:
            type: string
          href:
            type: string
          open:
            type: boolean
            default: false
    logout:
      title: Ação para sair da conta
      type: object
      additionalProperties: false
      required: [label, href]
      properties:
        label:
          type: string
        href:
          type: string
slots:
  content:
    title: Conteúdo da seção
    description: Conteúdo principal fornecido pelo módulo da área da conta.
assets:
  css:
    component:
      account-shell.css: {}
