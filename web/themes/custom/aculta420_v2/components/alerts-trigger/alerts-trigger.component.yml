$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Avisos no shell institucional
status: stable
description: Gatilho com contagem e painel de avisos carregado sob demanda.
group: Shell institucional
libraryOverrides:
  dependencies:
    - aculta420_v2/utility-drawers
props:
  type: object
  additionalProperties: false
  required: [href]
  properties:
    href:
      type: string
      format: uri-reference
      title: Endereço da central de alertas
    all_href:
      type: string
      default: ''
      title: Endereço de todos os alertas
    count:
      type: integer
      minimum: 0
      default: 0
      title: Quantidade de alertas
    count_kind:
      type: string
      title: Tipo de contagem dos alertas
      enum: [active, attention]
      default: active
