$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Avisos no shell institucional
description: Gatilho com contagem e painel de avisos carregado sob demanda.
group: ACULTA
libraryOverrides:
  dependencies:
    - aculta420_v2/utility-drawers
props:
  type: object
  additionalProperties: false
  required: [href]
  properties:
    href: { type: string, format: uri-reference }
    all_href: { type: string, default: '' }
    count: { type: integer, minimum: 0, default: 0 }
    count_kind:
      type: string
      enum: [active, attention]
      default: active
