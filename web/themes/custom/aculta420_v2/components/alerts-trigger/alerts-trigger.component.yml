$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Avisos no shell institucional
status: stable
description: Gatilho com contagem e painel de avisos carregado sob demanda.
group: Shell institucional
libraryOverrides:
  dependencies:
    - aculta420_v2/utility-drawers
props:
  type: object
  additionalProperties: false
  required: [href]
  properties:
    href:
      type: string
      format: uri-reference
      title: Endereço da central de alertas
      description: URL carregada sob demanda no conteúdo do drawer de avisos.
    all_href:
      type: string
      default: ''
      title: Endereço de todos os alertas
      description: Quando informado, aparece no rodapé como link para a central completa.
    count:
      type: integer
      minimum: 0
      default: 0
      title: Quantidade de alertas
      description: Quantidade anunciada no nome acessível e mostrada no indicador visual, limitado a 99+.
    count_kind:
      type: string
      title: Tipo de contagem dos alertas
      description: Escolhe o texto acessível para contar avisos ativos ou ativos/não lidos.
      enum: [active, attention]
      default: active
