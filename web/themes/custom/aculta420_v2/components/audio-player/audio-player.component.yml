$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Audio player
status: stable
description: Player leve com controles nativos de áudio acessíveis.
group: Elementos básicos
props:
  type: object
  additionalProperties: false
  required: [src, title]
  properties:
    src:
      title: Endereço do arquivo de áudio
      type: string
      format: uri-reference
    title:
      title: Título do áudio
      type: string
      minLength: 1
    artist:
      title: Artista ou autoria
      type: [string, 'null']
