name: Avatar com mídia
description: "Avatar do sistema ACULTA com mídia real do Avatar Pool (aculta_user). A função aculta_avatar_sample() usa o AvatarResolver para obter um avatar do acervo, o mesmo que o site mostra para contas sem foto própria; o componente só apresenta a mídia recebida no slot media, com texto alternativo explícito."
component: aculta420_v2:avatar
props:
  size: lg
slots:
  media:
    type: inline_template
    template: '{{ render_var(aculta_avatar_sample("Avatar de exemplo do Avatar Pool")) }}'
