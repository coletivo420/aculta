$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Breadcrumb
variants:
  padrao:
    title: Padrão
  contextual:
    title: Contextual
description: Trilha de navegação por sessão, com ícone da seção e página atual sem link.
status: stable
group: Navegação
props:
  type: object
  additionalProperties: false
  properties:
    label:
      type: string
      title: Nome acessível da navegação
      description: Nome acessível aplicado ao elemento nav.
      minLength: 1
      default: Navegação estrutural
    inicio_url:
      type: string
      title: Endereço do início
      description: Página inicial do domínio principal, usada no primeiro nível da trilha.
      default: /
    sessao:
      type: string
      title: Sessão do portal
      description: Define o ícone do primeiro nível da trilha quando o item não informa um ícone próprio.
      enum: [portal, revista, forum, wiki, ganjalab, green_stash, culturas]
      default: portal
    variant:
      type: string
      title: Superfície
      description: Apresentação visual padrão ou contextual da trilha.
      enum: [padrao, contextual]
      default: padrao
    trail:
      type: array
      title: Níveis da trilha
      description: Níveis acima da página atual, sem o início, que o componente já mostra.
      items:
        type: object
        description: Link de uma seção anterior à página atual na trilha de navegação.
        additionalProperties: false
        required: [label, url]
        properties:
          label:
            type: string
            title: Texto do link
            description: Nome visível do nível da trilha.
            minLength: 1
          url:
            type: string
            title: Endereço
            description: Destino do link para este nível da trilha.
            minLength: 1
          icon:
            type: string
            title: Ícone Phosphor opcional
            description: Nome opcional do ícone exibido ao lado do nível; no primeiro nível, substitui o ícone definido pela sessão.
            pattern: '^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$'
    current:
      type: string
      title: Página atual
      description: Texto do último nível, sem link.
