$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Button
status: stable
description: Controle de ação ou link com estados acessíveis.
group: Botões
props:
  type: object
  additionalProperties: false
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: Atributos HTML opcionais
      default: null
    text:
      type: string
      title: Texto visível. Opcional quando houver aria_label (botão só com ícone).
    aria_label:
      type: string
      minLength: 1
      title: Nome acessível. Obrigatório quando text não existir.
    url:
      title: Endereço de destino
      type: [string, 'null']
      format: uri-reference
    variant:
      title: Estilo do botão
      type: string
      enum: [primary, secondary, outline, ghost, danger]
      default: primary
    size:
      type: string
      title: Tamanho (só altera espaçamento e fonte; alvo de toque mínimo de 44 px)
      enum: [default, small]
      default: default
    is_submit:
      title: Enviar formulário ao ativar
      type: boolean
      default: false
    disabled:
      title: Desativar o botão
      type: boolean
      default: false
    icon_before:
      type: [string, 'null']
      title: Ícone anterior ao texto
      pattern: '^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$'
      default: null
    icon_after:
      type: [string, 'null']
      title: Ícone posterior ao texto
      pattern: '^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$'
      default: null
    leading_icon:
      title: Ícone anterior estruturado (UI Icons)
      $ref: 'ui-patterns://icon'
    trailing_icon:
      title: Ícone posterior estruturado (UI Icons)
      $ref: 'ui-patterns://icon'
