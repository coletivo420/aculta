$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Button
status: stable
description: Controle de ação ou link com estados acessíveis.
group: ACULTA
props:
  type: object
  additionalProperties: false
  required: [text]
  properties:
    text:
      type: string
      minLength: 1
    url:
      type: [string, 'null']
      format: uri-reference
    variant:
      type: string
      enum: [primary, secondary, outline, ghost, danger]
      default: primary
    size:
      type: string
      title: Tamanho (só altera espaçamento e fonte; alvo de toque mínimo de 44 px)
      enum: [default, small]
      default: default
    is_submit:
      type: boolean
      default: false
    disabled:
      type: boolean
      default: false
    icon_before:
      type: [string, 'null']
      title: Ícone anterior ao texto
      pattern: '^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$'
      default: null
    icon_after:
      type: [string, 'null']
      title: Ícone posterior ao texto
      pattern: '^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$'
      default: null
