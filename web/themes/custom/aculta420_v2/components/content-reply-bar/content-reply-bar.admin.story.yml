name: Barra com controles administrativos e exclusão (clicáveis)
description: Barra de ações do comentário. O ícone de controles abre o popup de moderação; o ícone de excluir abre a confirmação. Ambos abrem ao clicar.
props:
  permalink_url: /comment/1
  admin_url: /discussoes/1/controles
  admin_author_name: Participante
  admin_with_dialog: true
  delete_target: delete-demo
slots:
  admin_dialog:
    '#type': component
    '#component': aculta420_v2:comment-admin-controls
    '#props':
      author_name: Participante
      state_label: Publicado
      created_label: 14/11/2026
      reactions_total: 1
      reply_count: 0
  delete_dialog:
    '#type': component
    '#component': aculta420_v2:delete-confirm
    '#props':
      target_id: delete-demo
      title: Excluir resposta?
      message: Confirma a exclusão?
      confirm_label: Excluir
      cancel_label: Cancelar
      token: ''
      confirm_url: '#'
