name: Janela de troca de avatar
description: Modal para escolha, sorteio no acervo ou envio de foto de perfil.
component: aculta420_v2:dialog
props:
  id: aculta-dialog-avatar-example
  title: Foto do perfil
  trigger_label: Alterar foto do perfil
  trigger_url: /avatar/foto
  close_label: Fechar alteração de foto
  variant: default
slots:
  content:
    type: inline_template
    template: |
      <div data-portal-ui="account-photo-preview" style="text-align: center; margin-bottom: 1rem;">
        <span data-aculta-user-avatar class="aculta-avatar aculta-avatar--xl">
          <span class="aculta-avatar__media">
            <img data-portal-ui="account-avatar" src="/themes/custom/aculta420_v2/assets/avatars/pirates-002-polvo-pirata.png" alt="Foto de perfil" class="portal-account__avatar" width="128" height="128">
          </span>
        </span>
      </div>
      <p style="margin-bottom: 1rem;">Escolha uma imagem e ajuste o enquadramento antes de salvar.</p>
      <div class="form-item form-type-managed-file" style="margin-bottom: 1rem;">
        <label for="imagem-upload" style="display: block; font-weight: 600; margin-bottom: 0.25rem;">Foto</label>
        <input type="file" id="imagem-upload" class="form-file">
        <div class="description" style="font-size: 0.85rem; color: var(--color-text-secondary); margin-top: 0.25rem;">
          Envie uma imagem PNG, JPG, GIF ou WebP de até 10 MB.
        </div>
      </div>
  actions:
    type: inline_template
    template: |
      <button class="button button--secondary" type="button">Sortear novo avatar</button>
      <button class="button button--primary" type="button">Salvar foto do perfil</button>
