$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Comentário de discussão
description: Apresenta autoria pública, data, conteúdo e links de um comentário Drupal.
status: experimental
group: Comunidade
props:
  type: object
  additionalProperties: false
  required: [has_author, has_submitted]
  properties:
    has_author:
      type: boolean
      title: Autoria disponível
    has_submitted:
      type: boolean
      title: Data de publicação disponível
slots:
  author:
    title: Autoria
    description: Render array de autoria preparado pelo Portal.
  submitted:
    title: Data de publicação
  body:
    title: Conteúdo do comentário
    description: Conteúdo e campos autorizados do comentário.
  footer:
    title: Links de operação
    description: Permalink e ações renderizados e autorizados pelo Drupal.
