$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Opção de reação
description: Formulário de fallback e HTMX para escolher uma reação permitida.
status: stable
group: Comunidade
props:
  type: object
  additionalProperties: false
  required: [reaction_id, name, icon, target_id, react_url, csrf_token]
  properties:
    reaction_id:
      type: string
      title: Identificador da reação
      description: Chave validada pelo catálogo configurado no módulo Fórum.
    name:
      type: string
      title: Nome da reação
      description: Nome acessível e texto de busca da reação.
    icon:
      type: string
      title: Identificador do emoji
      description: Ícone do pack de reações usado pelo SDC reaction-emoji.
      pattern: '^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$'
    keywords:
      type: string
      title: Palavras de busca
      description: Termos separados por espaço usados pelo filtro local do seletor.
      default: ''
    target_id:
      type: string
      title: ID do alvo HTMX
      description: Barra de reação que será atualizada após a submissão.
    react_url:
      type: string
      title: Endpoint de reação
      description: URL do endpoint cuja autorização é verificada pelo módulo Fórum.
    csrf_token:
      type: string
      title: Token CSRF
      description: Token de uso da sessão para validar a submissão da reação.
    selected:
      type: boolean
      title: Reação atual
      description: Quando true, marca a opção que já está selecionada pelo usuário.
      default: false
