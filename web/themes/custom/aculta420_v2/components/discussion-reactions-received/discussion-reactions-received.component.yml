$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Barra de Reações Recebidas
description: Reações recebidas por uma publicação, somente leitura, com contador. Até duas aparecem na barra; as demais ficam num popover aberto pelo "+".
status: stable
group: Comunidade
props:
  type: object
  additionalProperties: false
  required: [target_id, reactions]
  properties:
    target_id:
      type: string
      title: ID do elemento
      minLength: 1
      description: Identificador da barra interativa associada; o componente acrescenta o sufixo -received ao seu próprio ID DOM.
    reactions:
      type: object
      title: Mapa de reações recebidas com contagem
      default: {}
      description: Mapa indexado pelo identificador da reação, com a contagem recebida por cada opção ativa.
    allowed_reactions:
      type: object
      title: Catálogo de reações permitidas (rótulo e ícone)
      default: {}
      description: Metadados de ícone e rótulo por identificador; quando uma entrada não existe, a chave da reação é usada como fallback.
