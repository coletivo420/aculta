$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Compositor de Criação de Tópico
status: stable
description: Popup do botão Criar, no mesmo padrão do popup de resposta da discussão. Abre um diálogo com o formulário de criação de tópico (Assunto antes do Comentário).
group: Comunidade
props:
  type: object
  additionalProperties: false
  required: [id]
  properties:
    id:
      type: string
      title: Identificador do diálogo
      minLength: 1
      default: aculta-topic-create-dialog
    trigger_label:
      type: string
      title: Texto do botão que abre o popup
      default: Criar tópico
    title:
      type: string
      title: Título do popup
      default: Criar tópico
slots:
  form:
    title: Formulário de criação de tópico
    description: Render array do formulário do nó aculta_forum_topic (Assunto, Comentário, Categoria).
