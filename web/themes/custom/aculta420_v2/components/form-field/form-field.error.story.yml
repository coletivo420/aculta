name: Campo inválido
description: Erro textual ligado ao controle e apresentado junto ao campo.
component: aculta420_v2:form-field
props:
  id: email
  invalid: true
slots:
  label:
    type: html_tag
    tag: label
    attributes:
      for: email-control
    value: E-mail
  control:
    type: html_tag
    tag: input
    attributes:
      id: email-control
      name: email
      type: email
      aria-invalid: 'true'
      aria-describedby: email-description email-error
  description: Informe um endereço de e-mail válido.
  error: Revise o endereço informado.
