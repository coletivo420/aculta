$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Responsável atribuído ao tópico
description: Estado somente leitura de atribuição Discourse; nome e permissões vêm do serviço owner.
status: experimental
group: Comunidade
props:
  type: object
  additionalProperties: false
  required: [title, assigned, status_label]
  properties:
    title:
      type: string
      title: Título da área
      minLength: 1
    assigned:
      type: boolean
      title: Existe pessoa responsável autorizada
    status_label:
      type: string
      title: Estado da atribuição
      minLength: 1
    assignee_label:
      type: [string, 'null']
      title: Nome público autorizado
      default: null
    description:
      type: [string, 'null']
      title: Contexto adicional
      default: null
slots:
  actions:
    title: Ações de atribuição
    description: Somente comandos reais e autorizados fornecidos pelo owner, jamais criados no Twig.
assets:
  css:
    component:
      forum-assignment-state.css: {}
