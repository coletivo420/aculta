  tips:
    - Escolha a categoria mais adequada para sua dúvida ou relato.
    - Seja específico no título, evitando termos genéricos como "Ajuda urgente".
    - Descreva setup, iluminação, substrato e regas para facilitar o diagnóstico.
  community_rules:
