$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Página da lista do Fórum
description: Casca visual da View pública de tópicos, categorias e painel lateral.
status: stable
group: Comunidade
props:
  type: object
  additionalProperties: false
slots:
  header:
    title: Cabeçalho
    description: Título, descrição e ação principal da comunidade.
  categories:
    title: Categorias
    description: Links de categoria e contagens preparados pelo tema.
  search:
    title: Busca
    description: Campo ou formulário de busca da lista.
  navigation:
    title: Navegação
    description: Abas de ordenação da lista de tópicos.
  shortcuts:
    title: Atalhos
    description: Ações secundárias disponíveis na lista.
  topics:
    title: Tópicos
    description: Linhas de tópicos renderizadas pela View.
  empty:
    title: Estado vazio
    description: Mensagem exibida quando a View não retorna tópicos.
  pager:
    title: Paginação
    description: Paginação renderizada pela View.
  sidebar:
    title: Painel lateral
    description: Estatísticas, regras e conteúdo complementar da comunidade.
assets:
  css:
    component:
      forum-list-page.css: {}
