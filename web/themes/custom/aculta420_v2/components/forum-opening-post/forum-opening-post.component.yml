$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Postagem de abertura do tópico
description: Primeiro post do tópico, no mesmo cartão dos comentários, com o destaque do tópico fixado.
status: stable
group: Cartões de Post do Fórum
props:
  type: object
  additionalProperties: false
  required: [author_name]
  properties:
    author_name:
      type: string
      title: Nome do autor
      minLength: 1
    author_posts:
      type: [string, integer, 'null']
      title: Contagem de posts do autor
      default: null
    author_reactions:
      type: [string, integer, 'null']
      title: Contagem de reações recebidas pelo autor
      default: null
    timestamp:
      type: [string, 'null']
      title: Data de publicação formatada
      default: null
    permalink_url:
      type: [string, 'null']
      title: Link permanente do tópico
      default: null
    delete_url:
      type: [string, 'null']
      title: Link de exclusão do tópico (somente com acesso)
      default: null
    edit_url:
      type: [string, 'null']
      title: Link de edição (somente com acesso)
      default: null
    quote_url:
      type: [string, 'null']
      title: Link de citar abertura (somente com acesso)
      default: null
    reply_url:
      type: [string, 'null']
      title: Endereço do compositor de resposta ao tópico
      default: null
    link_icon:
      type: [string, 'null']
      title: Ícone do link permanente (markup SVG)
      default: null
    delete_icon:
      type: [string, 'null']
      title: Ícone de excluir (markup SVG)
      default: null
    edit_icon:
      type: [string, 'null']
      title: Ícone de editar (markup SVG)
      default: null
    quote_icon:
      type: [string, 'null']
      title: Ícone de citar (markup SVG)
      default: null
    reply_icon:
      type: [string, 'null']
      title: Ícone de responder (markup SVG)
      default: null
slots:
  avatar:
    title: Avatar ou cartão de autor
    description: Avatar ou bloco de autoria do criador do tópico.
  body:
    title: Corpo da postagem
    description: Corpo do tópico renderizado pelo Drupal.
  reactions_slot:
    title: Barra de reações interativas
    description: Barra de reações por emojis renderizada pelo aculta_forum.
