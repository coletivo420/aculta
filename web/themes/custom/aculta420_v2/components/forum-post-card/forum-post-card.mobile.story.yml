name: Cartão de Post do Fórum (mobile)
props:
  stripe: brand
  author_name: PiradoPirata
  author_posts: 342
  timestamp: Há 3 horas
  density: compact
slots:
  reactions_received:
    type: inline_template
    template: '{{ include("aculta420_v2:discussion-reactions-received", { target_id: "reactions-story", reactions: { thumbs_up: { id: "thumbs_up", count: 12 }, seedling: { id: "seedling", count: 7 } } }, with_context = false) }}'
  avatar:
    type: inline_template
    template: '{{ render_var(aculta_avatar_sample("PiradoPirata")) }}'
  body:
    '#markup': <p>Excelente tutorial! Para solos orgânicos vivos (no-till), recomendo também monitorar a umidade com tensiômetro nas primeiras semanas para evitar compactação.</p>
  actions:
    '#type': component
    '#component': aculta420_v2:content-reply-bar
    '#props':
      permalink_url: /forum/topico/123#post-456
      edit_url: /discussoes/editar/comment/456
      quote_url: /discussoes/citar/comment/456
      reply_url: /discussoes/responder/comment/456
      delete_url: /discussoes/apagar/comment/456
      target_id: aculta-reply-dialog-body
  reactions_slot:
    '#type': component
    '#component': aculta420_v2:discussion-reaction-bar
    '#props':
      target_id: discussion-reactions-comment-story
      entity_type: comment
      entity_id: '1'
      user_reaction: thumbs_up
      default_reaction: broccoli
      can_react: true
      react_url: '#'
      csrf_token: story-token
      reactions:
        thumbs_up:
          id: thumbs_up
          count: 12
          user_reacted: true
        seedling:
          id: seedling
          count: 7
