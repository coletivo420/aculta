$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Citação (quote)
description: Citação de uma publicação do fórum, com aspas em destaque, faixa verde à esquerda e vermelha à direita, e ações (link, reação e responder).
status: stable
group: Comunidade
props:
  type: object
  additionalProperties: false
  properties:
    theme:
      type: string
      title: Tema
      enum: [light, dark]
      default: light
      description: "dark aplica os tokens de modo escuro somente a este cartão."
    density:
      type: string
      title: Densidade
      enum: [default, compact]
      default: default
      description: "compact: versão para celular (menos espaçamento, estatísticas em grade)."
    accent_side:
      type: string
      title: Lado da faixa de acento
      enum: [start, end]
      default: start
      description: "start: padrão, faixa à esquerda. end: espelhado, faixa do lado oposto."
    author_name:
      type: [string, 'null']
      title: Autor citado
      description: Nome do autor original mostrado na identificação da citação.
    timestamp:
      type: [string, 'null']
      title: Data da postagem original
      description: Data já formatada da publicação citada, mostrada ao lado do autor.
      default: null
      default: null
    avatar:
      type: [string, 'null']
      title: Mídia do avatar do autor citado (markup da imagem)
      description: Somente markup de imagem confiável e já renderizado; o componente não sanitiza o valor. Vazio usa o avatar com iniciais.
      default: null
    permalink_url:
      type: [string, 'null']
      title: Link para a publicação citada
      description: Destino público do permalink da mensagem original.
      default: null
    edit_url:
      type: [string, 'null']
      title: URL para editar
      description: Destino de edição fornecido pelo chamador depois de decidir se deve oferecer a ação.
      default: null
    delete_url:
      type: [string, 'null']
      title: URL para excluir
      description: Destino de exclusão ou solicitação fornecido pelo chamador depois de aplicar a política.
      default: null
    quote_url:
      type: [string, 'null']
      title: URL para citar
      description: Destino da ação de citação fornecido pelo chamador quando aplicável.
      default: null
    reply_url:
      type: [string, 'null']
      title: URL para responder
      description: Destino do fluxo de resposta fornecido pelo chamador quando aplicável.
      default: null
slots:
  avatar_media:
    title: Mídia do avatar do autor citado
    description: Render array do sistema de avatar do ACULTA (AvatarResolver/Avatar Pool); sem mídia, a forma fica vazia.
  content:
    title: Conteúdo
    description: Texto citado.
  reactions_slot:
    title: Barra de reações
    description: aculta420_v2:discussion-reaction-bar, fornecida pelo módulo proprietário.
