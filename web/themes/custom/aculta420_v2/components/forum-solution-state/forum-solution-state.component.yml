$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Estado de solução do tópico
description: Exibe solução marcada ou pendente. O estado e as ações são fornecidos pelo owner, sem inventar comandos.
status: experimental
group: Comunidade
props:
  type: object
  additionalProperties: false
  required: [title, solved, status_label]
  properties:
    title:
      type: string
      title: Nome da região
      minLength: 1
    solved:
      type: boolean
      title: Solução confirmada no backend
    status_label:
      type: string
      title: Rótulo acessível do estado
      minLength: 1
    description:
      type: [string, 'null']
      title: Informação contextual
      default: null
slots:
  excerpt:
    title: Trecho da resposta aceita
    description: Trecho autorizado e sanitizado pelo owner, somente quando solved for true.
  actions:
    title: Ações autorizadas
    description: Links e formulários reais montados pelo owner. Story não executa alteração de status.
assets:
  css:
    component:
      forum-solution-state.css: {}
