$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Bloco de interação (meta do tópico)
description: Cabeçalho do tópico com título, status e indicadores (posts, participantes, visualizações e última atividade), com faixa tricolor e faixa verde à esquerda.
status: stable
group: Comunidade
props:
  type: object
  additionalProperties: false
  required: [title]
  properties:
    theme:
      type: string
      title: Tema
      enum: [light, dark]
      default: light
      description: "dark aplica os tokens de modo escuro somente a este cartão."
    density:
      type: string
      title: Densidade
      enum: [default, compact]
      default: default
      description: "compact: versão para celular (menos espaçamento, estatísticas em grade)."
    title:
      type: string
      title: Título do tópico
      description: Título principal do tópico, anunciado como heading nível dois.
      minLength: 1
    status:
      type: string
      title: Status do tópico
      description: Estado que determina o rótulo e o estilo de aberto ou fechado.
      enum: [open, closed]
      default: open
    posts:
      type: [integer, 'null']
      title: Quantidade de posts
      description: Total de postagens; null omite o indicador correspondente.
      default: null
    participants:
      type: [integer, 'null']
      title: Quantidade de participantes
      description: Total de participantes; null omite o indicador correspondente.
      default: null
    views:
      type: [integer, 'null']
      title: Visualizações
      description: Total de visualizações; null omite o indicador correspondente.
      default: null
    last_activity:
      type: [string, 'null']
      title: Última atividade
      description: Data ou tempo relativo formatado; valor vazio omite o indicador.
      default: null
