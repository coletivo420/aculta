$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Hero banner
status: stable
description: Abertura de página com mídia opcional e chamada de ação.
group: Páginas e vitrines
props:
  type: object
  additionalProperties: false
  required: [title]
  properties:
    title:
      type: string
      minLength: 1
    tagline:
      type: [string, 'null']
    cta_text:
      type: [string, 'null']
    cta_url:
      type: [string, 'null']
      format: uri-reference
slots:
  background_media:
    title: Mídia de fundo
    description: Imagem ou vídeo decorativo, com texto alternativo tratado no campo de mídia.
