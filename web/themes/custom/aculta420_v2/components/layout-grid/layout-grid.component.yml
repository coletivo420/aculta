$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Grade responsiva
description: Grade automática que distribui os itens conforme a largura disponível, sem rolagem horizontal.
status: experimental
group: Layouts
props:
  type: object
  additionalProperties: false
  properties:
    preset:
      type: string
      enum: [custom, cards-compact, cards-standard, cards-wide]
      default: custom
      title: Predefinição de cartões
      description: Define a largura mínima dos cartões; custom mantém min_item_width e max_columns.
    min_item_width:
      type: string
      enum: [12rem, 16rem, 20rem]
      default: 16rem
      title: Largura mínima do item
      description: Define quando a grade passa de uma para mais colunas.
    max_columns:
      type: integer
      enum: [0, 2, 3, 4]
      default: 0
      title: Máximo de colunas
      description: Limita o número de colunas; zero mantém o ajuste automático sem limite.
slots:
  content:
    title: Itens da grade
    description: Lista de cartões ou blocos da grade.
assets:
  css:
    component:
      layout-grid.css: {}
