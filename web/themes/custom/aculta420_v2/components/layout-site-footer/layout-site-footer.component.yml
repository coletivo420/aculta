$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Layout do rodapé
description: Layout do Layout Builder para o rodapé institucional. Monta o SDC site-footer com identidade, navegação, conteúdo e linha legal.
status: experimental
group: Layouts
props:
  type: object
  additionalProperties: false
  properties: {}
slots:
  brand:
    title: Identidade
    description: Nome da associação exibido na linha superior.
  nav:
    title: Navegação
    description: Links institucionais na linha superior.
  content:
    title: Conteúdo do rodapé
    description: Blocos de colunas do rodapé, abaixo do divisor.
  legal:
    title: Linha legal
    description: Cópia, licença e avisos da linha inferior.
