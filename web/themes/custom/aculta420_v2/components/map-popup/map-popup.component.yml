$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Map popup
status: stable
description: Cartão compacto para informação associada a um marcador de mapa.
group: Mapas
props:
  type: object
  additionalProperties: false
  required: [title]
  properties:
    title:
      title: Título do ponto no mapa
      type: string
      minLength: 1
    url:
      title: Endereço da página do ponto
      type: [string, 'null']
      format: uri-reference
    category:
      title: Categoria do ponto
      type: [string, 'null']
    address:
      title: Endereço ou localização
      type: [string, 'null']
    route_url:
      title: Endereço para traçar rota
      type: [string, 'null']
      format: uri-reference
slots:
  thumbnail:
    title: Miniatura
    description: Imagem opcional do local ou evento.
