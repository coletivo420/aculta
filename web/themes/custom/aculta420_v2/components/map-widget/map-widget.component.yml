$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Mapa Interativo
description: Container do mapa com Leaflet/OpenStreetMap, marcadores e templates de popup e ícones.
group: Mapas
status: experimental
libraryOverrides:
  dependencies:
    - aculta_maps/map
props:
  type: object
  additionalProperties: false
  required: [map_id]
  properties:
    map_id:
      title: Identificador HTML do mapa
      type: string
      minLength: 1
    label:
      title: Nome acessível do mapa
      type: string
      default: Mapa interativo
    privacy_notice_url:
      title: Endereço da política de privacidade
      type: [string, 'null']
      format: uri-reference
    privacy_notice_text:
      title: Texto do aviso de privacidade
      type: string
      default: Política de privacidade
slots:
  templates:
    title: Templates de marcadores e popups
    description: Elementos <template> que o Leaflet usa para clonar popups e marcadores dinâmicos.
  fallback_list:
    title: Lista alternativa acessível
    description: Conteúdo textual de apoio para usuários sem JavaScript ou com leitores de tela.
assets:
  css:
    component:
      map-widget.css: {}
