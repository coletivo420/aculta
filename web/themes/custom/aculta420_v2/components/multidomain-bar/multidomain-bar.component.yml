$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Multidomain institutional bar
status: stable
description: Faixa institucional ACULTA fixa com logotipo e utilidades legadas.
group: Navegação
libraryOverrides:
  dependencies:
    - core/drupal
    - core/drupal.htmx
    - core/drupalSettings
    - core/once
    - aculta420_v2/utility-drawers
    - aculta_portal/search-preview
props:
  type: object
  additionalProperties: false
  required: [brand_home_url, logo_base_url]
  properties:
    brand_home_url:
      title: Endereço inicial da marca
      type: string
      minLength: 1
      format: uri-reference
    logo_base_url:
      title: Endereço base dos logotipos
      type: string
      minLength: 1
      format: uri-reference
    logo_alt:
      title: Texto alternativo do logotipo
      type: string
      minLength: 1
      default: ACULTA
    is_account_domain:
      title: Exibir no domínio da conta
      type: boolean
      default: false
    show_utility_bar:
      title: Exibir barra de utilidades
      type: boolean
      default: true
    cart_url:
      title: Endereço do carrinho
      type: [string, 'null']
      format: uri-reference
      default: null
    cart_count:
      title: Quantidade de itens no carrinho
      type: integer
      minimum: 0
      default: 0
    cart_empty:
      title: Carrinho sem itens
      type: boolean
      default: true
    cart_total:
      title: Valor total do carrinho
      type: string
      default: ''
    cart_sites:
      title: Carrinhos por site
      type: array
      default: []
      items:
        type: object
        additionalProperties: false
        required: [key, label, total, items]
        properties:
          key: { type: string }
          label: { type: string }
          total: { type: string }
          checkout_url: { type: string, default: '' }
          items:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [title, quantity, total]
              properties:
                title: { type: string }
                quantity: { type: string }
                total: { type: string }
    cart_checkout_url:
      title: Endereço para finalizar compra
      type: string
      default: ''
    messages_url:
      title: Endereço da caixa de mensagens
      type: [string, 'null']
      format: uri-reference
      default: null
    messages_count:
      title: Quantidade de mensagens não lidas
      type: integer
      minimum: 0
      default: 0
    messages_all_url:
      title: Endereço de todas as mensagens
      type: string
      default: ''
    alerts_url:
      title: Endereço da central de alertas
      type: [string, 'null']
      format: uri-reference
      default: null
    alerts_count:
      title: Quantidade de alertas
      type: integer
      minimum: 0
      default: 0
    alerts_count_kind:
      title: Tipo de contagem dos alertas
      type: string
      enum: [active, attention]
      default: active
    alerts_all_url:
      title: Endereço de todos os alertas
      type: string
      default: ''
slots:
  search:
    title: Pesquisa
    description: Gatilho de busca do ACULTA Portal, como render array.
  portal_menu:
    title: Ações de conta
    description: Componente aculta420_v2:account-menu (SDC) com o gatilho de três linhas, links de login, Minha conta e logout. Faz parte da barra institucional.
