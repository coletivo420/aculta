$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Pagination
description: Navegação acessível entre páginas de resultados.
group: ACULTA
props:
  type: object
  additionalProperties: false
  required: [current_page, links]
  properties:
    current_page:
      type: integer
      minimum: 1
    total_pages:
      type: [integer, 'null']
      minimum: 1
    links:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [url, label]
        properties:
          url: { type: string, format: uri-reference }
          label: { type: string, minLength: 1 }
          is_active: { type: boolean, default: true }
          is_current: { type: boolean, default: false }
