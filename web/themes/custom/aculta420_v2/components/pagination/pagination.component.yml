$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Pagination
status: stable
description: Navegação acessível entre páginas de resultados.
group: Navegação
props:
  type: object
  additionalProperties: false
  required: [current_page, links]
  properties:
    current_page:
      title: Página atual
      type: integer
      minimum: 1
    total_pages:
      title: Total de páginas
      type: [integer, 'null']
      minimum: 1
    links:
      title: Links de navegação entre páginas
      type: array
      items:
        type: object
        additionalProperties: false
        required: [url, label]
        properties:
          url: { type: string, format: uri-reference }
          label: { type: string, minLength: 1 }
          is_active: { type: boolean, default: true }
          is_current: { type: boolean, default: false }
