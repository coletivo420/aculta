$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Aviso de pagamento
description: Aviso contextual dos pagamentos processados pelo Mercado Pago.
status: stable
group: Portal
props:
