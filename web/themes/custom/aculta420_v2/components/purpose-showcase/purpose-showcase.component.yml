$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Vitrine de portais
description: Links de navegação entre os portais ativos da rede ACULTA.
group: ACULTA
props:
  type: object
  additionalProperties: false
  properties:
    heading:
      type: string
      minLength: 1
      default: Ecossistema ACULTA
    links:
      type: array
      default: []
      items:
        type: object
        additionalProperties: false
        required: [title, url]
        properties:
          title:
            type: string
            minLength: 1
          url:
            type: string
            format: uri-reference
