$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Site footer
description: Rodapé global que apresenta os blocos configurados na região footer.
status: experimental
noUi: true
group: ACULTA
props:
  type: object
  additionalProperties: false
  properties:
    variant:
      type: string
      enum: [institutional, social-links]
      default: institutional
      title: Variação do rodapé
      description: Rodapé institucional da região Drupal ou rodapé de canais sociais do Portal.
slots:
  content:
    title: Conteúdo do rodapé
    description: Render array da região footer, preservando acesso e cacheabilidade Drupal.
  brand:
    title: Identidade
    description: Nome da associação exibido na linha superior. Opcional.
  nav:
    title: Navegação
    description: Links institucionais separados por divisores na linha superior. Opcional.
  legal:
    title: Linha legal
    description: Cópia, licença e demais avisos da linha inferior. Opcional.
