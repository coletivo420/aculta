$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Estado vazio de estatísticas
description: Mensagem neutra quando não há coleta ou dados no recorte.
status: experimental
group: Estatísticas
props:
  type: object
  additionalProperties: false
  required: [message]
  properties:
    message:
      title: Mensagem do estado vazio
      type: string
      minLength: 1
      description: Explicação principal exibida quando a coleta ou o recorte não tem dados.
    hint:
      title: Orientação complementar
      type: string
      default: ''
      description: Orientação opcional apresentada abaixo da mensagem principal.
