$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Cartão de indicador
description: Indicador analítico com rótulo, valor, unidade e observação.
status: experimental
group: Estatísticas
props:
  type: object
  additionalProperties: false
  required: [label, value]
  properties:
    label:
      title: Nome da métrica
      type: string
      minLength: 1
    value:
      title: Valor da métrica
      type: string
      minLength: 1
    unit:
      title: Unidade da métrica
      type: string
      default: ''
    hint:
      title: Orientação sobre a métrica
      type: string
      default: ''
    tone:
      title: Tom visual da métrica
      type: string
      enum: [neutral, positive, warning]
      default: neutral
