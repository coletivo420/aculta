$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Moderação
description: Resumo analítico em lista de definição, sem dados pessoais.
status: experimental
group: Estatísticas
assets:
  css: {}
props:
  type: object
  additionalProperties: false
  required: [title, rows]
  properties:
    title:
      title: Título do resumo de moderação
      type: string
      minLength: 1
    note:
      title: Observação do resumo
      type: string
      default: ''
    rows:
      title: Linhas de moderação
      type: array
      items:
        type: object
        additionalProperties: false
        required: [label, value]
        properties:
          label:
            type: string
          value:
            type: string
          description:
            type: string
            default: ''
