$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Filtro de período
description: Formulário GET funcional sem JavaScript para período e métrica.
status: experimental
group: Estatísticas
props:
  type: object
  additionalProperties: false
  required: [action, options, selected, submit_label]
  properties:
    action:
      title: Endereço de envio do filtro
      type: string
      minLength: 1
    label:
      title: Rótulo do filtro de período
      type: string
      default: Período
    options:
      title: Períodos disponíveis
      type: array
      items:
        type: object
        additionalProperties: false
        required: [value, label]
        properties:
          value:
            type: string
          label:
            type: string
    selected:
      title: Período selecionado
      type: string
    submit_label:
      title: Texto do botão de aplicação
      type: string
      minLength: 1
    hidden:
      title: Campos ocultos do formulário
      type: array
      items:
        type: object
        additionalProperties: false
        required: [name, value]
        properties:
          name:
            type: string
          value:
            type: string
