$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Status messages
status: stable
description: Mensagem de estado anunciada corretamente por tecnologias assistivas.
group: ACULTA
props:
  type: object
  additionalProperties: false
  required: [type]
  properties:
    attributes:
      type: Drupal\Core\Template\Attribute
      title: Atributos HTML opcionais
      default: null
    type:
      type: string
      enum: [status, info, warning, error]
    role:
      type: [string, 'null']
      enum: [status, alert, null]
      default: null
      title: Papel acessível
      description: Sobrescreve o papel anunciado quando um consumer precisa preservar um contrato específico.
    dismissible:
      type: boolean
      default: false
      title: Dispensável
      description: Exibe o controle de fechamento quando o consumer fornece um comportamento de dispensa.
    close_label:
      type: string
      default: Fechar aviso
      title: Rótulo do controle de fechamento
      minLength: 1
    messages:
      type: array
      minItems: 0
      default: []
      items:
        type: [string, object]
slots:
  content:
    title: Conteúdo rico da mensagem
    description: Render arrays para mensagens com links, ações ou markup próprio; quando informado, substitui a lista messages.
