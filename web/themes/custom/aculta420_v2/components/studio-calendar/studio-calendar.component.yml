$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Calendário do Studio Dashboard
description: Componente visual do calendário no painel de conta, com navegação de mês, filtros por tipo, grade de dias, resumo e ação de adicionar proposta.
group: Studio
status: experimental
props:
  type: object
  additionalProperties: false
  required: [title, current_month_label, active_filter]
  properties:
    title:
      title: Título do calendário
      type: string
      minLength: 1
      default: Calendário
    current_month_label:
      title: Mês atualmente exibido
      type: string
      minLength: 1
    previous_url:
      title: Endereço do mês anterior
      type: [string, 'null']
    next_url:
      title: Endereço do próximo mês
      type: [string, 'null']
    active_filter:
      title: Filtro de calendário ativo
      type: string
      enum: [cursos, eventos, meus_eventos]
      default: cursos
    filters:
      title: Filtros disponíveis
      type: array
      items:
        type: object
        required: [id, label, url, active]
        properties:
          id:
            type: string
          label:
            type: string
          url:
            type: string
          active:
            type: boolean
    weeks:
      title: Semanas e dias do calendário
      type: array
      items:
        type: array
        items:
          type: object
          required: [day_number, is_current_month, is_today, is_selected, count]
          properties:
            day_number:
              type: [integer, string, 'null']
            date_string:
              type: [string, 'null']
            is_current_month:
              type: boolean
            is_today:
              type: boolean
            is_selected:
              type: boolean
            count:
              type: integer
            url:
              type: [string, 'null']
    selected_date_label:
      title: Data selecionada
      type: [string, 'null']
    selected_day_events:
      title: Eventos da data selecionada
      type: array
      items:
        type: object
        required: [title]
        properties:
          title:
            type: string
          time:
            type: [string, 'null']
          location:
            type: [string, 'null']
          url:
            type: [string, 'null']
          is_cancelled:
            type: boolean
    can_add_event:
      title: Permitir inclusão de evento
      type: boolean
      default: false
    add_event_url:
      title: Endereço para incluir evento
      type: [string, 'null']
