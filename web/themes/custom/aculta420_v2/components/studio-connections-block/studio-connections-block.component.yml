$schema: https://git.drupalcode.org/project/drupal/-/raw/11.x/core/assets/schemas/v1/metadata.schema.json
name: Bloco Conexões do Studio Dashboard
description: Bloco de conexões para o Studio Dashboard com resumo das 3 primeiras conexões ou estado vazio.
group: Studio
status: experimental
props:
  type: object
  additionalProperties: false
  required: [title, empty_message, find_connections_label, find_connections_url]
  properties:
    title:
      title: Título do bloco de conexões
      type: string
      default: CONEXÕES
    connections:
      title: Conexões aceitas
      type: array
      items:
        type: object
        required: [name, profile_url]
        properties:
          name:
            type: string
          profile_url:
            type: string
          avatar_url:
            type: [string, 'null']
          avatar_alt:
            type: [string, 'null']
    empty_message:
      title: Mensagem sem conexões
      type: string
      default: Você ainda não tem conexões
    find_connections_label:
      title: Texto do link para buscar conexões
      type: string
      default: Encontrar conexões
    find_connections_url:
      title: Endereço para buscar conexões
      type: string
    all_connections_label:
      title: Texto do link para todas as conexões
      type: string
      default: Ver todas
    all_connections_url:
      title: Endereço de todas as conexões
      type: [string, 'null']
