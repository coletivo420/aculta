name: Moldura tricolor com formulário
description: Composição de moldura de destaque tricolor com campos de formulário Form API.
component: aculta420_v2:surface-accent
props:
  accent: tricolor
  position: top
  tone: raised
  radius: lg
  spacing: normal
  elevation: subtle
slots:
  content:
    type: inline_template
    template: '<form style="display:flex;flex-direction:column;gap:1rem;"><h4 style="margin:0;">Formulário de Contato</h4>{{ include("aculta420_v2:form-field", { label: "Nome do Participante", name: "nome" }, with_context = false) }}{{ include("aculta420_v2:form-field", { label: "E-mail Institucional", name: "email" }, with_context = false) }}<div style="margin-block-start:0.5rem;">{{ include("aculta420_v2:button", { text: "Enviar Inscrição", variant: "primary" }, with_context = false) }}</div></form>'
