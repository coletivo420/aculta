name: Composição em grade
description: Composição de múltiplas superfícies e molduras distribuídas em uma grade responsiva.
component: aculta420_v2:layout-grid
props:
  min_item_width: 16rem
slots:
  content:
    type: inline_template
    template: '<div>{{ include("aculta420_v2:surface-accent", { accent: "green", position: "start" }, with_context = false) }}</div><div>{{ include("aculta420_v2:surface-accent", { accent: "yellow", position: "start" }, with_context = false) }}</div><div>{{ include("aculta420_v2:surface-accent", { accent: "red", position: "start" }, with_context = false) }}</div>'
