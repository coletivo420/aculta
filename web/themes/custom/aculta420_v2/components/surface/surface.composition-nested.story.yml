name: Superfícies aninhadas
description: Demonstração de uma superfície secundária aninhada dentro de uma superfície principal.
component: aculta420_v2:surface
props:
  tone: green-soft
  radius: lg
  spacing: normal
  elevation: subtle
  border: subtle
slots:
  content:
    type: inline_template
    template: '<div><h4 style="margin-block-start:0;">Superfície Contêiner Externa</h4><p>Texto do contêiner externo.</p>{% embed "aculta420_v2:surface" with { tone: "raised", radius: "md", spacing: "compact", elevation: "none", border: "subtle" } only %}{% block content %}<p>Cartão branco interno.</p>{% endblock %}{% endembed %}</div>'
