# Configuração do tema ACULTA420 V2 (ver docs/configuracao-do-tema.md).
aculta420_v2.settings:
  type: theme_settings
  label: 'ACULTA420 V2 settings'
  mapping:
    aculta_radius_button:
      type: string
      label: 'Raio dos botões'
    aculta_radius_card:
      type: string
      label: 'Raio dos cartões e blocos'
    aculta_radius_field:
      type: string
      label: 'Raio dos campos de formulário'
    aculta_accent_override:
      type: string
      label: 'Cor da faixa de acento'
    aculta_show_accent_stripe:
      type: boolean
      label: 'Mostrar faixa de acento'
    aculta_revista_accent:
      type: mapping
      label: 'Faixa de acento da Revista'
      mapping:
        selected:
          type: mapping
          mapping:
            revista_accent:
              type: string
              label: 'Estilo UI Styles da Revista'
        extra:
          type: string
          label: 'Classes extras'
    aculta_shell_variant:
      type: string
      label: 'Variante do shell da página (classic ou v2)'
    aculta_purpose_palette:
      type: mapping
      label: 'Paleta de destaque por purpose'
      mapping:
        main:
          type: string
          label: 'Variante de destaque do purpose main'
        wiki:
          type: string
          label: 'Variante de destaque do purpose wiki'
        account:
          type: string
          label: 'Variante de destaque do purpose account'
        support:
          type: string
          label: 'Variante de destaque do purpose support'
        shop:
          type: string
          label: 'Variante de destaque do purpose shop'
        magazine:
          type: string
          label: 'Variante de destaque do purpose magazine'
        courses:
          type: string
          label: 'Variante de destaque do purpose courses'
        forum:
          type: string
          label: 'Variante de destaque do purpose forum'
        eventos:
          type: string
          label: 'Variante de destaque do purpose eventos'
        links:
          type: string
          label: 'Variante de destaque do purpose links'
    aculta_purpose_container:
      type: mapping
      label: 'Layout de container por purpose'
      mapping:
        main:
          type: aculta420_v2.purpose_container_layout
          label: 'Layout de container do purpose main'
        account:
          type: aculta420_v2.purpose_container_layout
          label: 'Layout de container do purpose account'
        support:
          type: aculta420_v2.purpose_container_layout
          label: 'Layout de container do purpose support'
        magazine:
          type: aculta420_v2.purpose_container_layout
          label: 'Layout de container do purpose magazine'
        wiki:
          type: aculta420_v2.purpose_container_layout
          label: 'Layout de container do purpose wiki'
        shop:
          type: aculta420_v2.purpose_container_layout
          label: 'Layout de container do purpose shop'
        courses:
          type: aculta420_v2.purpose_container_layout
          label: 'Layout de container do purpose courses'
        forum:
          type: aculta420_v2.purpose_container_layout
          label: 'Layout de container do purpose forum'
        eventos:
          type: aculta420_v2.purpose_container_layout
          label: 'Layout de container do purpose eventos'
        links:
          type: aculta420_v2.purpose_container_layout
          label: 'Layout de container do purpose links'

aculta420_v2.purpose_container_layout:
  type: mapping
  label: 'Definição de layout de container'
  mapping:
    mode:
      type: string
      label: 'Modo do container (default, full, narrow)'
    style:
      type: string
      label: 'Estilo do container (boxed, unboxed); vale para default e narrow'
    container_width:
      type: integer
      label: 'Largura do container (px)'
    narrow_width:
      type: integer
      label: 'Largura estreita do container (px)'

